name: Install ce-libify
description: >-
  Clone, test and install ce-libify. CE_TOOLCHAIN_REF pins its
  CE-Programming/toolchain include fetches to the revision this build pins.

inputs:
  ce-libify-ref:
    description: ce-libify tag or branch to install (CE_LIBIFY_REF).
    required: true
  toolchain-ref:
    description: >-
      CE-Programming/toolchain revision the includes must come from
      (TOOLCHAIN_REF).
    required: true
  cedev:
    description: CEDEV directory to install into.
    required: true

runs:
  using: composite
  steps:
    - name: Clone, pin and install ce-libify
      shell: bash
      env:
        CE_LIBIFY_REF: ${{ inputs.ce-libify-ref }}
        CE_TOOLCHAIN_REF: ${{ inputs.toolchain-ref }}
        CEDEV: ${{ inputs.cedev }}
        DEST: ${{ runner.temp }}/ce-libify
      run: |
        set -euo pipefail
        git clone --depth 1 --branch "$CE_LIBIFY_REF" \
          https://github.com/alessiodam/toolchain_libify.git "$DEST"

        GOCACHE="${{ runner.temp }}/go-cache" go test -C "$DEST" ./...
        make -C "$DEST" install CEDEV="$CEDEV" PYTHON=python3
        ce-libify --version
