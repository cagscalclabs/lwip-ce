name: lwIP-CE emulator environment
description: >
  CEdev with this workflow run's lwip-latest build installed, the decrypted CE ROM,
  the shared dyload files in tests/common, and the CEmu-lwIP-CE autotester
  with its emulated USB Ethernet adapter bridged to a NATed TAP interface.

inputs:
  rom-key:
    description: ROM decryption passphrase (secrets.AES_ENCRYPT_KEY).
    required: true
outputs:
  autotester:
    description: Path to the autotester binary.
    value: ${{ steps.cemu.outputs.autotester }}
  image-autotester:
    description: Path to the networked autotester that loads AUTOTESTER_IMAGE.
    value: ${{ runner.temp }}/cemu-autotester-image
  usb-step:
    description: Autotester sequence step that plugs the Ethernet adapter in.
    value: ${{ steps.cemu.outputs.usb-step }}
  patched-image:
    description: Path to the decrypted patched CEmu image (.ce) with lwIP installed.
    value: ${{ runner.temp }}/ce-patched.ce

runs:
  using: composite
  steps:
    - name: Load pinned CI dependency versions
      id: ci_versions
      shell: bash
      run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

    - name: Cache CEdev Toolchain
      id: cedev-cache
      uses: actions/cache@v5
      with:
        path: ${{ github.workspace }}/CEdev
        key: ${{ runner.os }}-cedev-${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}

    - name: Download and extract CEdev
      if: steps.cedev-cache.outputs.cache-hit != 'true'
      shell: bash
      run: curl -sL "github.com/CE-Programming/toolchain/releases/download/${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}/CEdev-Linux.tar.gz" | tar xz

    - name: Add CEdev to PATH
      shell: bash
      run: |
        echo "CEDEV=${{ github.workspace }}/CEdev" >> "$GITHUB_ENV"
        echo "${{ github.workspace }}/CEdev/bin" >> "$GITHUB_PATH"

    - name: Download this run's lwip-latest artifact
      uses: actions/download-artifact@v4
      with:
        name: lwip-latest
        path: ${{ github.workspace }}/release

    - name: Install lwip.lib + headers into CEdev
      shell: bash
      run: |
        mkdir -p "$CEDEV/lib/libload" "$CEDEV/include"
        cp release/lwip.lib "$CEDEV/lib/libload/lwip.lib"
        cp release/*.h "$CEDEV/include/"
        cp -r release/lwip "$CEDEV/include/lwip"

    - name: Prepare shared dyload test files
      shell: bash
      run: |
        mkdir -p tests/common
        cp release/appinst/* release/lwip.8xv release/lwip.lib tests/common/
        curl -fsSL --retry 3 -o tests/common/lwIPCERT.8xv \
          "https://github.com/${{ github.repository }}/releases/download/truststore-latest/lwIPCERT.8xv"
        curl -fsSL --retry 3 -o tests/common/clibs.8xg \
          https://github.com/CE-Programming/libraries/releases/latest/download/clibs.8xg
        ls -lh tests/common

    - name: Download encrypted CEmu ROM artifact
      uses: actions/download-artifact@v4
      with:
        name: cemu-rom-encrypted
        path: ${{ runner.temp }}

    - name: Download patched CEmu image artifact
      uses: actions/download-artifact@v4
      with:
        name: cemu-rom-patched
        path: ${{ runner.temp }}

    - name: Decrypt CE ROM and patched image
      shell: bash
      env:
        ROM_KEY: ${{ inputs.rom-key }}
      run: |
        gpg --batch --yes --passphrase "$ROM_KEY" --output "$RUNNER_TEMP/ce.rom" --decrypt "$RUNNER_TEMP/CE.rom.enc"
        shred -u "$RUNNER_TEMP/CE.rom.enc"
        gpg --batch --yes --passphrase "$ROM_KEY" --output "$RUNNER_TEMP/ce-patched.ce" --decrypt "$RUNNER_TEMP/ce-patched.ce.enc"
        shred -u "$RUNNER_TEMP/ce-patched.ce.enc"
        echo "AUTOTESTER_ROM=$RUNNER_TEMP/ce.rom" >> "$GITHUB_ENV"
        echo "AUTOTESTER_IMAGE=$RUNNER_TEMP/ce-patched.ce" >> "$GITHUB_ENV"
        chmod 755 "$RUNNER_TEMP/cemu-autotester-image"
        strings "$RUNNER_TEMP/cemu-autotester-image" | grep -q "AUTOTESTER_IMAGE"

    - name: Set up CEmu with emulated networking
      id: cemu
      uses: alessiodam/cemu-net-action@v1
      with:
        cemu-ref: ${{ steps.ci_versions.outputs.CEMU_REF }}
