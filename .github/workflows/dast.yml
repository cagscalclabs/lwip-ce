name: DAST

# Renders the committed lwIP-CE DAST report (tests/dast.json) into the job
# summary and fails the run if any probe was graded "fail".
#
# The report itself is produced OUT OF BAND, by an operator running
# build-tools/dast/lwip-dast.sh --ip <calc> against a calc on a live network
# (the calc runs the paired harness in tests/profiling/lwip_dast). Crash vs
# abort is a human judgement, so generation can't run in CI — this workflow
# is the gate/visibility layer over whatever report was committed.

on:
  workflow_dispatch:
  workflow_call:
  # A tests/dast.json-only commit (an operator publishing a fresh report)
  # should re-render/gate it on its own, without pulling in the full
  # rebuild + unit tests + CAVP chain that build.yml's path filter
  # deliberately skips for this exact file -- see that filter's comment.
  push:
    branches: [master]
    paths:
      - 'tests/dast.json'
  pull_request:
    paths:
      - 'tests/dast.json'

permissions:
  contents: read

jobs:
  dast_report:
    name: DAST report + gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the staleness check below walks `git log -- src/`
          # to find the last commit touching src/, which a shallow (depth-1)
          # clone can't resolve correctly (it only ever has HEAD itself).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check report covers current src/ commit
        run: |
          report_commit=$(python3 -c "
          import json
          with open('tests/dast.json') as f:
              d = json.load(f)
          print(d.get('src_commit', ''))
          ")
          src_commit=$(git log -1 --format="%H" -- src/)
          if [ -z "$src_commit" ]; then
            echo "No commits touch src/ — skipping staleness check."
            exit 0
          fi
          echo "Report tested : $report_commit"
          echo "Current src/  : $src_commit"
          if [ "$report_commit" != "$src_commit" ]; then
            echo "::error::dast.json was generated against $report_commit but src/ is now at $src_commit — re-run the DAST harness and commit a fresh report."
            exit 1
          fi
          echo "Report is current."

      - name: Render report to job summary and gate on failures
        run: |
          python3 build-tools/dast/dast_report.py --summary "$GITHUB_STEP_SUMMARY"
