name: DAST

# Renders the committed lwIP-CE DAST report (tests/dast.json) into the job
# summary and fails the run if any probe was graded "fail".
#
# The report itself is produced OUT OF BAND, by an operator running
# build-tools/dast/lwip-dast.sh --ip <calc> against a calc on a live network
# (the calc runs the paired harness in tests/profiling/lwip_dast). Crash vs
# abort is a human judgement, so generation can't run in CI — this workflow
# is the gate/visibility layer over whatever report was committed.

on:
  workflow_dispatch:
  workflow_call:
  # A tests/dast.json-only commit (an operator publishing a fresh report)
  # should re-render/gate it on its own, without pulling in the full
  # rebuild + unit tests + CAVP chain that build.yml's path filter
  # deliberately skips for this exact file -- see that filter's comment.
  push:
    branches: [master]
    paths:
      - 'tests/dast.json'
  pull_request:
    paths:
      - 'tests/dast.json'

permissions:
  contents: read

jobs:
  dast_report:
    name: DAST report + gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep full history so the report's src_commit remains useful
          # provenance even though freshness is decided by src_hash.
          fetch-depth: 0
          # src/ includes the X25519 gitlink, and its working-tree contents are
          # part of the source fingerprint produced by the local DAST runner.
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check report covers current src/ contents
        run: |
          readarray -t report_source < <(python3 -c "
          import json
          with open('tests/dast.json') as f:
              d = json.load(f)
          print(d.get('src_commit', ''))
          print(d.get('src_hash', ''))
          ")
          report_commit=${report_source[0]}
          report_hash=${report_source[1]}
          current_hash=$(python3 build-tools/dast/lwip-dast.py --src-hash)
          if [ -z "$report_hash" ]; then
            echo "::error::dast.json has no src_hash — re-run the DAST harness once to record the exact tested source contents."
            exit 1
          fi
          echo "Report commit : $report_commit (provenance only)"
          echo "Report src hash: $report_hash"
          echo "Current src hash: $current_hash"
          if [ "$report_hash" != "$current_hash" ]; then
            echo "::error::dast.json covers different src/ contents — re-run the DAST harness and commit the refreshed report."
            exit 1
          fi
          echo "Report covers the current src/ contents."

      - name: Render report to job summary and gate on failures
        run: |
          python3 build-tools/dast/dast_report.py --summary "$GITHUB_STEP_SUMMARY"
