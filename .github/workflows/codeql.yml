name: CodeQL

# Advanced-setup CodeQL scanning, scoped to skip files that are
# byte-identical (content-wise) to upstream lwIP as of the last sync
# (see sync-upstream.yml). Unmodified upstream code isn't this project's
# code to fix, and scanning it just adds noise to the Security tab. The
# exclusion list is computed fresh on every run from a merge-base diff
# against lwip-tcpip/lwip (the same approach sast.yml uses for its scan
# targets), so it never goes stale after a quarterly upstream sync --
# a hand-maintained static list would have to be re-generated by hand
# every time sync-upstream.yml lands a merge.
#
# This is eZ80 cross-compiled code via the CEdev toolchain, not a
# standard host build, so CodeQL's autobuild can't trace it. Build mode
# is manual: the toolchain setup and build invocation below mirror
# build.yml's "make dylib" step exactly (same steps, same env), wrapped
# by codeql-action so it traces the real compiler invocations.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  CEDEV: ${{ github.workspace }}/CEdev
  CEDEV_BIN: ${{ github.workspace }}/CEdev/bin
  TOOLCHAIN_SRC: ${{ github.workspace }}/toolchain

jobs:
  analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout lwIP-CE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Compute upstream-unchanged paths to ignore
        id: ignore
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add upstream-lwip https://github.com/lwip-tcpip/lwip.git || true
          git fetch --no-tags upstream-lwip master

          BASE="$(git merge-base HEAD FETCH_HEAD || true)"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          echo "CodeQL exclusion baseline: $BASE"

          # Files genuinely touched since the upstream merge-base (content
          # changes only -- numstat's own 0/0 filter drops mode-only diffs
          # like an executable-bit flip with no byte change).
          git diff --numstat --diff-filter=ACMR "$BASE" HEAD -- src \
            | awk '($1 != "0" || $2 != "0") {print $3}' \
            | grep -E '\.(c|h)$' \
            | sort -u > /tmp/changed_files.txt || true

          find src -type f \( -iname '*.c' -o -iname '*.h' \) \
            | sed 's|^\./||' | sort -u > /tmp/all_src_files.txt

          comm -23 /tmp/all_src_files.txt /tmp/changed_files.txt > /tmp/unchanged_files.txt

          echo "Excluding $(wc -l < /tmp/unchanged_files.txt) byte-identical-to-upstream files from CodeQL."

          {
            echo "name: \"lwIP-CE CodeQL config (generated)\""
            echo "paths-ignore:"
            while IFS= read -r f; do
              [ -n "$f" ] && echo "  - \"$f\""
            done < /tmp/unchanged_files.txt
          } > "$GITHUB_WORKSPACE/codeql-config.generated.yml"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          config-file: ${{ github.workspace }}/codeql-config.generated.yml

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make tar curl unzip libxml2-utils unifdef python3 python3-clang libclang-dev

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/CEdev
          key: ${{ runner.os }}-cedev-v15.0

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL github.com/CE-Programming/toolchain/releases/download/v15.0/CEdev-Linux.tar.gz | tar xz

      - name: Add CEdev to PATH
        run: |
          echo "${{ github.workspace }}/CEdev/bin" >> "$GITHUB_PATH"

      - name: Checkout CEdev toolchain source
        uses: actions/checkout@v4
        with:
          repository: CE-Programming/toolchain
          ref: master
          path: ${{ env.TOOLCHAIN_SRC }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout fixed convbin branch
        uses: actions/checkout@v4
        with:
          repository: mateoconlechuga/convbin
          ref: R_Z80_BYTE012
          path: ${{ env.TOOLCHAIN_SRC }}/tools/convbin
          submodules: recursive
          persist-credentials: false

      - name: Build toolchain fasmg support
        run: |
          make -C "${{ env.TOOLCHAIN_SRC }}/tools/fasmg"
          cd "${{ env.TOOLCHAIN_SRC }}/tools/fasmg/fasmg-ez80"
          ./bin/install_fasmg
          cmake -E copy bin/fasmg "${{ env.CEDEV_BIN }}/fasmg"
          test "$(command -v fasmg)" = "${{ env.CEDEV_BIN }}/fasmg"
          fasmg /dev/null /dev/null

      - name: Build fixed convbin from source
        run: |
          test -f "${{ env.TOOLCHAIN_SRC }}/tools/convbin/Makefile"
          make -C "${{ env.TOOLCHAIN_SRC }}/tools/convbin" clean || true
          make -C "${{ env.TOOLCHAIN_SRC }}/tools/convbin" -j"$(nproc)"
          cmake -E copy "${{ env.TOOLCHAIN_SRC }}/tools/convbin/bin/convbin" "${{ env.CEDEV_BIN }}/convbin"
          "${{ env.CEDEV_BIN }}/convbin" --version || true

      # TEMPORARY: the v15.0 release CEdev/meta/makefile.mk hard-assigns
      # LINKER_SCRIPT with `=`/`:=`, so our makefile's
      # `LINKER_SCRIPT = build-tools/meta/linker_script_lwip.ld` cannot win and the app links
      # against the stock script (missing our overlay/PROVIDE symbols ->
      # undefined references). master already fixed this to `?=`. Patch the
      # release meta in place to `?=` so our assignment takes effect.
      # REMOVE this step once a CEdev release ships the `?=` fix.
      - name: Patch CEdev meta LINKER_SCRIPT to ?= (temporary)
        run: |
          META="${{ env.CEDEV }}/meta/makefile.mk"
          sed -i -E 's/^([[:space:]]*LINKER_SCRIPT[[:space:]]*):?=([^=])/\1?=\2/' "$META"

      - name: make dylib (traced by CodeQL)
        env:
          LWIP_SKIP_DEP_CHECKOUT: '1'
          APP_TOOLS_DIR: ${{ github.workspace }}/submodules/app_tools
          TOOLCHAIN_DIR: ${{ env.TOOLCHAIN_SRC }}
          TOOLCHAIN_SRC: ${{ env.TOOLCHAIN_SRC }}/src
          CEDEV: ${{ env.CEDEV }}
          FASMG: fasmg
          CONVBIN: ${{ env.CEDEV_BIN }}/convbin
          HEADER_PYTHON: python3
        run: ./build-tools/build-release-dylib.sh

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
