name: Deploy

# Deployments are dispatched by build.yml only after the branch gate passes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lwip-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CEDEV: ${{ github.workspace }}/CEdev
  CEDEV_BIN: ${{ github.workspace }}/CEdev/bin

jobs:
  deploy:
    name: Publish ${{ github.ref_name }}
    if: github.ref_name == 'master' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lwIP-CE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Load pinned CI dependency versions
        id: ci_versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make tar curl unzip zip libxml2-utils unifdef python3 python3-clang libclang-dev

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/CEdev
          key: ${{ runner.os }}-cedev-${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://github.com/CE-Programming/toolchain/releases/download/${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}/CEdev-Linux.tar.gz" | tar xz

      - name: Add CEdev to PATH
        run: echo "${{ github.workspace }}/CEdev/bin" >> "$GITHUB_PATH"

      - name: Checkout fixed convbin branch
        uses: actions/checkout@v4
        with:
          repository: mateoconlechuga/convbin
          ref: R_Z80_BYTE012
          path: ${{ github.workspace }}/convbin
          submodules: recursive
          persist-credentials: false

      - name: Build fixed convbin from source
        run: |
          make -C "${{ github.workspace }}/convbin" -j"$(nproc)"
          cmake -E copy "${{ github.workspace }}/convbin/bin/convbin" "${{ env.CEDEV_BIN }}/convbin"
          "${{ env.CEDEV_BIN }}/convbin" --version || true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install ce-libify
        run: |
          git clone --depth 1 --branch "${{ steps.ci_versions.outputs.CE_LIBIFY_REF }}" https://github.com/alessiodam/toolchain_libify.git "${{ runner.temp }}/ce-libify"
          GOCACHE="${{ runner.temp }}/go-cache" go test -C "${{ runner.temp }}/ce-libify" ./...
          make -C "${{ runner.temp }}/ce-libify" install CEDEV="${{ env.CEDEV }}" PYTHON=python3
          ce-libify --version

      - name: Build binaries
        run: make dylib

      - name: Verify binaries
        run: |
          test -f "${{ github.workspace }}/build/lwip.8xv"
          test -f "${{ github.workspace }}/build/lwip.lib"
          test -f "${{ env.CEDEV }}/lib/libload/lwip.lib"
          test -d "${{ env.CEDEV }}/include/lwip"

      - name: Package release
        run: make release

      - name: Normalize release archive
        # Checkout/build mtimes otherwise make an unchanged release hash
        # differently on every runner.
        run: |
          set -euo pipefail
          source_date_epoch=$(git show -s --format=%ct HEAD)
          find build -exec touch -d "@$source_date_epoch" {} +
          find build -type f -print | LC_ALL=C sort > "$RUNNER_TEMP/release-files.txt"
          rm -f lwip.zip
          TZ=UTC zip -X lwip.zip -@ < "$RUNNER_TEMP/release-files.txt"
          test -s lwip.zip

      - name: Compare latest-stable archive
        id: compare
        if: github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_hash=$(sha256sum lwip.zip | awk '{print $1}')
          changed=true
          mkdir -p "$RUNNER_TEMP/previous-release"
          if gh release download latest-stable --repo "${{ github.repository }}" \
            --pattern lwip.zip --dir "$RUNNER_TEMP/previous-release" 2>/dev/null; then
            previous_hash=$(sha256sum "$RUNNER_TEMP/previous-release/lwip.zip" | awk '{print $1}')
            if [ "$current_hash" = "$previous_hash" ]; then
              changed=false
            fi
            echo "previous_hash=$previous_hash" >> "$GITHUB_OUTPUT"
          fi
          echo "current_hash=$current_hash" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Hash nightly archive
        id: nightly_hash
        if: github.ref_name == 'staging'
        run: echo "current_hash=$(sha256sum lwip.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish release channel
        id: publish
        if: github.ref_name == 'staging' || steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_HASH: ${{ steps.compare.outputs.current_hash }}
          NIGHTLY_HASH: ${{ steps.nightly_hash.outputs.current_hash }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = master ]; then
            tag=latest-stable
            title="lwIP-CE Latest Stable"
            archive_hash="$STABLE_HASH"
          else
            tag=nightly
            title="lwIP-CE Nightly"
            archive_hash="$NIGHTLY_HASH"
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Automated build from \`${{ github.ref_name }}\`."
            echo
            echo "- Commit: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo "- SHA-256 (lwip.zip): \`$archive_hash\`"
            echo "- [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > "$notes"

          git tag --force "$tag" "${{ github.sha }}"
          git push --force origin "refs/tags/$tag"

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ "$tag" = nightly ]; then
              gh release edit "$tag" --repo "${{ github.repository }}" \
                --title "$title" --notes-file "$notes" --prerelease
            else
              gh release edit "$tag" --repo "${{ github.repository }}" \
                --title "$title" --notes-file "$notes" --latest
            fi
          else
            if [ "$tag" = nightly ]; then
              gh release create "$tag" --repo "${{ github.repository }}" \
                --verify-tag --title "$title" --notes-file "$notes" --prerelease
            else
              gh release create "$tag" --repo "${{ github.repository }}" \
                --verify-tag --title "$title" --notes-file "$notes" --latest
            fi
          fi
          gh release upload "$tag" lwip.zip --repo "${{ github.repository }}" --clobber
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lwip-${{ github.ref_name }}-${{ github.sha }}
          path: |
            build/
            lwip.zip
          if-no-files-found: error

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Deployment"
            echo
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            if [ "${{ job.status }}" != success ]; then
              echo "- Result: deployment failed"
            elif [ "${{ github.ref_name }}" = master ] && [ "${{ steps.compare.outputs.changed }}" != true ]; then
              echo "- Result: \`latest-stable\` unchanged (archive hash matched)"
            else
              echo "- Result: published \`${{ steps.publish.outputs.tag }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
