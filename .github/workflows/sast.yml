name: SAST

on:
  push:
    branches: [ master, tls ]
    paths:
      - 'src/**'
      - '.github/workflows/sast.yml'
  pull_request:
    branches: [ master, tls ]
    paths:
      - 'src/**'
      - '.github/workflows/sast.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep-scan:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep
    # Skip any PR created by dependabot to avoid permission issues:
    if: (github.actor != 'dependabot[bot]')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build SAST target list
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add source https://github.com/lwip-tcpip/lwip.git || true
          git fetch --no-tags source master

          BASE="$(git merge-base HEAD FETCH_HEAD || true)"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          git diff --numstat --diff-filter=ACMR "$BASE" HEAD -- src \
            | awk '($1 != "0" || $2 != "0") {print $3}' \
            | grep -E '\.(c|h)$' \
            | sort -u > semgrep-targets.txt || true

          echo "SAST baseline: $BASE"
          echo "SAST targets:"
          cat semgrep-targets.txt

      # Scan files that are new or changed relative to upstream lwIP.
      - run: |
          if [ -s semgrep-targets.txt ]; then
            set --
            while IFS= read -r target; do
              set -- "$@" --include "$target"
            done < semgrep-targets.txt
            semgrep ci --sarif "$@" > semgrep.sarif
          else
            printf '{"version":"2.1.0","runs":[]}\n' > semgrep.sarif
          fi
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()
