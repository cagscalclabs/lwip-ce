name: Generate Truststore AppVar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 */3 *"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/truststore.yml"
      - "src/tls/includes/truststore.h"
      - "src/tls/core/truststore.c"
      - "src/tls/core/handshake.c"

permissions:
  contents: write

env:
  # Registry of key types this truststore generator accepts for root certs.
  # Roots are gated on their PUBLIC KEY (type/size), not their own
  # self-signature algorithm: a root's self-signature is never
  # cryptographically verified (see tls_cert_walker), so excluding e.g. a
  # SHA-1-self-signed root with a perfectly good RSA-2048 key would just
  # throw away a valid, widely-trusted root for no security benefit.
  #
  # Each entry must have:
  #   serialized_id:  integer written into tls_truststore_entry.alg_id (matches tls_cert_sig_alg_t)
  #   key_type:       "rsa" or "ec" -- which root public key type maps to this id
  #   oid:            ASN.1 dotted OID, for documentation/reference only
  #   display_name:   shown in the job summary
  # To add a new key type: add an entry here AND add the matching enum value to
  # tls_cert_sig_alg_t in src/tls/includes/truststore.h.
  #
  # Note: RSA-PSS-SHA256 (id 0) has no generator entry below -- there is no
  # reliable signal in a root cert to tell PSS apart from PKCS1 v1.5, so all
  # RSA roots are classified as RSA-PKCS1-SHA256 (id 1), matching the
  # overwhelmingly common case in practice.
  TRUSTSTORE_ALLOWED_ALGS: |
    - serialized_id: 1
      key_type: "rsa"
      oid: "1.2.840.113549.1.1.11"
      display_name: "RSA-PKCS1-SHA256"
    - serialized_id: 2
      key_type: "ec"
      oid: "1.2.840.10045.4.3.2"
      display_name: "ECDSA-SHA256"

jobs:
  truststore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make tar openssl python3-yaml

      - name: Download and extract CEdev
        run: |
          curl -sL github.com/CE-Programming/toolchain/releases/download/v15.0/CEdev-Linux.tar.gz | tar xz

      - name: Add CEdev to PATH
        run: |
          echo "CEdev/bin" >> $GITHUB_PATH

      - name: Write signing key
        env:
          TRUSTSTORE_SIGNER: ${{ secrets.TRUSTSTORE_SIGNER }}
        run: |
          SIGNER_KEY="${RUNNER_TEMP}/truststore_signer.pem"
          printf '%s' "$TRUSTSTORE_SIGNER" > "$SIGNER_KEY"
          chmod 600 "$SIGNER_KEY"
          if [ ! -s "$SIGNER_KEY" ]; then
            echo "TRUSTSTORE_SIGNER is empty or unavailable."
            exit 1
          fi
          openssl pkey -in "$SIGNER_KEY" -noout >/dev/null

      - name: Generate truststore binary
        run: |
          python3 - <<'PY'
          import calendar
          import hashlib
          import os
          import re
          import struct
          import subprocess
          import time
          import yaml
          from datetime import datetime
          from glob import glob

          # Registry maps each *key type* this truststore can hold to the
          # tls_cert_sig_alg_t id stored in tls_truststore_entry.alg_id. This
          # gates entries by the root's key (RSA modulus size / EC curve), not
          # by the root's own self-signature algorithm -- root self-signatures
          # are never cryptographically verified (see tls_cert_walker), so an
          # old root that self-signed with SHA-1 but holds a perfectly good
          # RSA-2048 key is still admitted.
          _alg_registry = yaml.safe_load(os.environ["TRUSTSTORE_ALLOWED_ALGS"])
          KEY_TYPE_TO_SERIALIZED_ID = {e["key_type"]: e["serialized_id"] for e in _alg_registry}
          ID_TO_DISPLAY = {e["serialized_id"]: e["display_name"] for e in _alg_registry}

          SUBJECT_LEN  = 32
          SKI_LEN      = 32
          RSA_MOD_MIN  = 256   # 2048 bits
          RSA_MOD_MAX  = 512   # 4096 bits
          EC_POINT_LEN = 65
          # Fixed-size prefix before key[]: len(4) + subject Name digest(32) +
          # ski(32) + expiry_start(4) + expiry_end(4) + alg_id(1) = 77
          ENTRY_FIXED_PREFIX = 4 + SUBJECT_LEN + SKI_LEN + 4 + 4 + 1
          INDEX_ENTRY_LEN = 32 + 2  # fixed key plus uint16 metadata offset

          def run_cmd(args, input_bytes=None):
              result = subprocess.run(
                  args, input=input_bytes,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False,
              )
              if result.returncode != 0:
                  raise RuntimeError(
                      f"command failed: {' '.join(args)}\n{result.stderr.decode('utf-8', 'ignore')}"
                  )
              return result.stdout

          def extract_cn(name_line):
              match = re.search(r"CN=([^,/]+)", name_line)
              if match:
                  return match.group(1).strip()
              return name_line.strip()

          def pad_field(data, length):
              data = data[:length]
              return data + b"\x00" * (length - len(data))

          def der_tlv(blob, offset):
              """Return (tag, value_start, end) for one definite-length DER TLV."""
              if offset + 2 > len(blob):
                  raise RuntimeError("truncated DER")
              tag = blob[offset]
              first_len = blob[offset + 1]
              pos = offset + 2
              if first_len & 0x80:
                  count = first_len & 0x7f
                  if count == 0 or count > 4 or pos + count > len(blob):
                      raise RuntimeError("invalid DER length")
                  length = int.from_bytes(blob[pos:pos + count], "big")
                  pos += count
              else:
                  length = first_len
              end = pos + length
              if end > len(blob):
                  raise RuntimeError("truncated DER value")
              return tag, pos, end

          def extract_subject_name_digest(path):
              """SHA-256 over the exact DER Subject Name TLV from Certificate."""
              cert = run_cmd(["openssl", "x509", "-in", path, "-outform", "DER"])
              tag, cert_body, cert_end = der_tlv(cert, 0)
              if tag != 0x30 or cert_end != len(cert):
                  raise RuntimeError("invalid Certificate DER")
              tag, tbs_body, tbs_end = der_tlv(cert, cert_body)
              if tag != 0x30:
                  raise RuntimeError("missing TBSCertificate")
              pos = tbs_body
              tag, _value, end = der_tlv(cert, pos)
              if tag == 0xa0:  # explicit version
                  pos = end
              # serialNumber, signature, issuer, validity precede subject.
              for _ in range(4):
                  _tag, _value, pos = der_tlv(cert, pos)
              subject_start = pos
              tag, _value, subject_end = der_tlv(cert, subject_start)
              if tag != 0x30 or subject_end > tbs_end:
                  raise RuntimeError("missing Subject Name")
              return hashlib.sha256(cert[subject_start:subject_end]).digest()

          def parse_subject_and_dates(path):
              meta = run_cmd([
                  "openssl", "x509", "-in", path, "-noout",
                  "-subject", "-dates", "-nameopt", "RFC2253",
              ]).decode("utf-8", "ignore")
              subject_cn = not_before = not_after = None
              for line in meta.splitlines():
                  if line.startswith("subject="):
                      subject_cn = extract_cn(line.split("subject=", 1)[1])
                  elif line.startswith("notBefore="):
                      not_before = line.split("notBefore=", 1)[1]
                  elif line.startswith("notAfter="):
                      not_after = line.split("notAfter=", 1)[1]
              if not (subject_cn and not_before and not_after):
                  raise RuntimeError("missing metadata")
              def parse_date(value):
                  value = " ".join(value.split())
                  dt = datetime.strptime(value, "%b %d %H:%M:%S %Y %Z")
                  return calendar.timegm(dt.timetuple())
              return subject_cn, parse_date(not_before), parse_date(not_after)

          def extract_ski(path):
              """Extract SubjectKeyIdentifier extension bytes (raw hex).
              Returns a zero-padded SKI_LEN buffer. Version 3 requires an SKI
              because it is the primary sorted lookup key."""
              try:
                  out = run_cmd([
                      "openssl", "x509", "-in", path, "-noout", "-text",
                  ]).decode("utf-8", "ignore")
                  lines = out.splitlines()
                  for position, line in enumerate(lines):
                      if "X509v3 Subject Key Identifier:" not in line:
                          continue
                      for value_line in lines[position + 1:]:
                          value = value_line.strip()
                          if not value:
                              continue
                          if re.match(r"^([0-9A-Fa-f]{2}:)+[0-9A-Fa-f]{2}$", value):
                              raw = bytes.fromhex(value.replace(":", ""))
                              if not raw or len(raw) > SKI_LEN:
                                  raise RuntimeError("invalid SubjectKeyIdentifier length")
                              return pad_field(raw, SKI_LEN)
                          break
              except Exception:
                  raise
              raise RuntimeError("missing SubjectKeyIdentifier")

          def extract_rsa_pubkey(path):
              """Return (exp_bytes_le_3, mod_bytes_be) for an RSA public key.
              Raises RuntimeError if modulus is outside [RSA_MOD_MIN, RSA_MOD_MAX]."""
              pubkey_pem = run_cmd(["openssl", "x509", "-in", path, "-pubkey", "-noout"])
              text = run_cmd([
                  "openssl", "rsa", "-pubin", "-text", "-noout",
              ], pubkey_pem).decode("utf-8", "ignore")
              mod_hex = []
              in_mod = False
              exp_val = None
              for line in text.splitlines():
                  line = line.strip()
                  if line.startswith("Modulus:"):
                      in_mod = True
                      continue
                  if in_mod:
                      if line.startswith("Exponent:"):
                          in_mod = False
                          m = re.search(r"Exponent:\s*(\d+)", line)
                          if m:
                              exp_val = int(m.group(1))
                          continue
                      mod_hex.extend(line.replace(":", "").split())
              mod_bytes = bytes.fromhex("".join(mod_hex).lstrip("00"))
              if len(mod_bytes) < RSA_MOD_MIN:
                  raise RuntimeError(f"RSA modulus too small ({len(mod_bytes)}B < {RSA_MOD_MIN}B), skipping")
              if len(mod_bytes) > RSA_MOD_MAX:
                  raise RuntimeError(f"RSA modulus too large ({len(mod_bytes)}B > {RSA_MOD_MAX}B), skipping")
              exp_val = exp_val or 65537
              exp_le = struct.pack("<I", exp_val)[:3]  # uint24_t little-endian
              return exp_le, mod_bytes

          def extract_ec_pubkey(path):
              """Return 65-byte uncompressed P-256 public key (0x04 || x || y).
              Raises RuntimeError for non-P256 curves (e.g. P-384)."""
              pubkey_pem = run_cmd(["openssl", "x509", "-in", path, "-pubkey", "-noout"])
              pubkey_der = run_cmd(["openssl", "pkey", "-pubin", "-outform", "DER"], pubkey_pem)
              # Uncompressed P-256 point: 0x04 + x(32) + y(32) = 65 bytes
              # Preceded by 0x00 unused-bits byte in the BIT STRING
              for i in range(len(pubkey_der) - 65, -1, -1):
                  if pubkey_der[i] == 0x00 and pubkey_der[i+1] == 0x04 and (len(pubkey_der) - i - 1) == 65:
                      return bytes(pubkey_der[i+1:i+66])  # 0x04 || x || y
              raise RuntimeError("EC key is not P-256 (P-384/P-521 not supported), skipping")

          def build_entries(cert_paths):
              entries = {}
              exclusions = []  # (path, reason)
              for path in cert_paths:
                  try:
                      subject_cn, not_before, not_after = parse_subject_and_dates(path)
                      subject_digest = extract_subject_name_digest(path)
                      ski = extract_ski(path)

                      pubkey_pem = run_cmd(["openssl", "x509", "-in", path, "-pubkey", "-noout"])
                      pubkey_der = run_cmd(["openssl", "pkey", "-pubin", "-outform", "DER"], pubkey_pem)
                      OID_RSA = bytes([0x2a, 0x86, 0x48, 0x86, 0xf7, 0x0d, 0x01, 0x01, 0x01])
                      OID_EC  = bytes([0x2a, 0x86, 0x48, 0xce, 0x3d, 0x02, 0x01])
                      if OID_RSA in pubkey_der:
                          is_rsa = True
                      elif OID_EC in pubkey_der:
                          is_rsa = False
                      else:
                          raise RuntimeError("unknown public key algorithm OID")

                      key_type = "rsa" if is_rsa else "ec"
                      if key_type not in KEY_TYPE_TO_SERIALIZED_ID:
                          raise RuntimeError(f"key type {key_type} not in allowed list")
                      sig_alg = KEY_TYPE_TO_SERIALIZED_ID[key_type]

                      if is_rsa:
                          exp_le, mod_be = extract_rsa_pubkey(path)
                          key_bytes = exp_le + mod_be
                      else:
                          point = extract_ec_pubkey(path)
                          key_bytes = point

                  except Exception as e:
                      print(f"  skip {path}: {e}", flush=True)
                      exclusions.append((path, str(e)))
                      continue

                  if bytes(ski) in entries:
                      reason = "duplicate SubjectKeyIdentifier"
                      print(f"  skip {path}: {reason}", flush=True)
                      exclusions.append((path, reason))
                      continue
                  entries[bytes(ski)] = (
                      subject_digest,
                      subject_cn,
                      ski,
                      not_before,
                      not_after,
                      sig_alg,
                      key_bytes,
                  )

              return [entries[k] for k in sorted(entries.keys())], exclusions

          cert_globs = [
              "/etc/ssl/certs/*.pem",
              "/etc/ssl/certs/*.crt",
              "/usr/local/share/ca-certificates/*.crt",
              "/etc/pki/tls/certs/*.pem",
              "/etc/pki/tls/certs/*.crt",
          ]
          cert_paths = []
          for pattern in cert_globs:
              cert_paths.extend(glob(pattern))
          cert_paths = sorted(set(cert_paths))
          entries, exclusions = build_entries(cert_paths)

          created_ts = int(time.time())
          entry_count = len(entries)
          version = 3
          header_fields = struct.pack("<H", version) + struct.pack("<IH", created_ts, entry_count)

          entry_bytes = bytearray()
          metadata_offsets = []
          for subject_digest, _subject_cn, ski, not_before, not_after, sig_alg, key_bytes in entries:
              if len(entry_bytes) > 0xFFFF:
                  raise RuntimeError("truststore metadata offset exceeds uint16")
              metadata_offsets.append(len(entry_bytes))
              entry_len = ENTRY_FIXED_PREFIX + len(key_bytes)
              entry_bytes.extend(struct.pack("<I", entry_len))     # len (uint32_t)
              entry_bytes.extend(subject_digest)                   # SHA-256(DER Subject Name)
              entry_bytes.extend(ski)                              # ski[32]
              entry_bytes.extend(struct.pack("<I", not_before))    # expiry_start (uint32_t)
              entry_bytes.extend(struct.pack("<I", not_after))     # expiry_end (uint32_t)
              entry_bytes.extend(struct.pack("B", sig_alg))        # alg_id (uint8_t)
              entry_bytes.extend(key_bytes)                        # key[]

          if len(entry_bytes) > 0xFFFF:
              raise RuntimeError("truststore metadata block exceeds uint16")

          # Both indexes are fixed-width and covered by the store signature.
          # Metadata remains in SKI order, making SKI offsets monotonically
          # increasing. Subject duplicates are ordered by SKI so every index
          # has one canonical encoding.
          ski_index = bytearray()
          for entry, offset in zip(entries, metadata_offsets):
              ski_index.extend(entry[2])
              ski_index.extend(struct.pack("<H", offset))

          subject_index = bytearray()
          subject_rows = sorted(
              ((entry[0], entry[2], offset)
               for entry, offset in zip(entries, metadata_offsets)),
              key=lambda row: (row[0], row[1]),
          )
          for subject, _ski, offset in subject_rows:
              subject_index.extend(subject)
              subject_index.extend(struct.pack("<H", offset))

          expected_index_len = entry_count * INDEX_ENTRY_LEN
          if (len(ski_index) != expected_index_len or
                  len(subject_index) != expected_index_len):
              raise RuntimeError("internal truststore index length mismatch")
          if 256 + len(header_fields) + len(ski_index) + \
                  len(subject_index) + len(entry_bytes) > 0xFFFF:
              raise RuntimeError("serialized truststore exceeds uint16/AppVar size")

          os.makedirs("truststore_out", exist_ok=True)
          data_path    = os.path.join("truststore_out", "lwIPCERT.data")
          sig_path     = os.path.join("truststore_out", "lwIPCERT.sig")
          bin_path     = os.path.join("truststore_out", "lwIPCERT.bin")
          notes_path   = os.path.join("truststore_out", "release-notes.md")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "")

          with open(data_path, "wb") as f:
              f.write(header_fields)
              f.write(ski_index)
              f.write(subject_index)
              f.write(entry_bytes)

          run_cmd([
              "openssl", "dgst", "-sha256",
              "-sigopt", "rsa_padding_mode:pss",
              "-sigopt", "rsa_pss_saltlen:-1",
              "-sigopt", "rsa_mgf1_md:sha256",
              "-sign", os.path.join(os.environ["RUNNER_TEMP"], "truststore_signer.pem"),
              "-out", sig_path,
              data_path,
          ])

          with open(bin_path, "wb") as f:
              f.write(open(sig_path, "rb").read())
              f.write(header_fields)
              f.write(ski_index)
              f.write(subject_index)
              f.write(entry_bytes)

          print(f"entries={entry_count}")
          print(f"bin={bin_path}")

          with open(notes_path, "w", encoding="utf-8") as notes:
              notes.write("Truststore schema: **v3** (indexed SKI/full-Name-digest metadata lookup).\n\n")
              notes.write("This release includes the following CA roots:\n\n")
              for _digest, subject_cn, _ski, not_before, not_after, sig_alg, _key in entries:
                  subj = subject_cn
                  alg_name = ID_TO_DISPLAY.get(sig_alg, f"0x{sig_alg:02x}")
                  nb = datetime.utcfromtimestamp(not_before).strftime("%Y-%m-%d")
                  na = datetime.utcfromtimestamp(not_after).strftime("%Y-%m-%d")
                  notes.write(f"- {subj} ({alg_name}, valid {nb} to {na})\n")

          def sub(text):
              """Wrap cell contents (not the whole table) in <sub> for compact
              table rows -- wrapping an entire table breaks GitHub's row
              height calc and causes overlapping text."""
              return f"<sub>{text}</sub>"

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write(f"## Truststore Build Summary (v3)\n\n")
                  summary.write(f"{len(entries)} accepted, {len(exclusions)} excluded\n\n")

                  summary.write("### Allowed key types\n\n")
                  summary.write("Key type | OID | Display name\n")
                  summary.write("--- | --- | ---\n")
                  for e in _alg_registry:
                      summary.write(f"{sub(e['key_type'])} | {sub(e['oid'])} | {sub(e['display_name'])}\n")
                  summary.write("\n")

                  summary.write("### Accepted roots\n\n")
                  summary.write("Subject | SKI (hex) | Not Before | Not After | Key type\n")
                  summary.write("--- | --- | --- | --- | ---\n")
                  for _digest, subject_cn, ski, not_before, not_after, sig_alg, _key in entries:
                      subj = subject_cn
                      ski_hex = ski.hex()[:16] + "..."
                      alg_name = ID_TO_DISPLAY.get(sig_alg, f"0x{sig_alg:02x}")
                      nb = datetime.utcfromtimestamp(not_before).strftime("%Y-%m-%d")
                      na = datetime.utcfromtimestamp(not_after).strftime("%Y-%m-%d")
                      summary.write(f"{sub(subj)} | {sub(ski_hex)} | {sub(nb)} | {sub(na)} | {sub(alg_name)}\n")
                  summary.write("\n")

                  summary.write("### Excluded certs\n\n")
                  summary.write("File | Reason\n")
                  summary.write("--- | ---\n")
                  for path, reason in exclusions:
                      fname = os.path.basename(path)
                      summary.write(f"{sub(fname)} | {sub(reason)}\n")
                  summary.write("\n")
          PY

      - name: Build AppVar
        run: |
          convbin -i truststore_out/lwIPCERT.bin -o truststore_out/lwIPCERT.8xv -j bin -k 8xv -n lwIPCERT -r

      - name: Validate truststore v3 layout
        run: |
          python3 - <<'PY'
          import struct

          with open("truststore_out/lwIPCERT.bin", "rb") as f:
              blob = f.read()

          SIGNATURE_LEN = 256
          HEADER_LEN = SIGNATURE_LEN + 2 + 4 + 2
          KEY_LEN = 32
          INDEX_ENTRY_LEN = KEY_LEN + 2
          ENTRY_PREFIX_LEN = 4 + 32 + 32 + 4 + 4 + 1

          if len(blob) < HEADER_LEN:
              raise RuntimeError("truststore shorter than v3 header")
          version, _created, count = struct.unpack_from("<HIH", blob, SIGNATURE_LEN)
          if version != 3 or count == 0:
              raise RuntimeError("invalid truststore version or empty index")

          index_len = count * INDEX_ENTRY_LEN
          metadata_start = HEADER_LEN + 2 * index_len
          if metadata_start >= len(blob):
              raise RuntimeError("indexes exceed truststore size")
          ski_index = blob[HEADER_LEN:HEADER_LEN + index_len]
          subject_index = blob[HEADER_LEN + index_len:metadata_start]
          metadata = blob[metadata_start:]

          def rows(index):
              return [
                  (index[i:i + KEY_LEN],
                   struct.unpack_from("<H", index, i + KEY_LEN)[0])
                  for i in range(0, len(index), INDEX_ENTRY_LEN)
              ]

          ski_rows = rows(ski_index)
          subject_rows = rows(subject_index)
          if [key for key, _ in ski_rows] != sorted(key for key, _ in ski_rows):
              raise RuntimeError("SKI index is not sorted")

          boundaries = set()
          end = 0
          for key, offset in ski_rows:
              if offset != end or offset + ENTRY_PREFIX_LEN > len(metadata):
                  raise RuntimeError("invalid canonical metadata offset")
              entry_len = struct.unpack_from("<I", metadata, offset)[0]
              if entry_len < ENTRY_PREFIX_LEN or offset + entry_len > len(metadata):
                  raise RuntimeError("invalid metadata record length")
              if key != metadata[offset + 36:offset + 68]:
                  raise RuntimeError("SKI index key disagrees with metadata")
              boundaries.add(offset)
              end += entry_len
          if end != len(metadata):
              raise RuntimeError("metadata records do not exactly cover block")

          subject_order = []
          for key, offset in subject_rows:
              if offset not in boundaries:
                  raise RuntimeError("subject index offset is not an entry boundary")
              if key != metadata[offset + 4:offset + 36]:
                  raise RuntimeError("subject index key disagrees with metadata")
              subject_order.append((key, metadata[offset + 36:offset + 68]))
          if subject_order != sorted(subject_order):
              raise RuntimeError("subject index is not sorted by subject and SKI")

          print(f"validated truststore v3: {count} entries, {len(blob)} bytes")
          PY

      - name: Verify truststore signature
        run: |
          SIGNER_KEY="${RUNNER_TEMP}/truststore_signer.pem"
          PUB_KEY="${RUNNER_TEMP}/truststore_pub.pem"
          openssl pkey -in "$SIGNER_KEY" -pubout -out "$PUB_KEY"
          openssl dgst -sha256 \
            -sigopt rsa_padding_mode:pss \
            -sigopt rsa_pss_saltlen:-1 \
            -sigopt rsa_mgf1_md:sha256 \
            -verify "$PUB_KEY" \
            -signature truststore_out/lwIPCERT.sig \
            truststore_out/lwIPCERT.data >/dev/null

      - name: Upload truststore release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: truststore-latest
          name: truststore-latest
          files: truststore_out/lwIPCERT.8xv
          body_path: truststore_out/release-notes.md

      - name: Cleanup signing keys
        if: always()
        run: |
          SIGNER_KEY="${RUNNER_TEMP}/truststore_signer.pem"
          PUB_KEY="${RUNNER_TEMP}/truststore_pub.pem"
          if command -v shred >/dev/null 2>&1; then
            shred -u "$SIGNER_KEY" "$PUB_KEY" 2>/dev/null || true
          fi
          rm -f "$SIGNER_KEY" "$PUB_KEY"

           
