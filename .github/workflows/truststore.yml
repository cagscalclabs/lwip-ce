name: Generate Truststore AppVar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 */3 *"

jobs:
  truststore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make tar openssl

      - name: Download and extract CEdev
        run: |
          curl -sL github.com/CE-Programming/toolchain/releases/download/v14.0/CEdev-Linux.tar.gz | tar xz

      - name: Add CEdev to PATH
        run: |
          echo "CEdev/bin" >> $GITHUB_PATH

      - name: Write signing key
        env:
          TRUSTSTORE_SIGNER: ${{ secrets.TRUSTSTORE_SIGNER }}
        run: |
          printf '%s' "$TRUSTSTORE_SIGNER" > truststore_signer.pem
          chmod 600 truststore_signer.pem

      - name: Generate truststore binary
        run: |
          python3 - <<'PY'
          import calendar
          import hashlib
          import os
          import re
          import struct
          import subprocess
          import time
          from datetime import datetime
          from glob import glob

          OWNER_LEN = 32
          ISSUER_LEN = 32
          HASH_LEN = 32

          def run_cmd(args, input_bytes=None):
              result = subprocess.run(
                  args,
                  input=input_bytes,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
              )
              if result.returncode != 0:
                  raise RuntimeError(
                      f"command failed: {' '.join(args)}\n{result.stderr.decode('utf-8', 'ignore')}"
                  )
              return result.stdout

          def extract_cn(name_line):
              match = re.search(r"CN=([^,]+)", name_line)
              if match:
                  return match.group(1).strip()
              return name_line.strip()

          def normalize_name(name, length):
              data = name.encode("ascii", "replace")[:length]
              return data + b"\x00" * (length - len(data))

          def parse_openssl_metadata(path):
              meta = run_cmd(
                  [
                      "openssl",
                      "x509",
                      "-in",
                      path,
                      "-noout",
                      "-subject",
                      "-issuer",
                      "-dates",
                      "-nameopt",
                      "RFC2253",
                  ]
              ).decode("utf-8", "ignore")

              subject = issuer = None
              not_before = not_after = None
              for line in meta.splitlines():
                  if line.startswith("subject="):
                      subject = line.split("subject=", 1)[1]
                  elif line.startswith("issuer="):
                      issuer = line.split("issuer=", 1)[1]
                  elif line.startswith("notBefore="):
                      not_before = line.split("notBefore=", 1)[1]
                  elif line.startswith("notAfter="):
                      not_after = line.split("notAfter=", 1)[1]

              if not (subject and issuer and not_before and not_after):
                  raise RuntimeError("missing metadata")

              subject_cn = extract_cn(subject)
              issuer_cn = extract_cn(issuer)

              def parse_date(value):
                  value = " ".join(value.split())
                  dt = datetime.strptime(value, "%b %d %H:%M:%S %Y %Z")
                  return calendar.timegm(dt.timetuple())

              return subject_cn, issuer_cn, parse_date(not_before), parse_date(not_after)

          def compute_spki_hash(path):
              pubkey_pem = run_cmd(["openssl", "x509", "-in", path, "-pubkey", "-noout"])
              pubkey_der = run_cmd(["openssl", "pkey", "-pubin", "-outform", "DER"], pubkey_pem)
              return hashlib.sha256(pubkey_der).digest()

          def build_entries(cert_paths):
              entries = {}
              for path in cert_paths:
                  try:
                      subject_cn, issuer_cn, not_before, not_after = parse_openssl_metadata(path)
                      spki_hash = compute_spki_hash(path)
                  except Exception:
                      continue

                  entries[spki_hash] = (
                      normalize_name(subject_cn, OWNER_LEN),
                      normalize_name(issuer_cn, ISSUER_LEN),
                      not_before,
                      not_after,
                      spki_hash,
                  )

              return [entries[key] for key in sorted(entries.keys())]

          cert_globs = [
              "/etc/ssl/certs/*.pem",
              "/etc/ssl/certs/*.crt",
              "/usr/local/share/ca-certificates/*.crt",
              "/etc/pki/tls/certs/*.pem",
              "/etc/pki/tls/certs/*.crt",
          ]
          cert_paths = []
          for pattern in cert_globs:
              cert_paths.extend(glob(pattern))
          cert_paths = sorted(set(cert_paths))
          entries = build_entries(cert_paths)

          created_ts = int(time.time())
          entry_count = len(entries)
          header = struct.pack("<IHH", created_ts, entry_count, 0)

          entry_bytes = bytearray()
          for owner_id, issuer_id, not_before, not_after, spki_hash in entries:
              entry_bytes.extend(owner_id)
              entry_bytes.extend(issuer_id)
              entry_bytes.extend(struct.pack("<I", not_before))
              entry_bytes.extend(struct.pack("<I", not_after))
              entry_bytes.extend(spki_hash)

          os.makedirs("truststore_out", exist_ok=True)
          data_path = os.path.join("truststore_out", "lwIPSPKI.data")
          sig_path = os.path.join("truststore_out", "lwIPSPKI.sig")
          bin_path = os.path.join("truststore_out", "lwIPSPKI.bin")

          with open(data_path, "wb") as f:
              f.write(header)
              f.write(entry_bytes)

          run_cmd(
              [
                  "openssl",
                  "dgst",
                  "-sha256",
                  "-sigopt",
                  "rsa_padding_mode:pss",
                  "-sigopt",
                  "rsa_pss_saltlen:-1",
                  "-sigopt",
                  "rsa_mgf1_md:sha256",
                  "-sign",
                  "truststore_signer.pem",
                  "-out",
                  sig_path,
                  data_path,
              ]
          )

          with open(bin_path, "wb") as f:
              f.write(open(sig_path, "rb").read())
              f.write(open(data_path, "rb").read())

          print(f"entries={entry_count}")
          print(f"bin={bin_path}")
          PY

      - name: Build AppVar
        run: |
          convbin -i truststore_out/lwIPSPKI.bin -o truststore_out/lwIPSPKI.8xv -j bin -k 8xv -n lwIPSPKI -r

      - name: Upload truststore artifact
        uses: actions/upload-artifact@v4
        with:
          name: lwip-truststore
          path: truststore_out/
