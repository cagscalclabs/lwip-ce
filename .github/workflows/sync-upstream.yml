name: Sync Upstream lwIP

on:
  schedule:
    # Run every 3 months on the 1st at 00:00 UTC
    - cron: '0 0 1 */3 *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Only run on master branch
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Add upstream remote
        run: |
          git remote add upstream-lwip-sync https://github.com/lwip-tcpip/lwip.git || true
          git fetch upstream-lwip-sync --tags

      - name: Resolve latest stable upstream tag
        id: upstream_ref
        run: |
          # lwIP only calls a release "stable" via a STABLE-X_Y_Z_RELEASE tag —
          # master is active development and isn't itself a stability signal.
          LATEST_STABLE=$(git tag --list 'STABLE-*_RELEASE' --sort=-version:refname --no-merged HEAD 2>/dev/null | head -1)
          if [ -z "$LATEST_STABLE" ]; then
            LATEST_STABLE=$(git tag --list 'STABLE-*_RELEASE' --sort=-version:refname | head -1)
          fi
          if [ -z "$LATEST_STABLE" ]; then
            echo "::error::No STABLE-*_RELEASE tag found on upstream lwIP remote."
            exit 1
          fi
          echo "ref=${LATEST_STABLE}" >> $GITHUB_OUTPUT
          echo "Latest upstream stable release: ${LATEST_STABLE}"

      - name: Create sync branch
        id: sync
        run: |
          BRANCH_NAME="sync-upstream-$(date +%Y-%m-%d)"
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

          git checkout -b ${BRANCH_NAME}

      - name: Sync vendored lwIP paths
        id: sync_vendor
        continue-on-error: true
        run: |
          # Patch-based sync, not a history merge/rebase: this fork diverged
          # thousands of commits before any shared ancestor still reachable
          # from a current stable tag, so a real merge/rebase walks (and can
          # conflict on) that whole unrelated history. Instead this diffs only
          # the vendored paths between the last-synced tag and the new one and
          # applies that diff with a 3-way merge — conflicts then only ever
          # come from lines we've also touched in a vendored file, never from
          # unrelated upstream history. See the script header for details.
          set +e
          ./build-tools/sync_upstream_lwip.sh "${{ steps.upstream_ref.outputs.ref }}" \
            > sync_output.log 2>&1
          SYNC_EXIT=$?
          set -e
          cat sync_output.log

          if [ $SYNC_EXIT -ne 0 ]; then
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "## Vendored lwIP Sync Conflicts" > conflict_summary.md
            echo "" >> conflict_summary.md
            echo "The patch-based sync did not apply cleanly. Conflict markers" >> conflict_summary.md
            echo "(\`<<<<<<<\`) are left in the affected files for manual review." >> conflict_summary.md
            echo "" >> conflict_summary.md
            echo '```' >> conflict_summary.md
            git status --short -- src/core src/netif src/include src/api src/apps >> conflict_summary.md
            echo '```' >> conflict_summary.md
            echo "" >> conflict_summary.md
            echo '```' >> conflict_summary.md
            tail -c 4000 sync_output.log >> conflict_summary.md
            echo '```' >> conflict_summary.md
          else
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          fi

          git add -A -- src/core src/netif src/include src/api src/apps build-tools/UPSTREAM_LWIP_REF
          git commit -m "Sync vendored lwIP paths to ${{ steps.upstream_ref.outputs.ref }} ($(date +%Y-%m-%d))" --allow-empty

      - name: Push sync branch
        if: always()
        run: |
          git push origin ${{ steps.sync.outputs.branch_name }}

      - name: Compute next version tag
        id: version
        run: |
          git fetch --tags origin
          # Find the latest vX.Y.Z tag
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -1)
          if [ -z "$LATEST" ]; then
            NEXT="v1.0.1"
          else
            # Bump the Z component
            X=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
            Y=$(echo "$LATEST" | cut -d. -f2)
            Z=$(echo "$LATEST" | cut -d. -f3)
            NEXT="v${X}.${Y}.$((Z + 1))"
          fi
          echo "tag=${NEXT}" >> $GITHUB_OUTPUT
          echo "previous=${LATEST}" >> $GITHUB_OUTPUT

      - name: Tag sync branch with next version
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Get commit information
        id: commits
        run: |
          # Get list of new commits from upstream
          COMMITS=$(git log --oneline HEAD~10..${{ steps.upstream_ref.outputs.ref }} --pretty=format:"- %h %s" || echo "- Unable to fetch commits")
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.sync.outputs.branch_name }}
          base: master
          title: "🔄 Sync upstream lwIP changes → ${{ steps.version.outputs.tag }}"
          body: |
            ## Automated Upstream Sync — ${{ steps.version.outputs.tag }}

            This PR patch-syncs only the **vendored lwIP core paths**
            (`src/core`, `src/netif`, `src/include`, `src/api`, `src/apps`)
            against the latest **stable** upstream lwIP release (the newest
            `STABLE-*_RELEASE` tag — not `master`, which is active
            development). It never merges this fork's and upstream's commit
            history — it diffs the vendored paths between the last-synced tag
            and the new one and applies that diff with a 3-way merge, so any
            conflicts come only from lines we've also modified in a vendored
            file. Everything else (parsers, drivers, tls, arch, the altcp_ws
            addition) is untouched. Merging will trigger a versioned release
            of **${{ steps.version.outputs.tag }}**.

            **Source:** https://github.com/lwip-tcpip/lwip
            **Upstream release:** ${{ steps.upstream_ref.outputs.ref }}
            **Previous version:** ${{ steps.version.outputs.previous }}
            **New version:** ${{ steps.version.outputs.tag }}
            **Sync strategy:** patch diff of vendored paths only, applied with `git apply --3way`
            **Status:** ${{ steps.sync_vendor.outputs.has_conflicts == 'true' && '⚠️ Has Conflicts' || '✅ Clean Sync' }}

            ### Recent Upstream Commits

            ${{ steps.commits.outputs.commits }}

            ### What to Review

            1. **Check CHANGELOG** - Review upstream changes for security fixes
            2. **Review Conflicts** - If any conflicts remain (look for `<<<<<<<` markers in src/core, src/netif, src/include, src/api, src/apps), resolve them manually
            3. **Check altcp API** - Verify no breaking changes to the `altcp_tls`/`altcp_ws` layer, since `altcp_tls` is a vendored path we've heavily customized

            ### Sync Conflicts

            ${{ steps.sync_vendor.outputs.has_conflicts == 'true' && 'This PR has conflict markers left in the affected vendored files; see the conflict-summary artifact and resolve manually before merging.' || 'No conflicts detected. Safe to merge after testing.' }}

            ### Automated Actions Taken

            - ✅ Fetched latest stable tag from upstream lwIP
            - ✅ Diffed vendored paths against the last-synced ref (`build-tools/UPSTREAM_LWIP_REF`)
            - ✅ Applied the diff with `git apply --3way`
            ${{ steps.sync_vendor.outputs.has_conflicts == 'true' && '- ⚠️ Some conflicts require manual resolution' || '- ✅ Applied cleanly' }}

            ---

            **Note:** This is an automated PR. Review carefully before merging.
            Always test the TLS implementation after merging upstream changes.
          labels: |
            upstream-sync
            automated
            ${{ steps.sync_vendor.outputs.has_conflicts == 'true' && 'needs-review' || 'ready-to-test' }}
          draft: ${{ steps.sync_vendor.outputs.has_conflicts == 'true' }}

      - name: Upload conflict summary
        if: steps.sync_vendor.outputs.has_conflicts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: conflict-summary
          path: conflict_summary.md

      - name: Enable auto-merge for clean PRs
        if: steps.sync_vendor.outputs.has_conflicts == 'false' && steps.create_pr.outputs.pull-request-number != ''
        run: |
          gh pr merge ${{ steps.create_pr.outputs.pull-request-number }} --auto --merge --delete-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
