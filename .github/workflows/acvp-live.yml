name: ACVP Live Validation

# Manual trigger only — not run in normal CI.
on:
  workflow_dispatch:

concurrency:
  group: acvp-live-validation
  cancel-in-progress: false

jobs:
  acvp-live:
    name: NIST ACVP live validation
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ACV_SERVER: demo.acvts.nist.gov
      ACV_PORT: 443
      ACV_CERT_FILE: ${{ github.workspace }}/tests/acvp-live/client.cer
      ACV_KEY_FILE: ${{ github.workspace }}/tests/acvp-live/client.key
      ACV_TOTP_SEED: ${{ secrets.ACVP_TOTP }}
      LIBACVP_REF: v2.3.1
      OPENSSL_CONF: ${{ github.workspace }}/tests/acvp-live/openssl-nofips.cnf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write client private key
        env:
          ACVP_CLIENT_KEY: ${{ secrets.ACVP_CLIENT_KEY }}
        run: |
          printf '%s' "$ACVP_CLIENT_KEY" > tests/acvp-live/client.key
          chmod 600 tests/acvp-live/client.key

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake cmake libgl1-mesa-dev libtool \
            libcurl4-openssl-dev libssl-dev ninja-build pkg-config \
            python3-cryptography unzip

      - name: Download lwIP release marked latest
        run: |
          mkdir -p "$RUNNER_TEMP/lwip-release" "$GITHUB_WORKSPACE/release"
          curl -fsSL \
            "https://github.com/${{ github.repository }}/releases/latest/download/lwip.zip" \
            -o "$RUNNER_TEMP/lwip-release/lwip.zip"
          unzip -q "$RUNNER_TEMP/lwip-release/lwip.zip" \
            -d "$RUNNER_TEMP/lwip-release"
          cp -r "$RUNNER_TEMP/lwip-release/lwip/." \
            "$GITHUB_WORKSPACE/release/"

      - name: Download encrypted CEmu ROM into runner-local storage
        env:
          ROM_NAME: ${{ vars.AUTOTESTER_ROM }}
        run: |
          rom_url="https://cagscalclabs.net/restricted/$ROM_NAME.enc"
          rom_output="$RUNNER_TEMP/CE.rom.enc"
          rom_partial="$rom_output.part"

          # Resume truncated Cloudflare/origin responses rather than
          # discarding progress and restarting the same transfer from zero.
          for attempt in 1 2 3 4 5 6; do
            set +e
            curl -fL --show-error \
              --connect-timeout 20 --max-time 120 \
              --speed-limit 1024 --speed-time 30 \
              --continue-at - --output "$rom_partial" "$rom_url"
            curl_status=$?
            set -e

            if [ "$curl_status" -eq 0 ]; then
              mv "$rom_partial" "$rom_output"
              chmod 600 "$rom_output"
              echo "Encrypted ROM downloaded ($(stat -c%s "$rom_output") bytes)"
              break
            fi
            if [ "$curl_status" -eq 33 ]; then
              : > "$rom_partial"
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Encrypted ROM download failed after $attempt attempts (curl $curl_status)" >&2
              exit "$curl_status"
            fi
            echo "ROM download attempt $attempt failed (curl $curl_status); resuming after backoff" >&2
            sleep $((attempt * 3))
          done
          test -s "$rom_output"

      - name: Decrypt CEmu ROM in runner-local storage
        env:
          ROM_KEY: ${{ secrets.AES_ENCRYPT_KEY }}
        run: |
          gpg --batch --yes --passphrase "$ROM_KEY" \
            --output "$RUNNER_TEMP/ce.rom" \
            --decrypt "$RUNNER_TEMP/CE.rom.enc"
          shred -u "$RUNNER_TEMP/CE.rom.enc"
          test -f "$RUNNER_TEMP/ce.rom"

      - name: Build CEmu and install the latest lwIP release
        run: |
          python3 .github/scripts/prepare_cemu_image.py \
            --rom "$RUNNER_TEMP/ce.rom" \
            --release "$GITHUB_WORKSPACE/release" \
            --output "$RUNNER_TEMP/ce-patched.ce" \
            --autotester-output "$RUNNER_TEMP/cemu-autotester-image" \
            --headless-output "$RUNNER_TEMP/cemu-headless" \
            --work-dir "$RUNNER_TEMP/CEmu"

      - name: Prepare OpenSSL symlinks for libacvp configure
        run: |
          ARCH=$(dpkg --print-architecture)
          TRIPLET=$(gcc -print-multiarch)
          SSL_LIB=/usr/lib/$TRIPLET
          # libacvp configure looks for $ssl_dir/lib/libssl.so — symlink the
          # arch-specific directory so --with-ssl-dir=/usr/local/ssl works
          sudo mkdir -p /usr/local/ssl/lib
          sudo ln -sf $SSL_LIB/libssl.so    /usr/local/ssl/lib/libssl.so
          sudo ln -sf $SSL_LIB/libcrypto.so /usr/local/ssl/lib/libcrypto.so
          sudo ln -sf /usr/include/openssl  /usr/local/ssl/include

      - name: Run offline ACVP host tests
        run: |
          python3 -I tests/acvp-live/test_run_local.py
          python3 -I tests/acvp-live/test_acvp_offline.py
          python3 -I tests/acvp-live/test_run_concurrent.py
          python3 -I tests/acvp-live/test_summary.py
          python3 tests/validation/acvp/generate_vectors.py
          python3 tests/validation/acvp/selftest.py

      - name: Build acvp_app
        run: python3 tests/acvp-live/acvp_offline.py build

      - id: env
        uses: ./.github/actions/emulator-env
        with:
          local-assets: "true"

      - name: Build ACVPRUN against the installed latest release
        run: |
          make -C tests/acvp-live clean
          make -C tests/acvp-live

      - name: Fetch vectors from NIST
        run: python3 tests/acvp-live/acvp_offline.py fetch

      - name: Run vector sets concurrently through isolated CEmu instances
        id: run_vectors
        run: |
          set +e
          sudo env PATH="$PATH" CEDEV="$CEDEV" AUTOTESTER_IMAGE="$AUTOTESTER_IMAGE" \
            python3 .github/scripts/run_acvp_live_tests.py \
            --runner "${{ github.workspace }}/tests/acvp-live/run.py" \
            --autotester "${{ steps.env.outputs.image-autotester }}" \
            --usb "${{ steps.env.outputs.usb-step }}" \
            --binary "${{ github.workspace }}/tests/acvp-live/bin/ACVPRUN.8xp" \
            --vectors "${{ github.workspace }}/tests/acvp-live/vectors/combined.json" \
            --response "${{ github.workspace }}/tests/acvp-live/responses/combined.json" \
            --artifacts-dir "${{ github.workspace }}/tests/acvp-live/units" \
            --socket-timeout 21600 \
            --autotester-timeout-ms 600000000 \
            --process-timeout 18000
          status=$?
          sudo chown -R "$(id -un)" tests/acvp-live/responses/ \
            tests/acvp-live/units/ \
            2>/dev/null || true
          exit "$status"

      - name: Submit responses to NIST
        id: submit
        run: python3 tests/acvp-live/acvp_offline.py submit

      - name: Fetch and display grading results
        id: grade
        run: python3 tests/acvp-live/acvp_offline.py get_results

      - name: Remove all runner-local CEmu ROM material
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/CE.rom.enc" 2>/dev/null || true
          shred -u "$RUNNER_TEMP/ce.rom" 2>/dev/null || true
          shred -u "$RUNNER_TEMP/ce-patched.ce" 2>/dev/null || true
          shred -u "$RUNNER_TEMP/ce-patched.ce.enc" 2>/dev/null || true

      - name: Remove client private key
        if: always()
        run: |
          shred -u tests/acvp-live/client.key 2>/dev/null || rm -f tests/acvp-live/client.key
          shred -u tests/acvp-live/session.json \
            tests/acvp-live/upload_context.json \
            tests/acvp-live/combined_responses.json \
            tests/acvp-live/vectors_combined.json \
            tests/acvp-live/acvpLiveSession*.json 2>/dev/null || true

      - name: Build and publish ACVP live summary
        if: always()
        run: |
          python3 tests/acvp-live/summary.py \
            --vectors tests/acvp-live/vectors/combined.json \
            --grading tests/acvp-live/results.json \
            --server "$ACV_SERVER" \
            --output "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acvp-live-evidence
          path: |
            tests/acvp-live/vectors/
            tests/acvp-live/responses/
            tests/acvp-live/results.json
            tests/acvp-live/results.log
            tests/acvp-live/units/
          if-no-files-found: warn
          retention-days: 90
