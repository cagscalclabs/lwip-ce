name: Build Docs

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - src/**
      - exports.txt
      - build-tools/scripts/generate_lwip_headers.py
      - build-tools/scripts/header_dump.py
      - build-tools/meta/public_api_manifest.csv
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/**
      - src/**
      - exports.txt
      - build-tools/scripts/generate_lwip_headers.py
      - build-tools/scripts/header_dump.py
      - build-tools/meta/public_api_manifest.csv
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz clang-18 libclang-18-dev
          wget -q "https://github.com/doxygen/doxygen/releases/download/Release_1_17_0/doxygen-1.17.0.linux.bin.tar.gz" -O /tmp/doxygen.tar.gz
          tar -xzf /tmp/doxygen.tar.gz -C /tmp
          sudo cp /tmp/doxygen-1.17.0/bin/doxygen /usr/local/bin/doxygen
          doxygen --version

      - name: Install docs dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build docs
        run: make -C docs html

      - name: Collect the Wi-Fi bridge firmware
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out=docs/_build/html/firmware
          mkdir -p "$out"
          gh api --paginate "repos/$GH_REPO/releases" \
            --jq '.[] | select(.draft | not) | . as $r | .assets[] | select(.name | test("^lwip_wifi_bridge-esp32s3-.*-merged\\.bin$")) | {tag: $r.tag_name, prerelease: $r.prerelease, file: .name}' \
            | jq -s . > "$out/releases.json"
          jq -r '.[] | [.tag, .file] | @tsv' "$out/releases.json" | while IFS=$'\t' read -r tag file; do
            gh release download "$tag" -p "$file" -D "$out"
          done
          ls -l "$out"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
