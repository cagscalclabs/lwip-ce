name: Build Wi-Fi Bridge Firmware

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'wifi_bridge/**'
      - '.github/workflows/wifi_bridge.yml'
      - '.github/ci-versions.env'
  push:
    branches: [master, wireless]
    paths:
      - 'wifi_bridge/**'
      - '.github/workflows/wifi_bridge.yml'
      - '.github/ci-versions.env'

permissions:
  contents: read

concurrency:
  group: lwip-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # esp32s3: the bridge board in wifi_bridge/hardware (default)
        # esp32p4: Waveshare ESP32-P4 Module Dev Kit
        target: [esp32s3, esp32p4]
    env:
      IDF_TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load pinned CI dependency versions
        id: ci_versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Resolve the version
        id: version
        run: echo "value=$(git describe --tags --always --dirty 2>/dev/null || echo "${GITHUB_SHA:0:7}")" >> "$GITHUB_OUTPUT"

      - name: Cache the component manager downloads
        uses: actions/cache@v4
        with:
          path: wifi_bridge/.idf-component-cache
          key: idf-components-${{ matrix.target }}-${{ steps.ci_versions.outputs.IDF_VERSION }}-${{ hashFiles('wifi_bridge/main/idf_component.yml', format('wifi_bridge/dependencies.lock.{0}', matrix.target)) }}
          restore-keys: idf-components-${{ matrix.target }}-${{ steps.ci_versions.outputs.IDF_VERSION }}-

      - name: Build the bridge firmware
        uses: espressif/esp-idf-ci-action@v1
        env:
          IDF_COMPONENT_CACHE_PATH: ${{ github.workspace }}/wifi_bridge/.idf-component-cache
        with:
          esp_idf_version: ${{ steps.ci_versions.outputs.IDF_VERSION }}
          target: ${{ env.IDF_TARGET }}
          path: wifi_bridge
          command: idf.py build && idf.py merge-bin -o lwip_wifi_bridge-merged.bin

      - name: Collect the artifacts
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build=wifi_bridge/build
          cp "$build/lwip_wifi_bridge.bin" "dist/lwip_wifi_bridge-${IDF_TARGET}-${VERSION}.bin"
          cp "$build/lwip_wifi_bridge.elf" "dist/lwip_wifi_bridge-${IDF_TARGET}-${VERSION}.elf"
          merged="$(find wifi_bridge -name 'lwip_wifi_bridge-merged.bin' -print -quit)"
          cp "$merged" "dist/lwip_wifi_bridge-${IDF_TARGET}-${VERSION}-merged.bin"
          cp "$build/bootloader/bootloader.bin" dist/bootloader.bin
          cp "$build/partition_table/partition-table.bin" dist/partition-table.bin
          cp "$build/flasher_args.json" dist/flasher_args.json
          ls -l dist

      - name: Publish job summary
        run: |
          {
            echo "## lwIP Wi-Fi bridge firmware"
            echo
            echo "target \`${{ env.IDF_TARGET }}\`, ESP-IDF \`${{ steps.ci_versions.outputs.IDF_VERSION }}\`"
            echo
            echo "| artifact | bytes |"
            echo "| --- | --- |"
            for f in dist/*; do
              echo "| \`$(basename "$f")\` | $(stat -c%s "$f") |"
            done
            echo
            echo "Flash everything at once: \`esptool.py --chip ${{ env.IDF_TARGET }} write_flash 0x0 lwip_wifi_bridge-${{ env.IDF_TARGET }}-*-merged.bin\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: lwip-wifi-bridge-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
