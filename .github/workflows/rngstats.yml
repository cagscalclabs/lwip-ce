name: Publish RNG Statistics

on:
  push:
    branches:
      - master
    paths:
      - statistics/rng/**
      - tests/profiling/tls_rng_stats/**
      - src/tls/includes/random.h
      - src/tls/core/random.c
      - src/tls/core/random.s
      - .github/workflows/rngstats.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rngstats-assets-latest
  cancel-in-progress: false

jobs:
  report:
    name: RNG statistics report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin

      - name: Generate RNG report
        env:
          IMAGE_URL: https://github.com/${{ github.repository }}/releases/download/rngstats-assets-latest/rng-distributions.png?run=${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 tests/profiling/tls_rng_stats/tools/summarize_rng_stats.py \
            --stats-dir statistics/rng \
            --output-dir build/statistics/rng \
            --image-url "$IMAGE_URL"
          rsvg-convert \
            --width 1800 \
            --output build/statistics/rng/rng-distributions.png \
            build/statistics/rng/rng-distributions.svg

      - name: Upload RNG statistics artifact
        uses: actions/upload-artifact@v4
        with:
          name: rng-statistics
          path: build/statistics/rng/
          if-no-files-found: error

  publish:
    name: Publish RNG statistics report
    needs: report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download generated report
        uses: actions/download-artifact@v4
        with:
          name: rng-statistics
          path: build/statistics/rng

      - name: Publish latest report assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -f rngstats-assets-latest "$GITHUB_SHA"
          git push -f origin refs/tags/rngstats-assets-latest

          if ! gh release view rngstats-assets-latest >/dev/null 2>&1; then
            gh release create rngstats-assets-latest \
              --title "rngstats-assets-latest" \
              --notes "Latest generated RNG statistics and visualizations." \
              --latest=false
          fi

          mapfile -t assets < <(find build/statistics/rng -maxdepth 1 -type f -print | sort)
          if ((${#assets[@]} == 0)); then
            echo "No generated RNG statistics assets were downloaded." >&2
            exit 1
          fi
          gh release upload rngstats-assets-latest "${assets[@]}" --clobber

      - name: Publish job summary
        run: cat build/statistics/rng/rng-statistics.md >> "$GITHUB_STEP_SUMMARY"
