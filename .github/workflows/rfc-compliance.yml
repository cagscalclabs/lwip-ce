name: RFC compliance review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]

# This workflow intentionally runs for every PR so a required status check is
# always reported. The trusted script exits successfully without model usage
# when the PR does not change src/**.
permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: rfc-compliance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: RFC compliance
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # pull_request_target has access to secrets. Check out only the trusted
      # base revision; the PR's code is fetched through the API as inert text.
      - name: Check out trusted reviewer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Review source diff for RFC regressions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RFC_REVIEW_MODEL: ${{ vars.RFC_REVIEW_MODEL || 'gpt-6-sol' }}
          RFC_REVIEW_CYBER_PROGRAM: daybreak_blue
          RFC_VERIFY_MODEL: ${{ vars.RFC_VERIFY_MODEL || 'gpt-6-astra' }}
          RFC_VERIFY_CYBER_PROGRAM: standard
        run: python3 .github/scripts/rfc_review.py
