name: Build Latest lwIP Dylib

on:
  schedule:
    # 03:00 UTC is roughly 11 PM US Eastern during daylight time.
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  security-events: write
  actions: read
  pull-requests: write

concurrency:
  group: lwip-nightly-release-${{ github.event_name == 'pull_request' && github.ref || 'scheduled' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CEDEV: ${{ github.workspace }}/CEdev
  CEDEV_BIN: ${{ github.workspace }}/CEdev/bin
  TOOLCHAIN_SRC: ${{ github.workspace }}/toolchain
  NIGHTLY_TAG: nightly

jobs:
  dylib_latest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lwIP-CE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make tar curl unzip libxml2-utils unifdef python3 python3-clang libclang-dev

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/CEdev
          key: ${{ runner.os }}-cedev-v15.0

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL github.com/CE-Programming/toolchain/releases/download/v15.0/CEdev-Linux.tar.gz | tar xz

      - name: Add CEdev to PATH
        run: |
          echo "${{ github.workspace }}/CEdev/bin" >> "$GITHUB_PATH"

      - name: Checkout CEdev toolchain source
        uses: actions/checkout@v4
        with:
          repository: CE-Programming/toolchain
          ref: master
          path: ${{ env.TOOLCHAIN_SRC }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout fixed convbin branch
        uses: actions/checkout@v4
        with:
          repository: mateoconlechuga/convbin
          ref: R_Z80_BYTE012
          path: ${{ env.TOOLCHAIN_SRC }}/tools/convbin
          submodules: recursive
          persist-credentials: false

      - name: Build toolchain fasmg support
        run: |
          make -C "${{ env.TOOLCHAIN_SRC }}/tools/fasmg"
          cd "${{ env.TOOLCHAIN_SRC }}/tools/fasmg/fasmg-ez80"
          ./bin/install_fasmg
          cmake -E copy bin/fasmg "${{ env.CEDEV_BIN }}/fasmg"
          test "$(command -v fasmg)" = "${{ env.CEDEV_BIN }}/fasmg"
          fasmg /dev/null /dev/null

      - name: Build fixed convbin from source
        run: |
          test -f "${{ env.TOOLCHAIN_SRC }}/tools/convbin/Makefile"
          make -C "${{ env.TOOLCHAIN_SRC }}/tools/convbin" clean || true
          make -C "${{ env.TOOLCHAIN_SRC }}/tools/convbin" -j"$(nproc)"
          cmake -E copy "${{ env.TOOLCHAIN_SRC }}/tools/convbin/bin/convbin" "${{ env.CEDEV_BIN }}/convbin"
          "${{ env.CEDEV_BIN }}/convbin" --version || true

      # TEMPORARY: the v15.0 release CEdev/meta/makefile.mk hard-assigns
      # LINKER_SCRIPT with `=`/`:=`, so our makefile's
      # `LINKER_SCRIPT = build-tools/meta/linker_script_lwip.ld` cannot win and the app links
      # against the stock script (missing our overlay/PROVIDE symbols ->
      # undefined references). master already fixed this to `?=`. Patch the
      # release meta in place to `?=` so our assignment takes effect.
      # REMOVE this step once a CEdev release ships the `?=` fix.
      - name: Patch CEdev meta LINKER_SCRIPT to ?= (temporary)
        run: |
          META="${{ env.CEDEV }}/meta/makefile.mk"
          echo "before:"; grep -nE 'LINKER_SCRIPT[[:space:]]*[:?]?=' "$META" || true
          sed -i -E 's/^([[:space:]]*LINKER_SCRIPT[[:space:]]*):?=([^=])/\1?=\2/' "$META"
          echo "after:";  grep -nE 'LINKER_SCRIPT[[:space:]]*[:?]?=' "$META" || true

      - name: make dylib
        id: make_dylib
        env:
          LWIP_SKIP_DEP_CHECKOUT: '1'
          APP_TOOLS_DIR: ${{ github.workspace }}/submodules/app_tools
          TOOLCHAIN_DIR: ${{ env.TOOLCHAIN_SRC }}
          # The workflow-level TOOLCHAIN_SRC points at the toolchain repo ROOT
          # (where tools/fasmg, tools/convbin live). build-tools/build-release-dylib.sh,
          # however, expects TOOLCHAIN_SRC to be the src/ subdir (it checks for
          # common.mk, include/, usbdrvce/). Override it here to the src dir so
          # the inherited workflow-level value does not break the script.
          TOOLCHAIN_SRC: ${{ env.TOOLCHAIN_SRC }}/src
          CEDEV: ${{ env.CEDEV }}
          FASMG: fasmg
          CONVBIN: ${{ env.CEDEV_BIN }}/convbin
          HEADER_PYTHON: python3
        run: ./build-tools/build-release-dylib.sh

      - name: verify libload lib
        id: make_libload
        run: |
          test -f "${{ github.workspace }}/build/lwip.8xv"
          test -f "${{ github.workspace }}/build/lwip.lib"
          test -f "${{ env.CEDEV }}/lib/libload/lwip.lib"
          test -d "${{ env.CEDEV }}/include/lwip"

      - name: upload action artifact
        id: upload_action_artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-latest
          path: ${{ github.workspace }}/build/
          if-no-files-found: error

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## lwIP Latest Dylib"
            echo
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| make dylib | ${{ steps.make_dylib.outcome }} |"
            echo "| make libload lib | ${{ steps.make_libload.outcome }} |"
            echo "| upload action artifact | ${{ steps.upload_action_artifact.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

    outputs:
      build_success: ${{ steps.upload_action_artifact.outcome == 'success' }}

  dylib_unit_tests:
    needs: dylib_latest
    if: needs.dylib_latest.outputs.build_success == 'true'
    uses: ./.github/workflows/tests.yml
    with:
      artifact_name: lwip-latest
    secrets: inherit

  cavp_validation:
    needs: dylib_latest
    if: needs.dylib_latest.outputs.build_success == 'true'
    uses: ./.github/workflows/cavp.yml
    with:
      artifact_name: lwip-latest
    secrets: inherit

  sast:
    needs: dylib_latest
    if: needs.dylib_latest.outputs.build_success == 'true'
    uses: ./.github/workflows/sast.yml
    secrets: inherit

  dast:
    needs: dylib_latest
    if: needs.dylib_latest.outputs.build_success == 'true'
    uses: ./.github/workflows/dast.yml
    secrets: inherit

  publish:
    needs: [dylib_latest, dylib_unit_tests, cavp_validation, sast, dast]
    # dast is intentionally excluded from this gate. dast.json is a
    # manually-produced, operator-graded report (see dast.yml), not a
    # fresh-per-run signal -- gating on it blocks releases on human
    # availability rather than code correctness. It still runs here for
    # visibility in the summary below, and always() lets publish proceed
    # regardless of its outcome. timing.yml runs entirely on its own
    # schedule (see timing.yml) and is not part of this workflow at all.
    # Never runs on pull_request -- nightly tagging/release only happens
    # off schedule or manual dispatch on the base repo.
    if: always() && github.event_name != 'pull_request' && needs.dylib_unit_tests.result == 'success' && needs.cavp_validation.result == 'success' && needs.sast.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lwIP-CE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Download in-run build artifact
        uses: actions/download-artifact@v4
        with:
          name: lwip-latest
          path: ${{ github.workspace }}/build

      - name: Prepare nightly release notes
        id: release_notes
        run: |
          git fetch --force --tags origin
          NOTES_FILE="$RUNNER_TEMP/nightly-release-notes.md"
          {
            echo "Automated nightly lwIP-CE dylib build."
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo
            echo "Changes since previous nightly release:"
            echo
            if git rev-parse -q --verify "refs/tags/${NIGHTLY_TAG}^{commit}" >/dev/null; then
              if git log --format='%H' "${NIGHTLY_TAG}..HEAD" | grep -q .; then
                git log --reverse --pretty=format:'- %s (%h)' "${NIGHTLY_TAG}..HEAD"
                echo
              else
                echo "- No commits since the previous nightly release."
              fi
            else
              echo "- No previous nightly release tag found; listing recent history."
              git log --reverse --max-count=50 --pretty=format:'- %s (%h)'
              echo
            fi
          } > "$NOTES_FILE"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: package nightly release asset
        id: package_release
        if: success()
        run: |
          ASSET="$RUNNER_TEMP/lwip-latest.tar.gz"
          tar -czf "$ASSET" -C "${{ github.workspace }}/build" .
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: publish nightly release
        id: publish_release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f "$NIGHTLY_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$NIGHTLY_TAG"

          if gh release view "$NIGHTLY_TAG" >/dev/null 2>&1; then
            gh release edit "$NIGHTLY_TAG" \
              --title "$NIGHTLY_TAG" \
              --notes-file "${{ steps.release_notes.outputs.notes_file }}" \
              --prerelease
          else
            gh release create "$NIGHTLY_TAG" \
              --title "$NIGHTLY_TAG" \
              --notes-file "${{ steps.release_notes.outputs.notes_file }}" \
              --prerelease
          fi

          gh release upload "$NIGHTLY_TAG" \
            "${{ steps.package_release.outputs.asset }}" \
            --clobber

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## lwIP Nightly Release"
            echo
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| unit tests | ${{ needs.dylib_unit_tests.result }} |"
            echo "| cavp validation | ${{ needs.cavp_validation.result }} |"
            echo "| sast | ${{ needs.sast.result }} |"
            echo "| dast (informational) | ${{ needs.dast.result }} |"
            echo "| package nightly release asset | ${{ steps.package_release.outcome }} |"
            echo "| publish nightly release | ${{ steps.publish_release.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  notify_pr_on_failure:
    needs: [dylib_latest, dylib_unit_tests, cavp_validation, sast, dast]
    if: always() && github.event_name == 'pull_request' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Comment on PR with failure summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "@${{ github.event.pull_request.user.login }} CI failed on this PR (commit \`${{ github.event.pull_request.head.sha }}\`):"
            echo
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| build | ${{ needs.dylib_latest.result }} |"
            echo "| unit tests | ${{ needs.dylib_unit_tests.result }} |"
            echo "| cavp validation | ${{ needs.cavp_validation.result }} |"
            echo "| sast | ${{ needs.sast.result }} |"
            echo "| dast | ${{ needs.dast.result }} |"
            echo
            echo "[View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
