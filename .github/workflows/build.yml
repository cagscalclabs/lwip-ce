name: Build, Run Checks, and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  actions: write
  security-events: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  CEDEV: ${{ github.workspace }}/CEdev
  CEDEV_BIN: ${{ github.workspace }}/CEdev/bin
  AUTOTESTER_ROM: ${{ github.workspace }}/${{ vars.AUTOTESTER_ROM }}
  LWIP_DYLIB_TESTS: ${{ github.workspace }}/tests/unit
  LWIP_TESTS_COMMON: ${{ github.workspace }}/tests/common

jobs:
  changes:
    name: Detect relevant content
    runs-on: ubuntu-latest
    outputs:
      content_new: ${{ steps.detect.outputs.content_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          content_new=false

          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            content_new=true
          else
            changed_paths="$RUNNER_TEMP/changed-paths"
            if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
              git diff-tree --root --no-commit-id --name-only -r -z "$HEAD_SHA" > "$changed_paths"
            elif [ "${{ github.event_name }}" = pull_request ]; then
              git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_paths"
            else
              git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"
            fi

            while IFS= read -r -d '' path; do
              case "$path" in
                src/*|tests/*|examples/*|contrib/*|wifi_bridge/*|submodules/*|upstream-lwip/*|build-tools/*|bin/*|makefile|ce-libify.toml|exports.txt|reduce.sh|.gitmodules|.github/actions/*|.github/scripts/*|.github/workflows/build.yml|.github/workflows/tests.yml|.github/ci-versions.env|.github/rfc-review-schema.json)
                  content_new=true
                  echo "Relevant content: $path"
                  ;;
                *)
                  echo "Ignored content: $path"
                  ;;
              esac
            done < "$changed_paths"
          fi

          echo "content_new=$content_new" >> "$GITHUB_OUTPUT"
          echo "Relevant content changed: $content_new" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build lwIP
    needs: changes
    if: needs.changes.outputs.content_new == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lwIP-CE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Load pinned CI dependency versions
        id: ci_versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make tar curl unzip zip libxml2-utils unifdef python3 python3-clang libclang-dev

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/CEdev
          key: ${{ runner.os }}-cedev-${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://github.com/CE-Programming/toolchain/releases/download/${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}/CEdev-Linux.tar.gz" | tar xz

      - name: Add CEdev to PATH
        run: echo "${{ github.workspace }}/CEdev/bin" >> "$GITHUB_PATH"

      - name: Checkout fixed convbin branch
        uses: actions/checkout@v4
        with:
          repository: mateoconlechuga/convbin
          ref: R_Z80_BYTE012
          path: ${{ github.workspace }}/convbin
          submodules: recursive
          persist-credentials: false

      - name: Build fixed convbin from source
        run: |
          make -C "${{ github.workspace }}/convbin" -j"$(nproc)"
          cmake -E copy "${{ github.workspace }}/convbin/bin/convbin" "${{ env.CEDEV_BIN }}/convbin"
          "${{ env.CEDEV_BIN }}/convbin" --version || true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install ce-libify
        run: |
          git clone --depth 1 --branch "${{ steps.ci_versions.outputs.CE_LIBIFY_REF }}" https://github.com/alessiodam/toolchain_libify.git "${{ runner.temp }}/ce-libify"
          GOCACHE="${{ runner.temp }}/go-cache" go test -C "${{ runner.temp }}/ce-libify" ./...
          make -C "${{ runner.temp }}/ce-libify" install CEDEV="${{ env.CEDEV }}" PYTHON=python3
          ce-libify --version

      - name: Audit fatal error logging
        run: python3 tests/host/error_logging/test_error_sites.py

      - name: Build dylib release
        id: make_dylib
        run: make dylib-release

      - name: Verify build outputs
        id: verify_build
        run: |
          test -f "${{ github.workspace }}/build/lwip.8xv"
          test -f "${{ github.workspace }}/build/lwip.lib"
          test -f "${{ env.CEDEV }}/lib/libload/lwip.lib"
          test -d "${{ env.CEDEV }}/include/lwip"
          test -f "${{ github.workspace }}/lwip.zip"
          unzip -Z1 "${{ github.workspace }}/lwip.zip" > "$RUNNER_TEMP/release-files.txt"
          grep -Fx 'lwip/tools/lwip-cert-converter' "$RUNNER_TEMP/release-files.txt"
          grep -Fx 'lwip/examples/pcb/src/main.c' "$RUNNER_TEMP/release-files.txt"
          grep -Fx 'lwip/examples/socket/src/main.c' "$RUNNER_TEMP/release-files.txt"
          grep -Fx 'lwip/examples/template/src/main.c' "$RUNNER_TEMP/release-files.txt"
          grep -Fx 'lwip/examples/wifi_api/src/main.c' "$RUNNER_TEMP/release-files.txt"
          if grep -Eq '^(build/|tools/)' "$RUNNER_TEMP/release-files.txt"; then
            echo "::error::Release archive contains files outside its lwip/ root"
            exit 1
          fi

      - name: Build release examples
        id: make_examples
        run: |
          make -C examples
          mkdir -p release-examples
          cp examples/pcb/bin/LWPCB.8xp \
             examples/socket/bin/LWSOCKET.8xp \
             examples/template/bin/LWTMPL.8xp \
             examples/wifi_api/bin/LWWIFI.8xp \
             release-examples/

      - name: Upload release examples
        id: upload_examples
        uses: actions/upload-artifact@v4
        with:
          name: lwip-examples
          path: ${{ github.workspace }}/release-examples/
          if-no-files-found: error

      - name: Upload build artifact
        id: upload_build_artifact
        uses: actions/upload-artifact@v4
        with:
          name: lwip-latest
          path: ${{ github.workspace }}/build/
          if-no-files-found: error

      - name: Upload release zip
        id: upload_zip_artifact
        uses: actions/upload-artifact@v4
        with:
          name: lwip-release-zip
          path: ${{ github.workspace }}/lwip.zip
          if-no-files-found: error

      - name: Publish build summary
        if: always()
        run: |
          {
            echo "## Build"
            echo
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| dylib release | ${{ steps.make_dylib.outcome }} |"
            echo "| output verification | ${{ steps.verify_build.outcome }} |"
            echo "| release examples | ${{ steps.make_examples.outcome }} |"
            echo "| examples artifact | ${{ steps.upload_examples.outcome }} |"
            echo "| build artifact | ${{ steps.upload_build_artifact.outcome }} |"
            echo "| release artifact | ${{ steps.upload_zip_artifact.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Run Checks
    needs: [changes, build]
    if: >-
      needs.changes.outputs.content_new == 'true' &&
      needs.build.result == 'success'
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  state:
    name: Collect pipeline state
    needs: [changes, build, tests]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      bitmap: ${{ steps.collect.outputs.bitmap }}
    steps:
      - name: Build result bitmap
        id: collect
        env:
          CONTENT_NEW: ${{ needs.changes.outputs.content_new }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          TEST_JOB_RESULTS: ${{ needs.tests.outputs.results }}
        run: |
          set -euo pipefail
          bitmap=$(jq -nc \
            --arg content "$CONTENT_NEW" \
            --arg changes "$CHANGES_RESULT" \
            --arg build "$BUILD_RESULT" \
            --arg tests "$TESTS_RESULT" \
            --arg test_jobs "$TEST_JOB_RESULTS" '
              def bit:
                if . == "success" then true
                elif . == "failure" or . == "cancelled" or . == "timed_out" then false
                else null
                end;
              ($test_jobs | fromjson? // {}) as $jobs |
              {
                content_new: ($content == "true"),
                content_detection_succeeded: ($changes | bit),
                build_succeeded: ($build | bit),
                checks_succeeded: ($tests | bit),
                checks: ($jobs | with_entries(.value |= bit))
              }')

          echo "bitmap=$bitmap" >> "$GITHUB_OUTPUT"
          {
            echo "## Pipeline state"
            echo
            echo '```json'
            echo "$bitmap" | jq .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  can_merge:
    name: Merge Ready
    needs: [changes, build, tests, state]
    if: always() && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      can_merge: ${{ steps.evaluate.outputs.can_merge }}
    steps:
      - name: Evaluate merge readiness
        id: evaluate
        env:
          STATE_RESULT: ${{ needs.state.result }}
          BITMAP: ${{ needs.state.outputs.bitmap }}
        run: |
          set -euo pipefail
          can_merge=false
          reason="Pipeline state was unavailable."

          if [ "$STATE_RESULT" = success ] && [ -n "$BITMAP" ]; then
            content_new=$(jq -r '.content_new' <<< "$BITMAP")
            detection_ok=$(jq -r '.content_detection_succeeded' <<< "$BITMAP")

            if [ "$detection_ok" != true ]; then
              reason="Relevant-content detection failed."
            elif [ "$content_new" = false ]; then
              can_merge=true
              reason="No build-relevant content changed."
            elif jq -e '
              .build_succeeded == true and
              .checks_succeeded == true and
              (.checks | length > 0) and
              ([.checks[]] | all(. == true))
            ' <<< "$BITMAP" >/dev/null; then
              can_merge=true
              reason="Build prerequisites and every test, including RFC compliance, passed."
            else
              reason="The build or at least one required test did not pass."
            fi
          fi

          echo "can_merge=$can_merge" >> "$GITHUB_OUTPUT"
          {
            echo "## Merge Ready"
            echo
            echo "**Ready:** \`$can_merge\`"
            echo
            echo "$reason"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$can_merge" != true ]; then
            echo "::error::$reason"
            exit 1
          fi

  rfc_review_policy:
    name: Open RFC review PR
    needs: [changes, build, tests, state]
    if: >-
      always() &&
      github.ref != 'refs/heads/master' &&
      (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')) &&
      needs.state.result == 'success' &&
      fromJSON(needs.state.outputs.bitmap).checks.rfc == false
    permissions:
      actions: read
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Download RFC compliance report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: rfc-compliance-report
          path: ${{ runner.temp }}/rfc-compliance-report

      - name: Open PR and post RFC failure details
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          SOURCE_OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_BASE: ${{ github.event.pull_request.base.ref }}
          EVENT_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MAINTAINER: ${{ vars.RFC_REVIEW_MAINTAINER || 'acagliano' }}
          RFC_REPORT_PATH: ${{ runner.temp }}/rfc-compliance-report/rfc-compliance.md
        run: |
          set -euo pipefail
          maintainer=${MAINTAINER#@}
          author=$EVENT_PR_AUTHOR
          if [ -z "$author" ]; then
            commit_json=$(gh api "repos/${{ github.repository }}/commits/$SOURCE_SHA")
            author=$(jq -r '.author.login // .committer.login // empty' <<< "$commit_json")
          fi

          mentions="@$maintainer"
          if [ -n "$author" ] && [ "$author" != "$maintainer" ]; then
            mentions="$mentions @$author"
          fi

          head_spec=$SOURCE_BRANCH
          if [ "$SOURCE_OWNER" != "$REPOSITORY_OWNER" ]; then
            head_spec="$SOURCE_OWNER:$SOURCE_BRANCH"
          fi

          pr_number=""
          if [ "$EVENT_PR_BASE" = master ]; then
            pr_number=$EVENT_PR_NUMBER
          fi
          if [ -z "$pr_number" ]; then
            pr_number=$(gh pr list --repo "${{ github.repository }}" --state open \
              --base master --head "$head_spec" --json number \
              --jq '.[0].number // empty')
          fi

          if [ -z "$pr_number" ]; then
            short_sha=${SOURCE_SHA:0:12}
            body="$RUNNER_TEMP/rfc-review-pr.md"
            {
              echo "RFC compliance failed for this branch and requires maintainer review."
              echo
              echo "- Source: \`$SOURCE_OWNER:$SOURCE_BRANCH\`"
              echo "- Commit: \`$SOURCE_SHA\`"
              echo "- [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              echo
              echo "The strict **Merge Ready** check remains failed until RFC compliance passes."
            } > "$body"
            pr_url=$(gh pr create --repo "${{ github.repository }}" \
              --base master --head "$head_spec" \
              --title "RFC review required: $SOURCE_BRANCH $short_sha" \
              --body-file "$body")
            pr_number=${pr_url##*/}
          fi

          comment="$RUNNER_TEMP/rfc-review-comment.md"
          marker="<!-- rfc-review:$SOURCE_SHA -->"
          {
            echo "$marker"
            echo "$mentions — RFC compliance failed for this change."
            echo
            echo "- Source branch: \`$SOURCE_OWNER:$SOURCE_BRANCH\`"
            echo "- Source commit: [\`$SOURCE_SHA\`](${{ github.server_url }}/${{ github.repository }}/commit/$SOURCE_SHA)"
            echo "- Tested revision: \`$TESTED_SHA\`"
            echo "- [Workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            if [ -s "$RFC_REPORT_PATH" ]; then
              echo
              echo "## RFC compliance details"
              echo
              cat "$RFC_REPORT_PATH"
            else
              echo
              echo "> The RFC report artifact was unavailable; inspect the workflow logs for the failure."
            fi
          } > "$comment"

          comment_id=$(gh api "repos/${{ github.repository }}/issues/$pr_number/comments" \
            --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" \
            | head -1)
          if [ -n "$comment_id" ]; then
            jq -Rs '{body: .}' < "$comment" \
              | gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" \
                  --input - >/dev/null
            echo "Updated RFC failure comment on PR #$pr_number."
          else
            gh pr comment "$pr_number" --repo "${{ github.repository }}" --body-file "$comment"
          fi

  deploy:
    name: Deploy master
    needs: [changes, build, tests, state]
    if: >-
      always() &&
      github.ref == 'refs/heads/master' &&
      needs.state.result == 'success' &&
      fromJSON(needs.state.outputs.bitmap).build_succeeded == true &&
      fromJSON(needs.state.outputs.bitmap).checks.rom_setup == true &&
      fromJSON(needs.state.outputs.bitmap).checks.rom_cleanup == true &&
      fromJSON(needs.state.outputs.bitmap).checks.unit == true &&
      (fromJSON(needs.state.outputs.bitmap).checks.rfc == true ||
       fromJSON(needs.state.outputs.bitmap).checks.rfc == null) &&
      fromJSON(needs.state.outputs.bitmap).checks.acvp == true &&
      fromJSON(needs.state.outputs.bitmap).checks.sast == true &&
      fromJSON(needs.state.outputs.bitmap).checks.codeql == true &&
      fromJSON(needs.state.outputs.bitmap).checks.network == true &&
      fromJSON(needs.state.outputs.bitmap).checks.dast == true &&
      fromJSON(needs.state.outputs.bitmap).checks.host == true &&
      fromJSON(needs.state.outputs.bitmap).checks.fuzz == true
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download tested release archive
        uses: actions/download-artifact@v4
        with:
          name: lwip-release-zip
          path: ${{ runner.temp }}/tested-release

      - name: Verify tested release archive
        run: |
          test -f "${{ runner.temp }}/tested-release/lwip.zip"
          unzip -Z1 "${{ runner.temp }}/tested-release/lwip.zip" > "$RUNNER_TEMP/tested-release-files.txt"
          grep -Fx 'lwip/lwip.8xv' "$RUNNER_TEMP/tested-release-files.txt"
          grep -Fx 'lwip/lwip.lib' "$RUNNER_TEMP/tested-release-files.txt"
          grep -Fx 'lwip/tools/lwip-cert-converter' "$RUNNER_TEMP/tested-release-files.txt"
          grep -Fx 'lwip/examples/pcb/src/main.c' "$RUNNER_TEMP/tested-release-files.txt"
          grep -Fx 'lwip/examples/socket/src/main.c' "$RUNNER_TEMP/tested-release-files.txt"
          grep -Fx 'lwip/examples/template/src/main.c' "$RUNNER_TEMP/tested-release-files.txt"
          grep -Fx 'lwip/examples/wifi_api/src/main.c' "$RUNNER_TEMP/tested-release-files.txt"

      - name: Create deterministic release archive
        run: |
          set -euo pipefail
          source_date_epoch=$(git show -s --format=%ct HEAD)
          release_root="${{ runner.temp }}/release-root"
          mkdir -p "$release_root"
          unzip -q "${{ runner.temp }}/tested-release/lwip.zip" -d "$release_root"
          find "$release_root/lwip" -exec touch -d "@$source_date_epoch" {} +
          cd "$release_root"
          find lwip -type f -print | LC_ALL=C sort > "$RUNNER_TEMP/release-files.txt"
          TZ=UTC zip -X "$RUNNER_TEMP/lwip.zip" -@ < "$RUNNER_TEMP/release-files.txt"
          test -s "$RUNNER_TEMP/lwip.zip"

      - name: Compare latest stable archive
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="${{ runner.temp }}/lwip.zip"
          current_hash=$(sha256sum "$archive" | awk '{print $1}')
          changed=true
          mkdir -p "$RUNNER_TEMP/previous-release"
          if gh release download latest-stable --repo "${{ github.repository }}" \
            --pattern lwip.zip --dir "$RUNNER_TEMP/previous-release" 2>/dev/null; then
            previous_hash=$(sha256sum "$RUNNER_TEMP/previous-release/lwip.zip" | awk '{print $1}')
            if [ "$current_hash" = "$previous_hash" ]; then
              changed=false
            fi
            echo "previous_hash=$previous_hash" >> "$GITHUB_OUTPUT"
          fi
          echo "current_hash=$current_hash" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Publish latest stable release
        id: publish
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_HASH: ${{ steps.compare.outputs.current_hash }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Automated build from \`master\`."
            echo
            echo "- Commit: [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
            echo "- SHA-256 (lwip.zip): \`$ARCHIVE_HASH\`"
            echo "- [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > "$notes"

          git tag --force latest-stable "${{ github.sha }}"
          git push --force origin refs/tags/latest-stable

          # This is a rolling build, not the repository's manually promoted
          # versioned release. Never move GitHub's "Latest release" badge.
          if gh release view latest-stable --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit latest-stable --repo "${{ github.repository }}" \
              --title "latest-stable" --notes-file "$notes"
          else
            gh release create latest-stable --repo "${{ github.repository }}" \
              --verify-tag --title "latest-stable" \
              --notes-file "$notes" --latest=false
          fi
          gh release upload latest-stable "${{ runner.temp }}/lwip.zip" \
            --repo "${{ github.repository }}" --clobber

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo "## Deployment"
            echo
            if [ "${{ job.status }}" != success ]; then
              echo "Deployment failed."
            elif [ "${{ steps.compare.outputs.changed }}" = true ]; then
              echo "Published \`latest-stable\` at commit \`${{ github.sha }}\`."
            else
              echo "\`latest-stable\` is unchanged because the archive hash matched."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
