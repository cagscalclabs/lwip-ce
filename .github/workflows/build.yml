name: Build Latest lwIP Dylib

# Builds the dylib and packages it as lwip.zip (`make dylib-release`), then
# uploads both as artifacts. This workflow ONLY attempts the build -- it no
# longer runs unit tests, CAVP, SAST, or DAST, and it no longer publishes a
# release. Those are independent workflows on their own triggers now (see
# tests.yml, cavp.yml, sast.yml, dast.yml, timing.yml); update-latest.yml is
# the single gate that checks all of them before tagging/publishing a
# release from whatever this workflow last built successfully.

on:
  schedule:
    # 03:00 UTC is roughly 11 PM US Eastern during daylight time.
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'build-tools/**'
      - 'tests/**'
      - '!tests/dast.json'
      - '.github/workflows/build.yml'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'build-tools/**'
      - 'tests/**'
      - '!tests/dast.json'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: lwip-build-${{ github.event_name == 'pull_request' && github.ref || 'scheduled' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CEDEV: ${{ github.workspace }}/CEdev
  CEDEV_BIN: ${{ github.workspace }}/CEdev/bin
  TOOLCHAIN_SRC: ${{ github.workspace }}/toolchain

jobs:
  check_inputs:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.result.outputs.changed }}
      input_hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute input hash
        id: hash
        run: |
          # tests/dast.json is excluded deliberately: it's a manually-produced,
          # operator-graded DAST report committed after a hardware run, not a
          # build input -- hashing it here would invalidate the sentinel cache
          # (forcing a rebuild) on every report commit even when nothing that
          # actually needs rebuilding changed.
          echo "hash=${{ hashFiles('src/**', 'build-tools/**', 'tests/unit/**', 'tests/host/**', 'tests/common/**', 'tests/profiling/**', '.github/workflows/build.yml') }}" >> "$GITHUB_OUTPUT"
      - name: Check sentinel cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: .ci-sentinel
          key: build-inputs-${{ steps.hash.outputs.hash }}
      - name: Set changed output
        id: result
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  dylib_latest:
    needs: check_inputs
    if: needs.check_inputs.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lwIP-CE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Load pinned CI dependency versions
        id: ci_versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make tar curl unzip zip libxml2-utils unifdef python3 python3-clang libclang-dev

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/CEdev
          key: ${{ runner.os }}-cedev-${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "github.com/CE-Programming/toolchain/releases/download/${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}/CEdev-Linux.tar.gz" | tar xz

      - name: Add CEdev to PATH
        run: |
          echo "${{ github.workspace }}/CEdev/bin" >> "$GITHUB_PATH"

      - name: Checkout CEdev toolchain source
        uses: actions/checkout@v4
        with:
          repository: CE-Programming/toolchain
          ref: ${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}
          path: ${{ env.TOOLCHAIN_SRC }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout fixed convbin branch
        uses: actions/checkout@v4
        with:
          repository: mateoconlechuga/convbin
          ref: R_Z80_BYTE012
          path: ${{ env.TOOLCHAIN_SRC }}/tools/convbin
          submodules: recursive
          persist-credentials: false

      - name: Build toolchain fasmg support
        run: |
          make -C "${{ env.TOOLCHAIN_SRC }}/tools/fasmg"
          cd "${{ env.TOOLCHAIN_SRC }}/tools/fasmg/fasmg-ez80"
          ./bin/install_fasmg
          cmake -E copy bin/fasmg "${{ env.CEDEV_BIN }}/fasmg"
          test "$(command -v fasmg)" = "${{ env.CEDEV_BIN }}/fasmg"
          fasmg /dev/null /dev/null

      - name: Build fixed convbin from source
        run: |
          test -f "${{ env.TOOLCHAIN_SRC }}/tools/convbin/Makefile"
          make -C "${{ env.TOOLCHAIN_SRC }}/tools/convbin" clean || true
          make -C "${{ env.TOOLCHAIN_SRC }}/tools/convbin" -j"$(nproc)"
          cmake -E copy "${{ env.TOOLCHAIN_SRC }}/tools/convbin/bin/convbin" "${{ env.CEDEV_BIN }}/convbin"
          "${{ env.CEDEV_BIN }}/convbin" --version || true

      # TEMPORARY: the v15.0 release CEdev/meta/makefile.mk hard-assigns
      # LINKER_SCRIPT with `=`/`:=`, so our makefile's
      # `LINKER_SCRIPT = build-tools/meta/linker_script_lwip.ld` cannot win and the app links
      # against the stock script (missing our overlay/PROVIDE symbols ->
      # undefined references). master already fixed this to `?=`. Patch the
      # release meta in place to `?=` so our assignment takes effect.
      # REMOVE this step once a CEdev release ships the `?=` fix.
      - name: Patch CEdev meta LINKER_SCRIPT to ?= (temporary)
        run: |
          META="${{ env.CEDEV }}/meta/makefile.mk"
          echo "before:"; grep -nE 'LINKER_SCRIPT[[:space:]]*[:?]?=' "$META" || true
          sed -i -E 's/^([[:space:]]*LINKER_SCRIPT[[:space:]]*):?=([^=])/\1?=\2/' "$META"
          echo "after:";  grep -nE 'LINKER_SCRIPT[[:space:]]*[:?]?=' "$META" || true

      - name: make dylib-release
        id: make_dylib
        env:
          LWIP_SKIP_DEP_CHECKOUT: '1'
          APP_TOOLS_DIR: ${{ github.workspace }}/submodules/app_tools
          TOOLCHAIN_DIR: ${{ env.TOOLCHAIN_SRC }}
          # The workflow-level TOOLCHAIN_SRC points at the toolchain repo ROOT
          # (where tools/fasmg, tools/convbin live). build-tools/build-release-dylib.sh,
          # however, expects TOOLCHAIN_SRC to be the src/ subdir (it checks for
          # common.mk, include/, usbdrvce/). Override it here to the src dir so
          # the inherited workflow-level value does not break the script.
          TOOLCHAIN_SRC: ${{ env.TOOLCHAIN_SRC }}/src
          CEDEV: ${{ env.CEDEV }}
          FASMG: fasmg
          CONVBIN: ${{ env.CEDEV_BIN }}/convbin
          HEADER_PYTHON: python3
        run: |
          ./build-tools/build-release-dylib.sh
          make release

      - name: verify libload lib
        id: make_libload
        run: |
          test -f "${{ github.workspace }}/build/lwip.8xv"
          test -f "${{ github.workspace }}/build/lwip.lib"
          test -f "${{ env.CEDEV }}/lib/libload/lwip.lib"
          test -d "${{ env.CEDEV }}/include/lwip"
          test -f "${{ github.workspace }}/lwip.zip"

      - name: upload build artifact
        id: upload_build_artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-latest
          path: ${{ github.workspace }}/build/
          if-no-files-found: error

      - name: upload release zip artifact
        id: upload_zip_artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-release-zip
          path: ${{ github.workspace }}/lwip.zip
          if-no-files-found: error

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## lwIP Latest Dylib"
            echo
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| make dylib-release | ${{ steps.make_dylib.outcome }} |"
            echo "| make libload lib | ${{ steps.make_libload.outcome }} |"
            echo "| upload build artifact | ${{ steps.upload_build_artifact.outcome }} |"
            echo "| upload release zip artifact | ${{ steps.upload_zip_artifact.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

    outputs:
      build_success: ${{ steps.upload_build_artifact.outcome == 'success' && steps.upload_zip_artifact.outcome == 'success' }}

  save_sentinel:
    needs: [check_inputs, dylib_latest]
    if: github.event_name != 'pull_request' && needs.dylib_latest.result == 'success' && needs.dylib_latest.outputs.build_success == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Write sentinel
        run: touch .ci-sentinel
      - name: Save sentinel cache
        uses: actions/cache/save@v5
        with:
          path: .ci-sentinel
          key: build-inputs-${{ needs.check_inputs.outputs.input_hash }}

  notify_pr_on_failure:
    needs: [check_inputs, dylib_latest]
    if: always() && github.event_name == 'pull_request' && needs.dylib_latest.result == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Comment on PR with failure summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "@${{ github.event.pull_request.user.login }} build failed on this PR (commit \`${{ github.event.pull_request.head.sha }}\`):"
            echo
            echo "[View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
