name: Build Latest lwIP Dylib

on:
  push:
    branches: ['master']
    paths:
      - '.github/workflows/build.yml'
      - '.gitmodules'
      - 'build-release-dylib.sh'
      - 'makefile'
      - 'linker_script_lwip.ld'
      - 'src/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CEDEV: ${{ github.workspace }}/CEdev
  CEDEV_BIN: ${{ github.workspace }}/CEdev/bin
  TOOLCHAIN_SRC: ${{ github.workspace }}/toolchain

jobs:
  dylib_latest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lwIP-CE
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make tar curl unzip libxml2-utils python3 python3-clang libclang-dev

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/CEdev
          key: ${{ runner.os }}-cedev-v15.0

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL github.com/CE-Programming/toolchain/releases/download/v15.0/CEdev-Linux.tar.gz | tar xz

      - name: Add CEdev to PATH
        run: |
          echo "${{ github.workspace }}/CEdev/bin" >> "$GITHUB_PATH"

      - name: Checkout CEdev toolchain source
        uses: actions/checkout@v4
        with:
          repository: CE-Programming/toolchain
          ref: master
          path: ${{ env.TOOLCHAIN_SRC }}
          submodules: recursive
          persist-credentials: false

      - name: Checkout fixed convbin branch
        uses: actions/checkout@v4
        with:
          repository: mateoconlechuga/convbin
          ref: R_Z80_BYTE012
          path: ${{ env.TOOLCHAIN_SRC }}/tools/convbin
          submodules: recursive
          persist-credentials: false

      - name: Build toolchain fasmg support
        run: |
          make -C "${{ env.TOOLCHAIN_SRC }}/tools/fasmg"
          cd "${{ env.TOOLCHAIN_SRC }}/tools/fasmg/fasmg-ez80"
          ./bin/install_fasmg
          cmake -E copy bin/fasmg "${{ env.CEDEV_BIN }}/fasmg"
          test "$(command -v fasmg)" = "${{ env.CEDEV_BIN }}/fasmg"
          fasmg /dev/null /dev/null

      - name: Build fixed convbin from source
        run: |
          test -f "${{ env.TOOLCHAIN_SRC }}/tools/convbin/Makefile"
          make -C "${{ env.TOOLCHAIN_SRC }}/tools/convbin" clean || true
          make -C "${{ env.TOOLCHAIN_SRC }}/tools/convbin" -j"$(nproc)"
          cmake -E copy "${{ env.TOOLCHAIN_SRC }}/tools/convbin/bin/convbin" "${{ env.CEDEV_BIN }}/convbin"
          "${{ env.CEDEV_BIN }}/convbin" --version || true

      - name: make dylib
        id: make_dylib
        env:
          LWIP_SKIP_DEP_CHECKOUT: '1'
          APP_TOOLS_DIR: ${{ github.workspace }}/submodules/app_tools
          TOOLCHAIN_DIR: ${{ env.TOOLCHAIN_SRC }}
          CEDEV: ${{ env.CEDEV }}
          FASMG: fasmg
          CONVBIN: ${{ env.CEDEV_BIN }}/convbin
          HEADER_PYTHON: python3
        run: ./build-release-dylib.sh

      - name: verify libload lib
        id: make_libload
        run: |
          test -f "${{ github.workspace }}/build/lwip.8xv"
          test -f "${{ github.workspace }}/build/lwip.lib"
          test -f "${{ env.CEDEV }}/lib/libload/lwip.lib"
          test -d "${{ env.CEDEV }}/include/lwip"

      - name: upload action artifact
        id: upload_action_artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-latest
          path: ${{ github.workspace }}/build/
          if-no-files-found: error

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## lwIP Latest Dylib"
            echo
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| make dylib | ${{ steps.make_dylib.outcome }} |"
            echo "| make libload lib | ${{ steps.make_libload.outcome }} |"
            echo "| upload action artifact | ${{ steps.upload_action_artifact.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
