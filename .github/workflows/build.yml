name: Build

# staging is the integration branch. Every staging push is processed
# immediately; code changes run the gate and non-code-only changes proceed
# directly to promotion. Every master push runs the complete build/test gate
# before deployment. An RFC-only staging failure opens a maintainer-review PR.

on:
  workflow_dispatch:
  push:
    branches: [master, staging]

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write
  security-events: write

concurrency:
  group: lwip-${{ github.ref_name }}-gate
  cancel-in-progress: false

env:
  CEDEV: ${{ github.workspace }}/CEdev
  CEDEV_BIN: ${{ github.workspace }}/CEdev/bin
  AUTOTESTER_ROM: ${{ github.workspace }}/${{ vars.AUTOTESTER_ROM }}
  LWIP_DYLIB_TESTS: ${{ github.workspace }}/tests/unit
  LWIP_TESTS_COMMON: ${{ github.workspace }}/tests/common

jobs:
  decide:
    name: Classify changes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.decision.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify branch changes
        id: decision
        run: |
          set -euo pipefail
          echo "code_changed=false" >> "$GITHUB_OUTPUT"

          git fetch --no-tags origin master
          code_changed=false
          if [ "${{ github.ref_name }}" = master ]; then
            code_changed=true
            echo "Master always runs the complete build/test gate."
          else
            while IFS= read -r -d '' path; do
              case "$path" in
                src/*|tests/*|examples/*|contrib/*|wifi_bridge/*|submodules/*|upstream-lwip/*|build-tools/*|bin/*|makefile|ce-libify.toml|exports.txt|reduce.sh|.gitmodules|.github/scripts/*|.github/ci-versions.env|.github/rfc-review-schema.json)
                  code_changed=true
                  echo "Gate-relevant change: $path"
                  ;;
                *)
                  echo "Non-code change: $path"
                  ;;
              esac
            done < <(git diff --name-only -z "origin/master...$GITHUB_SHA")
          fi
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            if [ "${{ github.ref_name }}" != staging ] && [ "${{ github.ref_name }}" != master ]; then
              echo "::error::Manual gates must use either the staging or master branch."
              exit 1
            fi
          fi

          if [ "$code_changed" = false ]; then
            echo "No project, build, or test code changed; promoting without build and test checks."
          else
            echo "Project, build, or test code changed; running the full gate now."
          fi

  build:
    name: Build lwIP
    needs: decide
    if: needs.decide.outputs.code_changed == 'true'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lwIP-CE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Load pinned CI dependency versions
        id: ci_versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make tar curl unzip zip libxml2-utils unifdef python3 python3-clang libclang-dev

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/CEdev
          key: ${{ runner.os }}-cedev-${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "github.com/CE-Programming/toolchain/releases/download/${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}/CEdev-Linux.tar.gz" | tar xz

      - name: Add CEdev to PATH
        run: |
          echo "${{ github.workspace }}/CEdev/bin" >> "$GITHUB_PATH"

      - name: Checkout fixed convbin branch
        uses: actions/checkout@v4
        with:
          repository: mateoconlechuga/convbin
          ref: R_Z80_BYTE012
          path: ${{ github.workspace }}/convbin
          submodules: recursive
          persist-credentials: false

      - name: Build fixed convbin from source
        run: |
          make -C "${{ github.workspace }}/convbin" -j"$(nproc)"
          cmake -E copy "${{ github.workspace }}/convbin/bin/convbin" "${{ env.CEDEV_BIN }}/convbin"
          "${{ env.CEDEV_BIN }}/convbin" --version || true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install ce-libify
        run: |
          git clone --depth 1 --branch "${{ steps.ci_versions.outputs.CE_LIBIFY_REF }}" https://github.com/alessiodam/toolchain_libify.git "${{ runner.temp }}/ce-libify"
          GOCACHE="${{ runner.temp }}/go-cache" go test -C "${{ runner.temp }}/ce-libify" ./...
          make -C "${{ runner.temp }}/ce-libify" install CEDEV="${{ env.CEDEV }}" PYTHON=python3
          ce-libify --version

      - name: Audit fatal error logging
        run: python3 tests/host/error_logging/test_error_sites.py

      - name: make dylib-release
        id: make_dylib
        run: make dylib-release

      - name: verify libload lib
        id: make_libload
        run: |
          test -f "${{ github.workspace }}/build/lwip.8xv"
          test -f "${{ github.workspace }}/build/lwip.lib"
          test -f "${{ env.CEDEV }}/lib/libload/lwip.lib"
          test -d "${{ env.CEDEV }}/include/lwip"
          test -f "${{ github.workspace }}/lwip.zip"

      - name: build Wi-Fi examples
        id: make_wifi_examples
        run: |
          make -C examples/wifi_ping
          make -C examples/wifi_api
          mkdir -p wifi-examples
          cp examples/wifi_ping/bin/LWPING.8xp examples/wifi_api/bin/LWWIFI.8xp wifi-examples/

      - name: upload Wi-Fi examples artifact
        id: upload_wifi_examples
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-wifi-examples
          path: ${{ github.workspace }}/wifi-examples/
          if-no-files-found: error

      - name: upload build artifact
        id: upload_build_artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-latest
          path: ${{ github.workspace }}/build/
          if-no-files-found: error

      - name: upload release zip artifact
        id: upload_zip_artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-release-zip
          path: ${{ github.workspace }}/lwip.zip
          if-no-files-found: error

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## lwIP Latest Dylib"
            echo
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| make dylib-release | ${{ steps.make_dylib.outcome }} |"
            echo "| make libload lib | ${{ steps.make_libload.outcome }} |"
            echo "| build Wi-Fi examples | ${{ steps.make_wifi_examples.outcome }} |"
            echo "| upload build artifact | ${{ steps.upload_build_artifact.outcome }} |"
            echo "| upload release zip artifact | ${{ steps.upload_zip_artifact.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

    outputs:
      build_success: ${{ steps.upload_build_artifact.outcome == 'success' && steps.upload_zip_artifact.outcome == 'success' }}

  tests:
    name: Tests
    needs: [decide, build]
    if: >-
      needs.decide.outputs.code_changed == 'true' &&
      needs.build.result == 'success'
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  rfc_compliance_no_changes:
    name: RFC compliance
    needs: decide
    if: needs.decide.outputs.code_changed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Record successful no-op review
        run: |
          echo "No RFC-relevant project code changed; RFC compliance passes without review."
          echo "## RFC compliance" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "No RFC-relevant project code changed." >> "$GITHUB_STEP_SUMMARY"

  promotion_policy:
    name: Promotion policy
    needs: [decide, build, tests, rfc_compliance_no_changes]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.policy.outputs.decision }}
    steps:
      - name: Evaluate promotion policy
        id: policy
        env:
          CODE_CHANGED: ${{ needs.decide.outputs.code_changed }}
          DECIDE_RESULT: ${{ needs.decide.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          RFC_ONLY_FAILURE: ${{ needs.tests.outputs.rfc_only_failure }}
          RFC_NO_CHANGES_RESULT: ${{ needs.rfc_compliance_no_changes.result }}
        run: |
          set -euo pipefail

          decision=reject
          reason="The staging gate did not reach an allowed outcome."

          if [ "$DECIDE_RESULT" != success ]; then
            reason="The gate trigger could not be evaluated."
          elif [ "$CODE_CHANGED" = false ] && [ "$RFC_NO_CHANGES_RESULT" = success ]; then
            decision=auto
            reason="No gate-relevant code changed; automatic promotion is allowed."
          elif [ "$CODE_CHANGED" = true ] && \
               [ "$BUILD_RESULT" = success ] && [ "$TESTS_RESULT" = success ]; then
            decision=auto
            reason="The build and every test gate passed; automatic promotion is allowed."
          elif [ "$CODE_CHANGED" = true ] && \
               [ "$BUILD_RESULT" = success ] && [ "$TESTS_RESULT" = failure ] && \
               [ "$RFC_ONLY_FAILURE" = true ]; then
            decision=review
            reason="Only RFC compliance failed; promotion requires maintainer review."
          fi

          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          {
            echo "## Promotion policy"
            echo
            echo "**Decision:** \`$decision\`"
            echo
            echo "$reason"
            echo
            echo "| Input | Result |"
            echo "|---|---|"
            echo "| Build | $BUILD_RESULT |"
            echo "| Tests | $TESTS_RESULT |"
            echo "| RFC-only failure | $RFC_ONLY_FAILURE |"
            echo "| RFC no-change check | $RFC_NO_CHANGES_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$decision" = reject ]; then
            echo "::error::$reason"
            exit 1
          fi

  publish_ci_status:
    name: Publish CI status matrix
    needs: [decide, build, tests, rfc_compliance_no_changes, promotion_policy]
    if: always() && (github.ref_name == 'master' || github.ref_name == 'staging')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out status renderer
        uses: actions/checkout@v4

      - name: Render branch status matrix
        env:
          CI_CLASSIFY: ${{ needs.decide.result }}
          CI_BUILD: ${{ needs.build.result }}
          CI_TESTS: ${{ needs.tests.result }}
          CI_UNIT: ${{ needs.tests.outputs.unit_result }}
          CI_RFC: ${{ needs.tests.outputs.rfc_result || needs.rfc_compliance_no_changes.result }}
          CI_ACVP: ${{ needs.tests.outputs.acvp_result }}
          CI_SAST: ${{ needs.tests.outputs.sast_result }}
          CI_CODEQL: ${{ needs.tests.outputs.codeql_result }}
          CI_NETWORK: ${{ needs.tests.outputs.network_result }}
          CI_DAST: ${{ needs.tests.outputs.dast_result }}
          CI_HOST: ${{ needs.tests.outputs.host_result }}
          CI_FUZZ: ${{ needs.tests.outputs.fuzz_result }}
          CI_ROM: ${{ needs.tests.outputs.rom_result }}
          CI_ROM_CLEANUP: ${{ needs.tests.outputs.rom_cleanup_result }}
          CI_POLICY: ${{ needs.promotion_policy.outputs.decision || needs.promotion_policy.result }}
        run: |
          python3 .github/scripts/render_ci_status.py \
            --branch "${{ github.ref_name }}" \
            --sha "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output "$RUNNER_TEMP/ci-status.svg"

      - name: Upload run status artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-status-${{ github.ref_name }}
          path: ${{ runner.temp }}/ci-status.svg
          if-no-files-found: error
          retention-days: 30

      - name: Update CDN-backed branch status asset
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          status_branch=ci-status
          status_path="$BRANCH_NAME.svg"
          api_base="repos/${{ github.repository }}"

          if ! gh api "$api_base/git/ref/heads/$status_branch" >/dev/null 2>&1; then
            gh api --method POST "$api_base/git/refs" \
              -f ref="refs/heads/$status_branch" -f sha="${{ github.sha }}" >/dev/null || true
          fi

          encoded=$(base64 < "$RUNNER_TEMP/ci-status.svg" | tr -d '\n')
          published=false
          for attempt in 1 2 3; do
            file_sha=$(gh api "$api_base/contents/$status_path?ref=$status_branch" \
              --jq '.sha' 2>/dev/null || true)
            args=(
              --method PUT "$api_base/contents/$status_path"
              -f message="Update $BRANCH_NAME CI status for ${{ github.sha }}"
              -f content="$encoded"
              -f branch="$status_branch"
            )
            if [ -n "$file_sha" ]; then
              args+=(-f sha="$file_sha")
            fi
            if gh api "${args[@]}" >/dev/null; then
              published=true
              break
            fi
            echo "Status branch changed concurrently; retrying (attempt $attempt)."
            sleep 2
          done
          if [ "$published" != true ]; then
            echo "::error::Could not update $status_branch/$status_path"
            exit 1
          fi

          echo "Published https://raw.githubusercontent.com/${{ github.repository }}/$status_branch/$status_path" \
            >> "$GITHUB_STEP_SUMMARY"

  open_rfc_review_pr:
    name: Open promotion PR for RFC review
    needs: [decide, build, tests, promotion_policy]
    if: >-
      always() && github.ref_name == 'staging' &&
      needs.promotion_policy.result == 'success' &&
      needs.promotion_policy.outputs.decision == 'review'
    permissions:
      actions: read
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download RFC compliance details
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: rfc-compliance-report
          path: ${{ runner.temp }}/rfc-compliance-report

      - name: Open maintainer-review promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          RFC_REPORT_PATH: ${{ runner.temp }}/rfc-compliance-report/rfc-compliance.md
        run: |
          set -euo pipefail
          short_sha=${GATE_SHA:0:12}
          promotion_branch="automation/promote-$short_sha"
          promotion_merged=false

          git fetch --no-tags origin master staging
          if git merge-base --is-ancestor "$GATE_SHA" origin/master; then
            echo "The tested staging commit is already contained in master."
            promotion_merged=true
            exit 0
          fi
          existing_sha=""
          if ref_sha=$(gh api "repos/${{ github.repository }}/git/ref/heads/$promotion_branch" \
            --jq '.object.sha' 2>/dev/null); then
            existing_sha=$ref_sha
          fi
          if [ -z "$existing_sha" ]; then
            gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/heads/$promotion_branch" -f sha="$GATE_SHA" >/dev/null
          elif [ "$existing_sha" != "$GATE_SHA" ]; then
            echo "::error::$promotion_branch exists at $existing_sha instead of tested SHA $GATE_SHA"
            exit 1
          fi

          body="$RUNNER_TEMP/rfc-review-pr.md"
          {
            echo "All automated gates except **RFC compliance** passed for this exact staging commit."
            echo
            echo "- Tested commit: \`$GATE_SHA\`"
            echo "- Source branch: \`staging\`"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "> This PR will not be merged automatically. A maintainer may merge it after reviewing and accepting the RFC findings."
            if [ -s "$RFC_REPORT_PATH" ]; then
              echo
              echo "## RFC compliance report"
              echo
              cat "$RFC_REPORT_PATH"
            fi
            echo
            echo "The temporary head branch points to the exact signed and tested staging commit, so later staging pushes are excluded."
          } > "$body"

          pr_number=$(gh pr list --repo "${{ github.repository }}" --state open \
            --base master --head "$promotion_branch" --json number \
            --jq '.[0].number // empty')
          title="RFC review required: promote staging $short_sha"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --repo "${{ github.repository }}" \
              --title "$title" --body-file "$body"
            echo "Updated RFC-review promotion PR #$pr_number."
          else
            gh pr create --repo "${{ github.repository }}" \
              --base master --head "$promotion_branch" \
              --title "$title" --body-file "$body"
          fi

  promote:
    name: Promote signed staging commit through PR
    needs: [decide, build, tests, rfc_compliance_no_changes, promotion_policy]
    if: >-
      always() && github.ref_name == 'staging' &&
      needs.promotion_policy.result == 'success' &&
      needs.promotion_policy.outputs.decision == 'auto'
    permissions:
      actions: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open and merge promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          CODE_CHANGED: ${{ needs.decide.outputs.code_changed }}
        run: |
          set -euo pipefail
          short_sha=${GATE_SHA:0:12}
          promotion_branch="automation/promote-$short_sha"
          promotion_merged=false

          git fetch --no-tags origin master staging
          if git merge-base --is-ancestor "$GATE_SHA" origin/master; then
            echo "The tested staging commit is already contained in master."
            promotion_merged=true
          else
            existing_sha=""
            if ref_sha=$(gh api "repos/${{ github.repository }}/git/ref/heads/$promotion_branch" \
              --jq '.object.sha' 2>/dev/null); then
              existing_sha=$ref_sha
            fi
            if [ -z "$existing_sha" ]; then
              gh api --method POST "repos/${{ github.repository }}/git/refs" \
                -f ref="refs/heads/$promotion_branch" -f sha="$GATE_SHA" >/dev/null
            elif [ "$existing_sha" != "$GATE_SHA" ]; then
              echo "::error::$promotion_branch exists at $existing_sha instead of tested SHA $GATE_SHA"
              exit 1
            fi

            pr_number=$(gh pr list --repo "${{ github.repository }}" --state open \
              --base master --head "$promotion_branch" --json number \
              --jq '.[0].number // empty')
            if [ -z "$pr_number" ]; then
              body="$RUNNER_TEMP/promotion-pr.md"
              {
                echo "Automated promotion of the exact signed staging commit that passed its required gates."
                echo
                echo "- Tested commit: \`$GATE_SHA\`"
                echo "- Source branch: \`staging\`"
                echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                echo
                echo "The temporary head branch points to the exact tested commit; later staging pushes are excluded."
              } > "$body"
              pr_url=$(gh pr create --repo "${{ github.repository }}" \
                --base master --head "$promotion_branch" \
                --title "Promote staging $short_sha to master" --body-file "$body")
              pr_number=${pr_url##*/}
            fi

            gh pr merge "$pr_number" --repo "${{ github.repository }}" \
              --auto --merge --delete-branch --match-head-commit "$GATE_SHA"
            pr_state=$(gh pr view "$pr_number" --repo "${{ github.repository }}" \
              --json state --jq '.state')
            if [ "$pr_state" = MERGED ]; then
              promotion_merged=true
              echo "Promotion PR #$pr_number merged; staging remains intact."
            else
              echo "Promotion PR #$pr_number will merge when all master requirements are satisfied."
            fi
          fi

          # GITHUB_TOKEN events do not reliably start another push workflow, so
          # explicitly gate master after an immediate automated merge.
          dispatch_workflow() {
            workflow=$1
            branch=$2
            for attempt in 1 2 3; do
              if gh workflow run "$workflow" --repo "${{ github.repository }}" --ref "$branch"; then
                return 0
              fi
              echo "$workflow dispatch for $branch was not ready (attempt $attempt); retrying."
              sleep 3
            done
            return 1
          }
          if [ "$CODE_CHANGED" = true ]; then
            dispatch_workflow deploy.yml staging
            if [ "$promotion_merged" = true ]; then
              dispatch_workflow build.yml master
            else
              echo "The eventual auto-merge push to master will trigger its gate."
            fi
          else
            echo "No code changed; release rebuilds are unnecessary."
          fi

  deploy_master:
    name: Deploy gated master
    needs: promotion_policy
    if: >-
      always() && github.ref_name == 'master' &&
      needs.promotion_policy.result == 'success' &&
      needs.promotion_policy.outputs.decision == 'auto'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch stable deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref master

  notify_build_failure:
    name: Notify commit author of build failure
    needs: [decide, build]
    if: >-
      always() &&
      needs.decide.outputs.code_changed == 'true' &&
      needs.build.result != 'success'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Open or update a branch failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit_json=$(gh api "repos/${{ github.repository }}/commits/$GATE_SHA")
          author=$(jq -r '.author.login // .committer.login // empty' <<< "$commit_json")
          author_name=$(jq -r '.commit.author.name // "the commit author"' <<< "$commit_json")
          mention="**$author_name**"
          if [ -n "$author" ]; then mention="@$author"; fi
          short_sha=${GATE_SHA:0:12}
          title="[$BRANCH_NAME] Gate failure for $short_sha"
          body="$RUNNER_TEMP/branch-build-failure.md"
          {
            echo "<!-- branch-gate:$GATE_SHA -->"
            echo "$mention, the $BRANCH_NAME gate failed during the build."
            echo
            echo "- Branch: [\`$BRANCH_NAME\`](${{ github.server_url }}/${{ github.repository }}/tree/$BRANCH_NAME)"
            echo "- Commit: [\`$GATE_SHA\`](${{ github.server_url }}/${{ github.repository }}/commit/$GATE_SHA)"
            echo "- Failed gate: **Build**"
            echo "- [View workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > "$body"

          issue_number=$(gh issue list --repo "${{ github.repository }}" --state all \
            --search "$GATE_SHA in:body" --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue reopen "$issue_number" --repo "${{ github.repository }}" >/dev/null 2>&1 || true
            gh issue edit "$issue_number" --repo "${{ github.repository }}" \
              --title "$title" --body-file "$body"
          else
            issue_url=$(gh issue create --repo "${{ github.repository }}" \
              --title "$title" --body-file "$body")
            issue_number=${issue_url##*/}
          fi
          if [ -n "$author" ]; then
            gh issue edit "$issue_number" --repo "${{ github.repository }}" \
              --add-assignee "$author" || echo "::warning::Could not assign @$author to issue #$issue_number"
          fi

