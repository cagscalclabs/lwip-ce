name: Publish RNG Statistics

on:
  push:
    branches:
      - master
    paths:
      - statistics/rng/**
      - tests/profiling/tls_rng_stats/tools/analyze_rng_stats.py
      - tests/profiling/tls_rng_stats/tools/summarize_rng_stats.py
      - .github/workflows/rng-statistics.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: statistics-assets-latest
  cancel-in-progress: false

jobs:
  report:
    name: RNG statistics report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin

      - name: Generate report
        env:
          IMAGE_URL: https://github.com/${{ github.repository }}/releases/download/statistics-assets-latest/rng-distributions.png?run=${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 tests/profiling/tls_rng_stats/tools/summarize_rng_stats.py \
            --stats-dir statistics/rng \
            --output-dir build/rng-statistics \
            --image-url "$IMAGE_URL"
          rsvg-convert \
            --width 1800 \
            --output build/rng-statistics/rng-distributions.png \
            build/rng-statistics/rng-distributions.svg

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: rng-statistics
          path: build/rng-statistics/
          if-no-files-found: error

      - name: Publish latest report assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f statistics-assets-latest "$GITHUB_SHA"
          git push -f origin refs/tags/statistics-assets-latest

          if ! gh release view statistics-assets-latest >/dev/null 2>&1; then
            gh release create statistics-assets-latest \
              --title "statistics-assets-latest" \
              --notes "Latest generated project statistics and visualizations." \
              --latest=false
          fi

          gh release upload statistics-assets-latest \
            build/rng-statistics/rng-distributions.png \
            build/rng-statistics/rng-distributions.svg \
            build/rng-statistics/rng-statistics.csv \
            build/rng-statistics/rng-statistics.json \
            build/rng-statistics/rng-statistics.md \
            --clobber

      - name: Publish job summary
        run: cat build/rng-statistics/rng-statistics.md >> "$GITHUB_STEP_SUMMARY"
