name: CAVP Primitive Validation

# Runs NIST CAVP test vectors against the shipping cryptographic primitives.
# Dyload variant: links tests/profiling/tls_cavp against the curated,
# manifest-gated lwip.lib produced by build.yml. Triggers on build.yml's
# completion (workflow_run) so it always has a fresh artifact to pull from,
# plus manual dispatch and workflow_call (for other callers that already
# have an in-run artifact). tests/common/scripts/cavp_fetch.py
# downloads NIST CAVP archives, stratifies 16 vectors per primitive across
# AES modes/key sizes/directions and SHA message classes, adds generated
# RSA-PSS/RSA-PKCS1v15/PBKDF2/HKDF/X25519 coverage plus RFC-pinned vectors,
# and emits CAVP00..15.8xv + expected.json for the test run.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_name:
        description: "Name of an in-run build artifact (e.g. lwip-latest) to download instead of fetching the published nightly release."
        required: false
        type: string
  # Triggered off build.yml's completion rather than our own push/PR filter:
  # this job needs build.yml's lwip-latest artifact, and a push-triggered
  # run here would race build.yml's own run on the same commit (and often
  # lose -- see incident where "no valid artifacts found to download" fired
  # because our run queried before build.yml's had finished uploading).
  # workflow_run guarantees build.yml is done (success or not) before we start.
  workflow_run:
    workflows: ["Build Latest lwIP Dylib"]
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  AUTOTESTER_ROM: ${{ github.workspace }}/${{ vars.AUTOTESTER_ROM }}
  LWIP_PROF_TESTS: ${{github.workspace}}/tests/profiling
  LWIP_TESTS_COMMON: ${{github.workspace}}/tests/common
  CEMU_PATH: ${{github.workspace}}/CEmu
  CEDEV: ${{github.workspace}}/CEdev
  CEDEV_BIN: ${{github.workspace}}/CEdev/bin
  CAVP_TEST_DIR: ${{github.workspace}}/tests/profiling/tls_cavp
  CAVP_FETCH_SAMPLE: 16

jobs:
  cavp:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TLS branch
        uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Load pinned CI dependency versions
        id: ci_versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update && \
          sudo apt-get install -y make tar wget qt5-qmake qtbase5-dev xvfb \
                                  python3 python3-cryptography
          # CAVP archive parsing uses stdlib. RSA-PSS, RSA-PKCS1v15, PBKDF2,
          # HKDF, and X25519 reference outputs use python3-cryptography. RSA
          # is generated with e=65537 because the project's verifier fixes
          # that exponent.

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{github.workspace}}/CEdev
          key: ${{ runner.os }}-cedev-${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "github.com/CE-Programming/toolchain/releases/download/${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}/CEdev-Linux.tar.gz" | tar xz

      - name: Add CEdev to PATH
        run: |
          echo "${{github.workspace}}/CEdev/bin" >> $GITHUB_PATH

      - name: Download in-run build artifact
        if: inputs.artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{github.workspace}}/release

      - name: Download build.yml artifact
        # On workflow_run, download from the exact build.yml run that
        # triggered us (its head_sha is what we checked out above) --
        # no need to re-query "latest successful", which is what raced
        # build.yml's own upload in the old push-triggered design.
        #
        # build.yml's own dylib_latest job can legitimately SKIP (its
        # sentinel-cache gate found nothing changed since the last
        # successful build -- e.g. a scheduled run that lands on a
        # no-op tick) while the overall run still reports "success"
        # (a skipped job doesn't fail a workflow). That means a
        # workflow_run completion here is not a guarantee an artifact
        # actually exists. Treat "no artifact" as "nothing to test this
        # time" (found=false, job exits clean) rather than a failure --
        # the alternative is this job hard-failing on every build.yml
        # no-op tick with nothing to actually report on.
        if: inputs.artifact_name == ''
        id: download_build_artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{github.workspace}}/release"
          run_id="${{ github.event.workflow_run.id }}"
          if [ -z "$run_id" ]; then
            run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?status=success&branch=master&per_page=1" \
              --jq '.workflow_runs[0].id')
          fi
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::warning::No build.yml run found to pull an artifact from -- nothing to test."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          has_artifact=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts" \
            --jq '.artifacts[] | select(.name == "lwip-latest") | .name' | head -1)
          if [ -z "$has_artifact" ]; then
            echo "::warning::build.yml run $run_id has no lwip-latest artifact (its build job likely skipped as a no-op) -- nothing to test."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run download "$run_id" --repo "${{ github.repository }}" --name lwip-latest --dir "${{github.workspace}}/release"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: No artifact to test
        if: inputs.artifact_name == '' && steps.download_build_artifact.outputs.found != 'true'
        run: echo "No lwip-latest artifact available this run; skipping CAVP." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify build artifact contents
        if: inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true'
        run: |
          test -f "${{github.workspace}}/release/appinst/lwIPINST.8xp"
          test -n "$(find "${{github.workspace}}/release/appinst" -name 'LWIP.*.8xv' -print -quit)"
          ls -lh "${{github.workspace}}/release"

      - name: Install lwip.lib + headers into CEdev
        if: inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true'
        run: |
          mkdir -p "${{env.CEDEV}}/lib/libload" "${{env.CEDEV}}/include"
          cp "${{github.workspace}}/release/lwip.lib" "${{env.CEDEV}}/lib/libload/lwip.lib"
          cp "${{github.workspace}}/release/lwip.h" "${{env.CEDEV}}/include/lwip.h"
          cp -r "${{github.workspace}}/release/lwip" "${{env.CEDEV}}/include/lwip"
          test -f "${{env.CEDEV}}/lib/libload/lwip.lib"
          test -f "${{env.CEDEV}}/include/lwip.h"
          test -d "${{env.CEDEV}}/include/lwip"

      - name: Download CEmu Rom
        if: inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true'
        run: |
          curl -fSL \
            --retry 3 \
            --retry-delay 2 \
            -o "${{github.workspace}}/CE.rom.enc" \
            https://cagscalclabs.net/restricted/${{ vars.AUTOTESTER_ROM }}.enc

          gpg --batch --yes \
            --passphrase "${{ secrets.AES_ENCRYPT_KEY }}" \
            --output "${{ env.AUTOTESTER_ROM }}" \
            --decrypt "${{github.workspace}}/CE.rom.enc"

          shred -u "${{github.workspace}}/CE.rom.enc"

          if [ ! -f "${{ env.AUTOTESTER_ROM }}" ]; then
            echo "ERROR: ROM file not created"
            exit 1
          fi

      - name: Checkout CEmu
        if: inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          repository: CE-Programming/CEmu
          ref: ${{ steps.ci_versions.outputs.CEMU_REF }}
          path: ${{env.CEMU_PATH}}
          persist-credentials: false

      - name: Cache CEmu Build Outputs
        if: inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true'
        id: cemu-cache
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-cemu-${{ steps.ci_versions.outputs.CEMU_REF }}
          path: |
            ${{env.CEMU_PATH}}/core/CEmu
            ${{env.CEMU_PATH}}/tests/autotester/autotester

      - name: Build CEmu
        if: (inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true') && steps.cemu-cache.outputs.cache-hit != 'true'
        run: make -j4 -C ${{env.CEMU_PATH}}/core

      - name: Build Autotester CLI
        if: (inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true') && steps.cemu-cache.outputs.cache-hit != 'true'
        run: make -j4 -C ${{env.CEMU_PATH}}/tests/autotester

      - name: Install Autotester CLI
        if: inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true'
        run: cmake -E copy ${{env.CEMU_PATH}}/tests/autotester/autotester ${{env.CEDEV_BIN}}/cemu-autotester

      - name: Verify saveVar Support In Autotester
        if: inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true'
        run: |
          # saveVar is required to pull CAVPOUT.8xv off the emulator after the run
          strings "${{env.CEDEV_BIN}}/cemu-autotester" | grep -q "saveVar" || {
            echo "ERROR: Installed autotester does not include saveVar support."
            exit 1
          }

      - name: Verify Autotester Setup
        if: inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true'
        run: |
          ls -lh ${{env.AUTOTESTER_ROM}}
          xvfb-run -a ${{env.CEDEV_BIN}}/cemu-autotester --help || echo "Autotester help failed (may be normal)"

      - name: Prepare shared dyload test files
        if: inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true'
        run: |
          mkdir -p ${{env.LWIP_TESTS_COMMON}}
          cp "${{github.workspace}}/release/appinst/lwIPINST.8xp" ${{env.LWIP_TESTS_COMMON}}/
          cp "${{github.workspace}}/release/lwip.8xv" ${{env.LWIP_TESTS_COMMON}}/
          for appvar in "${{github.workspace}}"/release/appinst/LWIP.*.8xv; do
            cp "$appvar" "${{env.LWIP_TESTS_COMMON}}/"
          done
          curl -fL \
            -o ${{env.LWIP_TESTS_COMMON}}/lwIPCERT.8xv \
            https://github.com/${{ github.repository }}/releases/download/truststore-latest/lwIPCERT.8xv
          curl -fL \
            -o ${{env.LWIP_TESTS_COMMON}}/clibs.8xg \
            https://github.com/CE-Programming/libraries/releases/latest/download/clibs.8xg
          test -f ${{env.LWIP_TESTS_COMMON}}/clibs.8xg
          test -f ${{env.LWIP_TESTS_COMMON}}/lwIPCERT.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/lwIPINST.8xp
          test -f ${{env.LWIP_TESTS_COMMON}}/lwip.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.0.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.1.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.2.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.3.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.4.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.5.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.6.8xv
          ls -lh ${{env.LWIP_TESTS_COMMON}}

      - name: Cache CAVP vector archives
        if: inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true'
        # NIST CAVP zips are bandwidth-friendly to cache (a few MB each) and
        # version-stable; refreshing them isn't valuable per-CI-run. The
        # actual vectors are re-sampled randomly inside cavp_fetch.py.
        uses: actions/cache@v5
        with:
          path: ${{env.CAVP_TEST_DIR}}/vectors/cache
          key: ${{ runner.os }}-cavp-archives-v2
          restore-keys: |
            ${{ runner.os }}-cavp-archives-

      - name: Fetch CAVP vectors and pack input AppVars
        if: inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true'
        # cavp_fetch.py: downloads NIST CAVP zips (if not cached), parses
        # the .rsp files, randomly samples vectors per algorithm, merges in
        # generated RSA-PSS/RSA-PKCS1v15/PBKDF2/HKDF/X25519 coverage plus
        # RFC-pinned vectors, packs CAVP00..15.8xv for the calc, and writes
        # expected.json for the grader. All in one shot.
        run: |
          python3 "${{github.workspace}}/tests/common/scripts/cavp_fetch.py"
          ls -lh "${{env.CAVP_TEST_DIR}}"/vectors/CAVP*.8xv \
                 "${{env.CAVP_TEST_DIR}}/vectors/expected.json"

      - name: Run CAVP Test
        if: inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true'
        id: run_cavp
        run: |
          test_dir="${{env.CAVP_TEST_DIR}}"
          rm -f "$test_dir/CAVPOUT.8xv" "$test_dir/CAVPRSA.8xv" "$test_dir/autotest.log"
          test_start=$(($(date +%s%N)/1000000))
          make -C "$test_dir" clean
          make -C "$test_dir"
          set +e
          make -C "$test_dir" test 2>&1 | tee "$test_dir/autotest.log"
          status=${PIPESTATUS[0]}
          set -e
          test_end=$(($(date +%s%N)/1000000))
          test_duration=$((test_end - test_start))
          echo "duration=$test_duration" >> "$GITHUB_OUTPUT"
          echo "autotester_status=$status" >> "$GITHUB_OUTPUT"
          # The VRAM hash is only a coarse completion check. saveVar + the
          # parser below are authoritative for CAVP correctness, so continue
          # whenever the emulator run reached the saveVar step.
          exit 0

      - name: Locate CAVPOUT AppVar
        id: locate_appvar
        if: always() && (inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true')
        run: |
          test_dir="${{env.CAVP_TEST_DIR}}"
          appvar_out="$test_dir/CAVPOUT.8xv"
          if [ ! -s "$appvar_out" ]; then
            echo "found=" >> "$GITHUB_OUTPUT"
            echo "## CAVP Primitive Validation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **CAVPOUT.8xv was not produced.** The calc-side runner either crashed or saveVar didn't trigger." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Autotester log tail:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 "$test_dir/autotest.log" >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "found=$appvar_out" >> "$GITHUB_OUTPUT"
          ls -lh "$appvar_out"

      - name: Grade Responses
        id: grade
        if: always() && steps.locate_appvar.outputs.found != ''
        # parse_cavp_output_appvar.py reads CAVPOUT.8xv + vectors JSON from
        # CAVP_TEST_DIR. Only output paths are flagged.
        run: |
          test_dir="${{env.CAVP_TEST_DIR}}"
          summary_md="${{github.workspace}}/cavp-summary.md"
          results_json="${{github.workspace}}/cavp-results.json"
          set +e
          python3 "${{github.workspace}}/tests/common/scripts/parse_cavp_output_appvar.py" \
            --markdown-out "$summary_md" \
            --json-out "$results_json"
          grade_status=$?
          set -e
          echo "grade_status=$grade_status" >> "$GITHUB_OUTPUT"
          cat "$summary_md" >> $GITHUB_STEP_SUMMARY
          exit $grade_status

      - name: Upload CAVP Raw Artifacts
        if: always() && (inputs.artifact_name != '' || steps.download_build_artifact.outputs.found == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: tls-cavp-raw
          path: |
            ${{env.CAVP_TEST_DIR}}/CAVPOUT.8xv
            ${{env.CAVP_TEST_DIR}}/vectors/CAVP*.8xv
            ${{env.CAVP_TEST_DIR}}/vectors/expected.json
            ${{env.CAVP_TEST_DIR}}/autotest.log
            ${{github.workspace}}/cavp-summary.md
            ${{github.workspace}}/cavp-results.json
          if-no-files-found: warn

      - name: Remove CEmu Rom
        if: always()
        run: shred -u "${{env.AUTOTESTER_ROM}}" 2>/dev/null || true
