name: Timing Profiling

# Differential timing analysis of the TLS primitives via the tls_timing
# profiler. Split out from the unit-test workflow so that timing variance
# and primitive correctness fail independently (and surface as independent
# README badges).

on:
  push:
    branches: ['tls']
    paths:
      - '.github/workflows/timing.yml'
      - 'src/tls/**'
      - 'tests/profiling/tls_timing/**'
  workflow_dispatch:

env:
  AUTOTESTER_ROM: ${{github.workspace}}/CE.rom
  LWIP_TESTS: ${{github.workspace}}/tests
  LWIP_PROF_TESTS: ${{github.workspace}}/tests/profiling
  CEMU_PATH: ${{github.workspace}}/CEmu
  CEMU_ROM_PATH: ${{secrets.CL_SECRETS_URL}}/CE.rom
  SECRETS_TOKEN: ${{secrets.CL_SECRETS_TOKEN}}
  CEDEV_BIN: ${{github.workspace}}/CEdev/bin

jobs:
  profile_timing_consistency:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout TLS branch
        uses: actions/checkout@v4
        with:
          ref: 'tls'
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y make tar wget qt5-qmake qtbase5-dev xvfb

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{github.workspace}}/CEdev
          key: ${{ runner.os }}-cedev-v15.0

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL github.com/CE-Programming/toolchain/releases/download/v15.0/CEdev-Linux.tar.gz | tar xz

      - name: Add CEdev to PATH
        run: |
          echo "${{github.workspace}}/CEdev/bin" >> $GITHUB_PATH
          echo $GITHUB_PATH

      - name: Download CEmu Rom
        run: |
          HTTP_CODE=$(curl -A "github/workflows" \
            -H "Authorization: Bearer ${{ env.SECRETS_TOKEN }}" \
            -w "%{http_code}" \
            -o ${{ env.AUTOTESTER_ROM }} \
            -SL ${{env.CEMU_ROM_PATH}} \
            --retry 3 \
            --retry-delay 2)

          echo "HTTP response code: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Download failed with HTTP code ${HTTP_CODE}"
            ls -lh ${{ env.AUTOTESTER_ROM }} || echo "No file created"
            exit 1
          fi

          if [ ! -f "${{ env.AUTOTESTER_ROM }}" ]; then
            echo "ERROR: ROM file not created"
            exit 1
          fi

      - name: Checkout CEmu
        uses: actions/checkout@v4
        with:
          repository: CE-Programming/CEmu
          ref: master
          path: ${{env.CEMU_PATH}}
          persist-credentials: false

      - name: Cache CEmu Build Outputs
        id: cemu-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{env.CEMU_PATH}}/core/CEmu
            ${{env.CEMU_PATH}}/tests/autotester/autotester
          key: ${{ runner.os }}-cemu-master-v3

      - name: Build CEmu
        if: steps.cemu-cache.outputs.cache-hit != 'true'
        run: make -j4 -C ${{env.CEMU_PATH}}/core

      - name: Build Autotester CLI
        if: steps.cemu-cache.outputs.cache-hit != 'true'
        run: make -j4 -C ${{env.CEMU_PATH}}/tests/autotester

      - name: Install Autotester CLI
        run: cmake -E copy ${{env.CEMU_PATH}}/tests/autotester/autotester ${{env.CEDEV_BIN}}/cemu-autotester

      - name: Verify saveVar Support In Autotester
        run: |
          strings "${{env.CEDEV_BIN}}/cemu-autotester" | grep -q "saveVar" || {
            echo "ERROR: Installed autotester does not include saveVar support."
            exit 1
          }

      - name: Verify Autotester Setup
        run: |
          echo "Testing autotester with xvfb..."
          echo "ROM path: ${{env.AUTOTESTER_ROM}}"
          ls -lh ${{env.AUTOTESTER_ROM}}
          xvfb-run -a ${{env.CEDEV_BIN}}/cemu-autotester --help || echo "Autotester help failed (may be normal)"

      - name: Download CE Libraries Group (clibs.8xg)
        run: |
          test_dir="${{env.LWIP_PROF_TESTS}}/tls_timing"
          mkdir -p "$test_dir"
          curl -fL \
            -o "$test_dir/clibs.8xg" \
            https://github.com/CE-Programming/libraries/releases/download/v14.2/clibs.8xg
          ls -lh "$test_dir/clibs.8xg"

      - name: Run Timing Unit Test
        run: |
          total_tests=0
          total_passed=0
          total_failed=0
          start_time=$(($(date +%s%N)/1000000))

          test_dir="${{env.LWIP_PROF_TESTS}}/tls_timing"
          status=0
          failed_hash_id=""
          test_start=$(($(date +%s%N)/1000000))
          make -C "$test_dir" clean
          make -C "$test_dir"
          set +e
          make -C "$test_dir" test 2>&1 | tee "$test_dir/autotest.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            failed_hash_id=$(grep -Eo 'hashWait\|[0-9]+' "$test_dir/autotest.log" | tail -n1 | cut -d'|' -f2 || true)
            if [ -z "$failed_hash_id" ]; then
              failed_hash_id=$(grep -Eo 'num[0-9]+_dump' "$test_dir/autotest.log" | tail -n1 | sed -E 's/[^0-9]//g' || true)
            fi
          fi
          test_done=$(($(date +%s%N)/1000000))
          test_duration=$((test_done - test_start))

          total_tests=1
          if [ $status -eq 0 ]; then
            total_passed=1
            test_status="passed"
          else
            total_failed=1
            test_status="failed"
          fi
          echo -e "{\"name\":\"tls_timing\",\"status\":\"$test_status\",\"duration\":\"$test_duration\",\"failed_hash_id\":\"$failed_hash_id\"}" > "$test_dir/result.json"

          end_time=$(($(date +%s%N)/1000000))
          echo -e "\"summary\":{\"tests\":\"$total_tests\",\"passed\":\"$total_passed\",\"failed\":\"$total_failed\",\"pending\":\"0\",\"skipped\":\"0\",\"other\":\"0\",\"start\":\"$start_time\",\"stop\":\"$end_time\"}" > ${{github.workspace}}/summary.json
          cmake -E echo "timing module tested, $total_passed passed, $total_failed failed!"
          exit $total_failed

      - name: Extract TLSTMLOG AppVar and Build Verbose Summary
        if: always()
        run: |
          test_dir="${{env.LWIP_PROF_TESTS}}/tls_timing"
          summary_md="${{github.workspace}}/timing-verbose-summary.md"
          appvar_out="$test_dir/TLSTMLOG.8xv"
          bin_out="$test_dir/TLSTMLOG.bin"
          txt_out="$test_dir/TLSTMLOG.txt"

          : > "$summary_md"
          echo "### Timing Verbose Details (from TLSTMLOG AppVar)" >> "$summary_md"
          echo "" >> "$summary_md"
              echo "For each test, sigma = 1.4826 * MAD(case_best_samples), c = [6, 4]." >> "$summary_md"
              echo "A pass is required for the c=6 case. c=4 case is for additional robustness." >> "$summary_md"
              echo "max deviations is computed max(c, c * sigma)." >> "$summary_md"
              echo "Over% reports the larger one-sided exceedance rate, not the sum of over and under threshold samples." >> "$summary_md"

          appvar_src=""
          if [ -f "$appvar_out" ]; then
            appvar_src="$appvar_out"
          else
            appvar_src=$(find "${{github.workspace}}" -type f \( -iname "TLSTMLOG.8xv" -o -iname "TLSTMLOG*.8xv" \) -print0 \
              | xargs -0 ls -1t 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$appvar_src" ]; then
            echo "- TLSTMLOG AppVar was not found in runner workspace after autotest." >> "$summary_md"
            echo "- If this persists, autotester may need explicit AppVar receive/export support in the test sequence." >> "$summary_md"
            exit 0
          fi

          appvar_src_abs="$(readlink -f "$appvar_src")"
          appvar_out_abs="$(readlink -f "$appvar_out" 2>/dev/null || true)"
          if [ "$appvar_src_abs" != "$appvar_out_abs" ]; then
            cp "$appvar_src" "$appvar_out"
          fi
          convbin -i "$appvar_out" -o "$bin_out" -j 8x -k bin
          tr -d '\000\r' < "$bin_out" > "$txt_out"

          if ! grep -qE '^(robust|class),' "$txt_out"; then
            echo "- TLSTMLOG extracted, but no parseable robust/class lines were found." >> "$summary_md"
            echo "" >> "$summary_md"
            echo "<details><summary>Raw TLSTMLOG text</summary>" >> "$summary_md"
            echo "" >> "$summary_md"
            echo '```text' >> "$summary_md"
            cat "$txt_out" >> "$summary_md"
            echo '```' >> "$summary_md"
            echo "</details>" >> "$summary_md"
            exit 0
          fi

          awk -F',' '
            function parse_kv(start_idx,    i) {
              for (i = start_idx; i <= NF; i++) {
                split($i, kv, "=")
                k = kv[1]
                v = kv[2]
                if (k == "sigma") sigma_cur = v
                else if (k == "accept") accept_cur = v
                else if (k == "median") median_cur = v
                else if (k == "over") over_cur = v
                else if (k == "dpass") dpass_cur = v
              }
            }
            function get_or_dash(v) { return (v == "" ? "-" : v) }
            BEGIN {
              n_prim = 0
              n_robust = 0
              n_robust4 = 0
            }
            /^primitive=/ {
              split($1, prim_parts, "=")
              prim = prim_parts[2]
              if (prim != "" && !seen[prim]) {
                seen[prim] = 1
                order[++n_prim] = prim
              }
              next
            }
            $1 == "robust" {
              prim = $2
              if (!seen[prim]) {
                seen[prim] = 1
                order[++n_prim] = prim
              }
              n_robust++
              sigma_cur = ""; accept_cur = ""; median_cur = ""; dpass_cur = ""
              parse_kv(3)
              sigma[prim] = sigma_cur
              accept6[prim] = accept_cur
              base_med[prim] = median_cur + 0
              dpass6[prim] = dpass_cur
              next
            }
            $1 == "robust4" {
              prim = $2
              if (!seen[prim]) {
                seen[prim] = 1
                order[++n_prim] = prim
              }
              n_robust4++
              sigma_cur = ""; accept_cur = ""; dpass_cur = ""
              parse_kv(3)
              if (sigma[prim] == "") sigma[prim] = sigma_cur
              accept4[prim] = accept_cur
              dpass4[prim] = dpass_cur
              next
            }
            $1 == "class" {
              prim = $2
              cls = $3
              median_cur = ""; over_cur = ""
              parse_kv(4)
              dev = (median_cur + 0) - base_med[prim]
              med_dev[prim, cls] = dev
              over6[prim, cls] = over_cur
              next
            }
            $1 == "class4" {
              prim = $2
              cls = $3
              over_cur = ""
              parse_kv(4)
              over4[prim, cls] = over_cur
              next
            }
            END {
              classes[1] = "best"
              classes[2] = "worst"
              classes[3] = "random"
              classes[4] = "edge"
              print ""
              printf("_Parsed primitives: %d (robust=%d, robust4=%d)_\n", n_prim, n_robust, n_robust4)
              print ""
              print "| Unit | Avg σ | Avg ∆ (c6/c4) | MedDev (W/R/E) | Directional Over% c6 (W/R/E) | Directional Over% c4 (W/R/E) |"
              print "|---|---:|---:|---:|---:|---:|"
              for (pidx = 1; pidx <= n_prim; pidx++) {
                prim_name = order[pidx]
                sigma_v = get_or_dash(sigma[prim_name])
                d6 = get_or_dash(accept6[prim_name])
                d4 = get_or_dash(accept4[prim_name])
                if (d6 != "-") d6 = d6 ".00"
                if (d4 != "-") d4 = d4 ".00"
                dpair = d6 "/" d4
                md_w = ((prim_name SUBSEP "worst") in med_dev) ? sprintf("%+.1f", med_dev[prim_name, "worst"] + 0.0) : "-"
                md_r = ((prim_name SUBSEP "random") in med_dev) ? sprintf("%+.1f", med_dev[prim_name, "random"] + 0.0) : "-"
                md_e = ((prim_name SUBSEP "edge") in med_dev) ? sprintf("%+.1f", med_dev[prim_name, "edge"] + 0.0) : "-"
                o6_w = ((prim_name SUBSEP "worst") in over6) ? over6[prim_name, "worst"] : "-"
                o6_r = ((prim_name SUBSEP "random") in over6) ? over6[prim_name, "random"] : "-"
                o6_e = ((prim_name SUBSEP "edge") in over6) ? over6[prim_name, "edge"] : "-"
                o4_w = ((prim_name SUBSEP "worst") in over4) ? over4[prim_name, "worst"] : "-"
                o4_r = ((prim_name SUBSEP "random") in over4) ? over4[prim_name, "random"] : "-"
                o4_e = ((prim_name SUBSEP "edge") in over4) ? over4[prim_name, "edge"] : "-"
                printf("| %s | %s | %s | %s/%s/%s | %s/%s/%s | %s/%s/%s |\n",
                       prim_name, sigma_v, dpair, md_w, md_r, md_e, o6_w, o6_r, o6_e, o4_w, o4_r, o4_e)
              }
            }
          ' "$txt_out" >> "$summary_md"

      - name: Generate Timing JSON Results
        if: always()
        run: |
          echo -e "{\"results\":{" > ${{github.workspace}}/results-timing.json
          cat ${{github.workspace}}/summary.json >> ${{github.workspace}}/results-timing.json
          echo -e ",\"tests\":[" >> ${{github.workspace}}/results-timing.json
          echo "$(cat ${{env.LWIP_PROF_TESTS}}/tls_timing/result.json)" >> ${{github.workspace}}/results-timing.json
          rm ${{env.LWIP_PROF_TESTS}}/tls_timing/result.json
          echo -e "]" >> ${{github.workspace}}/results-timing.json
          echo -e "}}" >> ${{github.workspace}}/results-timing.json
          rm ${{github.workspace}}/summary.json

      - name: Publish Timing Test Summary
        if: always()
        run: |
          echo "## Timing Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          test_name="tls_timing"
          test_dir="$LWIP_PROF_TESTS/$test_name"
          status=$(jq -r '.results.tests[] | select(.name == "tls_timing") | .status' ${{github.workspace}}/results-timing.json)
          failed_hash_id=$(jq -r '.results.tests[] | select(.name == "tls_timing") | .failed_hash_id // ""' ${{github.workspace}}/results-timing.json)
          module_desc=$(jq -r '.description // empty' "$test_dir/autotest.json" 2>/dev/null)
          module_desc=${module_desc:-"(no description)"}
          module_desc=${module_desc//$'\n'/ }
          module_desc=${module_desc//|/\\|}

          if [ "$status" = "passed" ]; then
            status_icon="✅ Passed"
          else
            status_icon="❌ Failed"
          fi

          echo "### Timing Module Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Test | Status | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| $test_name |  | $status_icon | $module_desc |" >> $GITHUB_STEP_SUMMARY

          jq -r '.sequence // [] | map(select(startswith("hashWait")))[]' "$test_dir/autotest.json" 2>/dev/null | while read -r seq_entry; do
            hash_id="${seq_entry#hashWait|}"
            hash_desc=$(jq -r ".hashes[\"$hash_id\"].description // \"(no description)\"" "$test_dir/autotest.json" 2>/dev/null)
            hash_desc=${hash_desc//$'\n'/ }
            hash_desc=${hash_desc//|/\\|}
            if [ "$status" = "passed" ]; then
              hash_status="✅ Passed"
            else
              if [[ "$failed_hash_id" =~ ^[0-9]+$ ]]; then
                if [ "$hash_id" = "$failed_hash_id" ]; then
                  hash_status="❌ Failed"
                elif [ "$hash_id" -lt "$failed_hash_id" ]; then
                  hash_status="✅ Passed"
                else
                  hash_status="⚪ Not reached"
                fi
              else
                hash_status="❓ Unknown"
              fi
            fi
            echo "|  | $hash_id | $hash_status | $hash_desc |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "${{github.workspace}}/timing-verbose-summary.md" ]; then
            cat "${{github.workspace}}/timing-verbose-summary.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Timing Verbose Details (from TLSTMLOG AppVar)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Verbose timing summary file was not generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Timing Results Logfile
        uses: actions/upload-artifact@v4
        with:
          name: results-timing.json
          path: ${{github.workspace}}/results-timing.json

      - name: Upload Timing Raw AppVar/Text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tls-timing-raw-log
          path: |
            ${{env.LWIP_PROF_TESTS}}/tls_timing/TLSTMLOG.8xv
            ${{env.LWIP_PROF_TESTS}}/tls_timing/TLSTMLOG.bin
            ${{env.LWIP_PROF_TESTS}}/tls_timing/TLSTMLOG.txt
            ${{env.LWIP_PROF_TESTS}}/tls_timing/autotest.log
            ${{github.workspace}}/timing-verbose-summary.md
          if-no-files-found: warn

      - name: Remove CEmu Rom
        if: always()
        run: rm -f ${{env.AUTOTESTER_ROM}}
