name: Publish Statistics

on:
  push:
    branches:
      - master
    paths:
      - statistics/**
      - tests/profiling/tls_rng_stats/tools/analyze_rng_stats.py
      - tests/profiling/tls_rng_stats/tools/summarize_rng_stats.py
      - tests/profiling/tls_timing/tools/summarize_timing_stats.py
      - .github/workflows/statistics.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: statistics-assets-latest
  cancel-in-progress: false

jobs:
  discover:
    name: Discover statistics suites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.suites.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build suite matrix
        id: suites
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          supported = {
              "rng": "*_rngstats.json",
              "timing": "*_ctstats.json",
          }
          include = []
          statistics = Path("statistics")
          for directory in sorted(path for path in statistics.iterdir() if path.is_dir()):
              pattern = supported.get(directory.name)
              if pattern is None:
                  if any(directory.glob("*.json")):
                      raise SystemExit(
                          f"statistics/{directory.name} contains JSON but has no report generator"
                      )
                  continue
              if any(directory.glob(pattern)):
                  include.append({"suite": directory.name})

          if not include:
              raise SystemExit("no supported statistics profiles were found")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": include}) + "\n")
          PY

  report:
    name: ${{ matrix.suite }} statistics report
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SVG renderer
        if: matrix.suite == 'rng'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin

      - name: Generate RNG report
        if: matrix.suite == 'rng'
        env:
          IMAGE_URL: https://github.com/${{ github.repository }}/releases/download/statistics-assets-latest/rng-distributions.png?run=${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 tests/profiling/tls_rng_stats/tools/summarize_rng_stats.py \
            --stats-dir statistics/rng \
            --output-dir build/statistics/rng \
            --image-url "$IMAGE_URL"
          rsvg-convert \
            --width 1800 \
            --output build/statistics/rng/rng-distributions.png \
            build/statistics/rng/rng-distributions.svg

      - name: Generate timing report
        if: matrix.suite == 'timing'
        run: |
          python3 tests/profiling/tls_timing/tools/summarize_timing_stats.py \
            --stats-dir statistics/timing \
            --output-dir build/statistics/timing

      - name: Upload suite artifact
        uses: actions/upload-artifact@v4
        with:
          name: statistics-${{ matrix.suite }}
          path: build/statistics/${{ matrix.suite }}/
          if-no-files-found: error

  publish:
    name: Publish statistics reports
    needs: report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download generated reports
        uses: actions/download-artifact@v4
        with:
          pattern: statistics-*
          path: build/statistics
          merge-multiple: true

      - name: Publish latest report assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -f statistics-assets-latest "$GITHUB_SHA"
          git push -f origin refs/tags/statistics-assets-latest

          if ! gh release view statistics-assets-latest >/dev/null 2>&1; then
            gh release create statistics-assets-latest \
              --title "statistics-assets-latest" \
              --notes "Latest generated project statistics and visualizations." \
              --latest=false
          fi

          mapfile -t assets < <(find build/statistics -maxdepth 1 -type f -print | sort)
          if ((${#assets[@]} == 0)); then
            echo "No generated statistics assets were downloaded." >&2
            exit 1
          fi
          gh release upload statistics-assets-latest "${assets[@]}" --clobber

      - name: Publish job summary
        shell: bash
        run: |
          mapfile -t summaries < <(find build/statistics -maxdepth 1 -name '*-statistics.md' -type f -print | sort)
          if ((${#summaries[@]} == 0)); then
            echo "No generated Markdown summaries were downloaded." >&2
            exit 1
          fi
          for summary in "${summaries[@]}"; do
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          done
