name: Publish RNGStats capture bundle

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-rngstats-63bc072.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-rngstats-63bc072
  cancel-in-progress: false

env:
  RELEASE_TAG: rngstats-63bc072
  RNGSTAT_COMMIT: 63bc072d77773b5666a4e7e000e75c451d3da5b9
  LWIP_BUILD_COMMIT: 59e554ba1831f915c888cab23256d74a3dd7eb08
  LWIP_BUILD_RUN: '39160148013'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pinned RNGSTAT revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RNGSTAT_COMMIT }}

      - name: Download pinned lwIP build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact
          gh run download "$LWIP_BUILD_RUN" \
            --repo "${{ github.repository }}" \
            --name lwip-latest \
            --dir artifact

      - name: Assemble capture bundle
        run: |
          set -euo pipefail
          mkdir -p bundle
          cp artifact/lwip.8xv bundle/
          cp artifact/appinst/LWIP.0.8xv bundle/
          cp artifact/appinst/LWIP.1.8xv bundle/
          cp artifact/appinst/LWIP.2.8xv bundle/
          cp artifact/appinst/LWIP.3.8xv bundle/
          cp artifact/appinst/LWIP.4.8xv bundle/
          cp artifact/appinst/LWIP.5.8xv bundle/
          cp artifact/appinst/LWIP.6.8xv bundle/
          cp artifact/appinst/lwIPINST.8xp bundle/
          cp 'trng test/RNGSTAT.8xp' bundle/

          cat > bundle/BUILDINFO.json <<EOF
          {
            "bundle": "$RELEASE_TAG",
            "lwip_source_commit": "$LWIP_BUILD_COMMIT",
            "lwip_workflow_run": $LWIP_BUILD_RUN,
            "lwip_artifact": "lwip-latest",
            "rngstat_source_commit": "$RNGSTAT_COMMIT",
            "rngstat_repository_path": "trng test/RNGSTAT.8xp"
          }
          EOF

          (
            cd bundle
            sha256sum BUILDINFO.json LWIP.0.8xv LWIP.1.8xv LWIP.2.8xv \
              LWIP.3.8xv LWIP.4.8xv LWIP.5.8xv LWIP.6.8xv \
              RNGSTAT.8xp lwIPINST.8xp lwip.8xv > SHA256SUMS
            sha256sum --check SHA256SUMS
            zip -9 "../$RELEASE_TAG.zip" \
              BUILDINFO.json SHA256SUMS LWIP.0.8xv LWIP.1.8xv LWIP.2.8xv \
              LWIP.3.8xv LWIP.4.8xv LWIP.5.8xv LWIP.6.8xv \
              RNGSTAT.8xp lwIPINST.8xp lwip.8xv
          )
          sha256sum "$RELEASE_TAG.zip" > "$RELEASE_TAG.zip.sha256"
          unzip -t "$RELEASE_TAG.zip"

      - name: Publish immutable capture release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Pinned calculator payload for the CagsCalcLabs RNGStats capture workflow.

          - lwIP runtime source: \`$LWIP_BUILD_COMMIT\`
          - lwIP build workflow: https://github.com/${{ github.repository }}/actions/runs/$LWIP_BUILD_RUN
          - RNGSTAT source: \`$RNGSTAT_COMMIT\`

          \`SHA256SUMS\` covers every file inside the bundle. The separate
          \`$RELEASE_TAG.zip.sha256\` verifies the downloadable archive.
          EOF

          assets=(
            "$RELEASE_TAG.zip"
            "$RELEASE_TAG.zip.sha256"
            bundle/BUILDINFO.json
            bundle/SHA256SUMS
            bundle/lwip.8xv
            bundle/LWIP.0.8xv
            bundle/LWIP.1.8xv
            bundle/LWIP.2.8xv
            bundle/LWIP.3.8xv
            bundle/LWIP.4.8xv
            bundle/LWIP.5.8xv
            bundle/LWIP.6.8xv
            bundle/lwIPINST.8xp
            bundle/RNGSTAT.8xp
          )

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "${{ github.repository }}" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "RNGStats capture bundle ($RELEASE_TAG)" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "${{ github.repository }}" \
              --target "$RNGSTAT_COMMIT" \
              --title "RNGStats capture bundle ($RELEASE_TAG)" \
              --notes-file release-notes.md
          fi
