name: Tests

on:
  workflow_call:
    outputs:
      results:
        description: JSON object containing every test job result
        value: ${{ jobs.gate_results.outputs.results }}

permissions:
  contents: read
  actions: read
  security-events: write

env:
  CEDEV: ${{ github.workspace }}/CEdev
  CEDEV_BIN: ${{ github.workspace }}/CEdev/bin
  AUTOTESTER_ROM: ${{ github.workspace }}/${{ vars.AUTOTESTER_ROM }}
  LWIP_DYLIB_TESTS: ${{ github.workspace }}/tests/unit
  LWIP_TESTS_COMMON: ${{ github.workspace }}/tests/common

jobs:
  prepare_rom:
    name: Prepare encrypted CEmu ROM
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted ROM once
        env:
          ROM_NAME: ${{ vars.AUTOTESTER_ROM }}
        run: |
          curl --http1.1 -fsSL \
            --retry 5 --retry-all-errors --retry-delay 3 --retry-max-time 180 \
            --connect-timeout 20 -o "$RUNNER_TEMP/CE.rom.enc" \
            "https://cagscalclabs.net/restricted/$ROM_NAME.enc"

      - name: Share encrypted ROM with test jobs
        uses: actions/upload-artifact@v4
        with:
          name: cemu-rom-encrypted
          path: ${{ runner.temp }}/CE.rom.enc
          if-no-files-found: error
          retention-days: 1

  dylib_unit_tests:
    needs: prepare_rom
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Load pinned CI dependency versions
        id: ci_versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y make tar wget

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{github.workspace}}/CEdev
          key: ${{ runner.os }}-cedev-${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "github.com/CE-Programming/toolchain/releases/download/${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}/CEdev-Linux.tar.gz" | tar xz

      - name: Add CEdev to PATH
        run: |
          echo "${{github.workspace}}/CEdev/bin" >> $GITHUB_PATH
          echo $GITHUB_PATH

      - name: Download this run's lwip-latest artifact
        uses: actions/download-artifact@v4
        with:
          name: lwip-latest
          path: ${{ github.workspace }}/release

      - name: Verify build artifact contents
        run: |
          test -f "${{github.workspace}}/release/appinst/lwIPINST.8xp"
          test -n "$(find "${{github.workspace}}/release/appinst" -name 'LWIP.*.8xv' -print -quit)"
          ls -lh "${{github.workspace}}/release"

      - name: Install lwip.lib + headers into CEdev
        run: |
          mkdir -p "${{env.CEDEV}}/lib/libload" "${{env.CEDEV}}/include"
          cp "${{github.workspace}}/release/lwip.lib" "${{env.CEDEV}}/lib/libload/lwip.lib"
          cp "${{github.workspace}}/release/lwip.h" "${{env.CEDEV}}/include/lwip.h"
          cp -r "${{github.workspace}}/release/lwip" "${{env.CEDEV}}/include/lwip"
          test -f "${{env.CEDEV}}/lib/libload/lwip.lib"
          test -f "${{env.CEDEV}}/include/lwip.h"
          test -d "${{env.CEDEV}}/include/lwip"

      - name: Download encrypted CEmu ROM artifact
        uses: actions/download-artifact@v4
        with:
          name: cemu-rom-encrypted
          path: ${{ github.workspace }}

      - name: Decrypt CEmu ROM
        run: |
          gpg --batch --yes \
            --passphrase "${{ secrets.AES_ENCRYPT_KEY }}" \
            --output "${{ env.AUTOTESTER_ROM }}" \
            --decrypt "${{github.workspace}}/CE.rom.enc"

          shred -u "${{github.workspace}}/CE.rom.enc"

          if [ ! -f "${{ env.AUTOTESTER_ROM }}" ]; then
            echo "ERROR: ROM file not created"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "${{ env.AUTOTESTER_ROM }}" 2>/dev/null || stat -f%z "${{ env.AUTOTESTER_ROM }}")
          echo "Decrypted ROM size: ${FILE_SIZE} bytes"

      - name: Set up CEmu with emulated networking
        id: cemu
        uses: alessiodam/cemu-net-action@v1
        with:
          cemu-ref: ${{ steps.ci_versions.outputs.CEMU_REF }}

      - name: Install Autotester CLI
        run: |
          cmake -E copy "${{ steps.cemu.outputs.autotester }}" "${{env.CEDEV_BIN}}/cemu-autotester"
          strings "${{env.CEDEV_BIN}}/cemu-autotester" | grep -q "saveVar"

      - name: Prepare shared dyload test files
        run: |
          mkdir -p ${{env.LWIP_TESTS_COMMON}}
          cp "${{github.workspace}}/release/appinst/lwIPINST.8xp" ${{env.LWIP_TESTS_COMMON}}/
          cp "${{github.workspace}}/release/lwip.8xv" ${{env.LWIP_TESTS_COMMON}}/
          for appvar in "${{github.workspace}}"/release/appinst/LWIP.*.8xv; do
            cp "$appvar" "${{env.LWIP_TESTS_COMMON}}/"
          done
          curl -fL \
            -o ${{env.LWIP_TESTS_COMMON}}/lwIPCERT.8xv \
            https://github.com/${{ github.repository }}/releases/download/truststore-latest/lwIPCERT.8xv
          curl -fL \
            -o ${{env.LWIP_TESTS_COMMON}}/clibs.8xg \
            https://github.com/CE-Programming/libraries/releases/latest/download/clibs.8xg
          python3 tests/common/scripts/extract_ti_group_var.py \
            ${{env.LWIP_TESTS_COMMON}}/clibs.8xg \
            ${{env.LWIP_TESTS_COMMON}}/libload.8xv LibLoad
          python3 tests/common/scripts/extract_ti_group_var.py \
            ${{env.LWIP_TESTS_COMMON}}/clibs.8xg \
            ${{env.LWIP_TESTS_COMMON}}/fileioc.8xv FILEIOC
          python3 tests/common/scripts/extract_ti_group_var.py \
            ${{env.LWIP_TESTS_COMMON}}/clibs.8xg \
            ${{env.LWIP_TESTS_COMMON}}/usbdrvce.8xv USBDRVCE
          test -f ${{env.LWIP_TESTS_COMMON}}/clibs.8xg
          test -f ${{env.LWIP_TESTS_COMMON}}/libload.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/fileioc.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/usbdrvce.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/lwIPCERT.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/lwIPINST.8xp
          test -f ${{env.LWIP_TESTS_COMMON}}/lwip.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.0.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.1.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.2.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.3.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.4.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.5.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.6.8xv
          ls -lh ${{env.LWIP_TESTS_COMMON}}
          # The dylib spans as many LWIP.<n>.8xv appvars as it needs; make every
          # autotest.json transfer exactly the ones this build produced.
          python3 tests/common/scripts/sync_appvars.py

      - name: Run Dyload Unit Tests
        run: |
          total_tests=0
          total_passed=0
          total_failed=0
          total_timeout=0
          start_time=$(($(date +%s%N)/1000000))

          # A single hung cemu-autotester run has no other way to be noticed --
          # nothing elsewhere in this job times out, so a stall here would
          # otherwise block the whole job until GitHub's own ~6h ceiling.
          # TEST_TIMEOUT_SECONDS bounds one attempt; a hang is retried up to
          # TEST_MAX_ATTEMPTS times (CEmu/CI flakiness, not necessarily a real
          # bug -- see the Known CI flakiness note below) before giving up and
          # recording "timeout" rather than "failed", since a stall is not the
          # same signal as the autotester actually reporting a mismatch.
          TEST_TIMEOUT_SECONDS=120
          TEST_MAX_ATTEMPTS=3

          while IFS= read -r -d '' test; do
            status=0
            test_dir=$(dirname "$test")
            failed_hash_ids=""
            timed_out=0
            quirk_skipped=0
            test_start=$(($(date +%s%N)/1000000))
            make -C "$test_dir" clean
            make -C "$test_dir" || ((status=$?))
            if [ $status -eq 0 ]; then
              set +e
              for attempt in $(seq 1 "$TEST_MAX_ATTEMPTS"); do
                timeout "${TEST_TIMEOUT_SECONDS}s" \
                  make -C "$test_dir" test 2>&1 | tee "$test_dir/autotest.log"
                status=${PIPESTATUS[0]}
                if [ "$status" -eq 124 ]; then
                  echo "::warning::$(basename "$test_dir") timed out after ${TEST_TIMEOUT_SECONDS}s (attempt $attempt/$TEST_MAX_ATTEMPTS)"
                  timed_out=1
                  continue
                fi
                timed_out=0
                break
              done
              set -e
              if [ "$status" -ne 0 ] && [ "$timed_out" -eq 0 ]; then
                # Autotester reports each mismatched hash on its own line, e.g.:
                #   [Test failed!] Hash #1 ("...") did not match the expected CRC ...
                # Collect every failed hash id (a run can fail more than one).
                failed_hash_ids=$(grep -Eo 'Hash #[0-9]+' "$test_dir/autotest.log" | grep -Eo '[0-9]+' | sort -nu | paste -sd, - || true)

                # Emulator-quirk skip: some units require a physical TRNG that
                # CEmu does not have.  If this unit is in EMULATOR_QUIRK_UNITS,
                # only hash #1 failed, and its observed CRC is 468FCC4B (the
                # "RNG setup timed out" screen), downgrade to skipped+warning.
                unit_name=$(basename "$test_dir")
                if echo " $EMULATOR_QUIRK_UNITS " | grep -qw "$unit_name"; then
                  observed_crc=$(grep 'Hash #1 ' "$test_dir/autotest.log" | grep -Eo '\(got [0-9A-Fa-f]+\)' | grep -Eo '[0-9A-Fa-f]+' | head -1 || true)
                  if [ "$observed_crc" = "468FCC4B" ]; then
                    echo "::warning::$unit_name hash #1 observed CRC 468FCC4B (RNG setup timed out) — emulator has no physical TRNG; marking skipped"
                    status=0
                    quirk_skipped=1
                    failed_hash_ids=""
                  fi
                fi
              fi
            fi
            test_done=$(($(date +%s%N)/1000000))
            test_duration=$((test_done - test_start))
            (( total_tests += 1 ))
            if [ "$quirk_skipped" -eq 1 ]; then
              (( total_timeout += 1 ))
              test_status="skipped; emulator has no physical TRNG — test failed to run due to emulator non-randomness quirk"
            elif [ "$timed_out" -eq 1 ]; then
              (( total_timeout += 1 ))
              test_status="timeout; manual verification needed"
            elif [ $status -eq 0 ]; then
              (( total_passed += 1 ))
              test_status="passed"
            else
              (( total_failed += 1 ))
              test_status="failed"
            fi
            echo -e "{\"name\":\"$(basename "$test_dir")\",\"dir\":\"$test_dir\",\"status\":\"$test_status\",\"duration\":\"$test_duration\",\"failed_hash_ids\":\"$failed_hash_ids\"}" > "$test_dir/result.json"
          done < <(find ${{env.LWIP_DYLIB_TESTS}} -name autotest.json -print0)

          end_time=$(($(date +%s%N)/1000000))
          echo -e "\"summary\":{\"tests\":\"$total_tests\",\"passed\":\"$total_passed\",\"failed\":\"$total_failed\",\"pending\":\"0\",\"skipped\":\"$total_timeout\",\"other\":\"0\",\"start\":\"$start_time\",\"stop\":\"$end_time\"}" > ${{github.workspace}}/summary.json
          cmake -E echo "$total_tests dyload modules tested, $total_passed passed, $total_failed failed, $total_timeout timed out (skipped; manual verification needed)!"
          exit $total_failed

      - name: Generate Dyload JSON Results
        if: always()
        run: |
          echo -e "{\"results\":{" > ${{github.workspace}}/results-dylib.json
          cat ${{github.workspace}}/summary.json >> ${{github.workspace}}/results-dylib.json
          echo -e ",\"tests\":[" >> ${{github.workspace}}/results-dylib.json
          find ${{env.LWIP_DYLIB_TESTS}} -name result.json -print0 | {
            tmp_json=""
            while read -rd '' test; do
              test_dir=$(dirname "$test")
              tmp_json="$tmp_json,$(cat $test_dir/result.json)"
              rm $test_dir/result.json
            done
            tmp_json="${tmp_json:1}"
            echo $tmp_json >> ${{github.workspace}}/results-dylib.json
          }
          echo -e "]" >> ${{github.workspace}}/results-dylib.json
          echo -e "}}" >> ${{github.workspace}}/results-dylib.json
          rm ${{github.workspace}}/summary.json

      - name: Normalize unit-test rows
        if: always()
        run: |
          python3 .github/scripts/test_table.py unit \
            --results "${{ github.workspace }}/results-dylib.json" \
            --repo "${{ github.workspace }}" \
            --output "${{ github.workspace }}/test-rows-unit.json"

      - name: Upload unit-test rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-rows-unit
          path: |
            ${{ github.workspace }}/test-rows-unit.json
            ${{ github.workspace }}/results-dylib.json
          if-no-files-found: warn

      - name: Remove CEmu Rom
        if: always()
        run: shred -u "${{env.AUTOTESTER_ROM}}" 2>/dev/null || true

  rfc_compliance:
    name: RFC compliance
    if: github.ref != 'refs/heads/master'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Initialize RFC compliance report
        run: printf '## RFC compliance\n\nThe RFC review did not complete.\n' > "$RUNNER_TEMP/rfc-compliance.md"

      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch current master baseline
        run: git fetch --no-tags origin master

      - name: Review source changes for RFC regressions
        id: rfc_review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RFC_BASE_SHA: origin/master
          RFC_HEAD_SHA: ${{ github.sha }}
          RFC_REVIEW_MODEL: deepseek/deepseek-v4.1-flash
          RFC_VERIFY_MODEL: ${{ vars.RFC_VERIFY_MODEL || 'gpt-6-astra' }}
          RFC_VERIFY_CYBER_PROGRAM: standard
          RFC_REVIEW_REPORT: ${{ runner.temp }}/rfc-compliance.md
        run: python3 .github/scripts/rfc_review.py

      - name: Normalize RFC row
        if: always()
        run: |
          python3 .github/scripts/test_table.py row \
            --module RFC --test "Compliance review" \
            --grade "${{ steps.rfc_review.outcome }}" \
            --output test-rows-rfc.json

      - name: Upload RFC row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-rows-rfc
          path: test-rows-rfc.json
          if-no-files-found: warn

      - name: Upload RFC compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfc-compliance-report
          path: ${{ runner.temp }}/rfc-compliance.md
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  acvp:
    needs: prepare_rom
    name: ACVP JSON over CEmu RPC
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install host reference dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-cryptography

      - name: Generate 416-vector differential corpus
        run: python3 tests/validation/acvp/generate_vectors.py

      - name: Check host ACVP parsing
        run: python3 tests/validation/acvp/selftest.py

      - id: env
        uses: ./.github/actions/emulator-env
        with:
          rom-key: ${{ secrets.AES_ENCRYPT_KEY }}

      - name: Build ACVP calculator service
        run: make -C tests/validation/acvp

      - name: Process ACVP fixture through CEmu
        id: run_acvp
        run: |
          sudo --preserve-env=AUTOTESTER_ROM python3 tests/validation/acvp/run.py \
            --autotester "${{ steps.env.outputs.autotester }}" \
            --usb "${{ steps.env.outputs.usb-step }}" \
            --timeout-ms 60000000

      - name: Build ACVP results
        if: always()
        run: |
          python3 tests/validation/acvp/summary.py \
            --run-outcome "${{ steps.run_acvp.outcome }}"

      - name: Normalize ACVP rows
        if: always()
        run: |
          python3 .github/scripts/test_table.py acvp \
            --results tests/validation/acvp/results.json \
            --output test-rows-acvp.json

      - name: Upload ACVP rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-rows-acvp
          path: test-rows-acvp.json
          if-no-files-found: warn

      - name: Remove CEmu ROM
        if: always()
        run: shred -u "$AUTOTESTER_ROM" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acvp-validation
          path: |
            tests/validation/acvp/artifacts/acvp-validation.vectors
            tests/validation/acvp/summary.md
            tests/validation/acvp/results.json
            tests/validation/acvp/NETLOG.8xv
            tests/validation/acvp/autotest.json
          if-no-files-found: ignore

  semgrep_scan:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build SAST target list
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add source https://github.com/lwip-tcpip/lwip.git || true
          git fetch --no-tags source master

          BASE="$(git merge-base HEAD FETCH_HEAD || true)"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          git diff --numstat --diff-filter=ACMR "$BASE" HEAD -- src \
            | awk '($1 != "0" || $2 != "0") {print $3}' \
            | grep -E '\.(c|h)$' \
            | sort -u > semgrep-targets.txt || true

          echo "SAST baseline: $BASE"
          echo "SAST targets:"
          cat semgrep-targets.txt

      # Scan files that are new or changed relative to upstream lwIP.
      - id: semgrep
        run: |
          if [ -s semgrep-targets.txt ]; then
            set --
            while IFS= read -r target; do
              set -- "$@" --include "$target"
            done < semgrep-targets.txt
            semgrep ci --sarif "$@" > semgrep.sarif
          else
            printf '{"version":"2.1.0","runs":[]}\n' > semgrep.sarif
          fi
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()

      - name: Normalize SAST row
        if: always()
        run: |
          python3 .github/scripts/test_table.py row \
            --module SAST --test Semgrep --grade "${{ steps.semgrep.outcome }}" \
            --output test-rows-sast.json

      - name: Upload SAST row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-rows-sast
          path: test-rows-sast.json
          if-no-files-found: warn

  analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lwIP-CE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Load pinned CI dependency versions
        id: ci_versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Compute upstream-unchanged paths to ignore
        id: ignore
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add upstream-lwip https://github.com/lwip-tcpip/lwip.git || true
          git fetch --no-tags upstream-lwip master

          BASE="$(git merge-base HEAD FETCH_HEAD || true)"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          echo "CodeQL exclusion baseline: $BASE"

          # Files genuinely touched since the upstream merge-base (content
          # changes only -- numstat's own 0/0 filter drops mode-only diffs
          # like an executable-bit flip with no byte change).
          git diff --numstat --diff-filter=ACMR "$BASE" HEAD -- src \
            | awk '($1 != "0" || $2 != "0") {print $3}' \
            | grep -E '\.(c|h)$' \
            | sort -u > /tmp/changed_files.txt || true

          find src -type f \( -iname '*.c' -o -iname '*.h' \) \
            | sed 's|^\./||' | sort -u > /tmp/all_src_files.txt

          comm -23 /tmp/all_src_files.txt /tmp/changed_files.txt > /tmp/unchanged_files.txt

          echo "Excluding $(wc -l < /tmp/unchanged_files.txt) byte-identical-to-upstream files from CodeQL."

          {
            echo "name: \"lwIP-CE CodeQL config (generated)\""
            echo "paths-ignore:"
            while IFS= read -r f; do
              [ -n "$f" ] && echo "  - \"$f\""
            done < /tmp/unchanged_files.txt
          } > "$GITHUB_WORKSPACE/codeql-config.generated.yml"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          config-file: ${{ github.workspace }}/codeql-config.generated.yml

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make tar curl unzip libxml2-utils unifdef python3 python3-clang libclang-dev

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/CEdev
          key: ${{ runner.os }}-cedev-${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "github.com/CE-Programming/toolchain/releases/download/${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}/CEdev-Linux.tar.gz" | tar xz

      - name: Add CEdev to PATH
        run: |
          echo "${{ github.workspace }}/CEdev/bin" >> "$GITHUB_PATH"

      - name: Checkout fixed convbin branch
        uses: actions/checkout@v4
        with:
          repository: mateoconlechuga/convbin
          ref: R_Z80_BYTE012
          path: ${{ github.workspace }}/convbin
          submodules: recursive
          persist-credentials: false

      - name: Build fixed convbin from source
        run: |
          make -C "${{ github.workspace }}/convbin" -j"$(nproc)"
          cmake -E copy "${{ github.workspace }}/convbin/bin/convbin" "${{ env.CEDEV_BIN }}/convbin"
          "${{ env.CEDEV_BIN }}/convbin" --version || true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install ce-libify
        run: |
          git clone --depth 1 --branch "${{ steps.ci_versions.outputs.CE_LIBIFY_REF }}" https://github.com/alessiodam/toolchain_libify.git "${{ runner.temp }}/ce-libify"
          GOCACHE="${{ runner.temp }}/go-cache" go test -C "${{ runner.temp }}/ce-libify" ./...
          make -C "${{ runner.temp }}/ce-libify" install CEDEV="${{ env.CEDEV }}" PYTHON=python3
          ce-libify --version

      - name: make dylib (traced by CodeQL)
        run: make dylib

      - name: Perform CodeQL Analysis
        id: codeql
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"

      - name: Normalize CodeQL row
        if: always()
        run: |
          python3 .github/scripts/test_table.py row \
            --module SAST --test CodeQL --grade "${{ steps.codeql.outcome }}" \
            --output test-rows-codeql.json

      - name: Upload CodeQL row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-rows-codeql
          path: test-rows-codeql.json
          if-no-files-found: warn

  nettest:
    needs: prepare_rom
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [sockets, raw, tls, records, server, perf, timeouts]
    steps:
      - uses: actions/checkout@v4

      - id: env
        uses: ./.github/actions/emulator-env
        with:
          rom-key: ${{ secrets.AES_ENCRYPT_KEY }}

      - name: Install scapy
        run: sudo pip install --break-system-packages scapy

      - name: Test host endpoint corroboration
        if: matrix.suite == 'tls'
        run: python3 tests/net/test_host_corroboration.py

      - name: Build ${{ matrix.suite }}
        run: make -C tests/net ${{ matrix.suite }}

      - name: Run ${{ matrix.suite }}
        run: |
          suite_start=$(($(date +%s%N)/1000000))
          sudo --preserve-env=AUTOTESTER_ROM python3 tests/net/run.py \
            --suite ${{ matrix.suite }} --pcap tests/net/${{ matrix.suite }}.pcap \
            --rows tests/net/test-rows-${{ matrix.suite }}.json \
            --autotester "${{ steps.env.outputs.autotester }}" --usb "${{ steps.env.outputs.usb-step }}"
          # run.py runs under sudo, so the files it writes come out root-owned.
          # Hand them back before the row post-processing below rewrites them.
          sudo chown "$(id -un)" \
            "tests/net/test-rows-${{ matrix.suite }}.json" \
            tests/net/metrics.json 2>/dev/null || true
          python3 - <<PY
          import json, os
          p = "tests/net/test-rows-${{ matrix.suite }}.json"
          rows = json.load(open(p))
          # Per-test timings already arrive from run.py (METRIC ... ms lines,
          # attached to the row they belong to). Add only the heap figures the
          # calc reported; a suite-wide wall time says nothing about a test.
          heap = []
          if os.path.exists("tests/net/metrics.json"):
              metrics = json.load(open("tests/net/metrics.json"))
              peak = [v["value"] for k, v in metrics.items()
                      if k.endswith("_heap_peak") and isinstance(v, dict)]
              if peak:
                  heap.append(f"heap peak {max(peak)} B")
              idle = metrics.get("heap_idle", {}).get("value")
              if idle is not None:
                  heap.append(f"heap idle {idle} B")
          extra = "; ".join(heap)
          if extra:
              for r in rows:
                  r["stats"] = "; ".join(x for x in (r.get("stats", ""), extra) if x)
          json.dump(rows, open(p, "w"), indent=2)
          PY

      - name: Remove CEmu Rom
        if: always()
        run: shred -u "$AUTOTESTER_ROM" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-rows-net-${{ matrix.suite }}
          path: |
            tests/net/test-rows-${{ matrix.suite }}.json
            tests/net/NETLOG-*.8xv
            tests/net/metrics.json
            tests/net/endpoint-probes.json
            tests/net/*.pcap
            tests/net/autotest-*.json
          if-no-files-found: ignore

  dast:
    needs: prepare_rom
    name: DAST (live, emulated)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check calc-side test list matches the manifest
        run: |
          python3 build-tools/dast/lwip-dast.py --gen-header
          git diff --exit-code tests/profiling/lwip_dast/src/dast_tests.h

      - id: env
        uses: ./.github/actions/emulator-env
        with:
          rom-key: ${{ secrets.AES_ENCRYPT_KEY }}

      - name: Install scapy
        run: sudo pip install --break-system-packages scapy

      - name: Build LWDAST
        run: make -C tests/profiling/lwip_dast RELEASE_ROOT="${{ github.workspace }}/release"

      - name: Run DAST probes
        run: |
          sudo --preserve-env=AUTOTESTER_ROM python3 tests/profiling/lwip_dast/ci.py \
            --autotester "${{ steps.env.outputs.autotester }}" --usb "${{ steps.env.outputs.usb-step }}"

      - name: Render report and gate on failures
        run: python3 build-tools/dast/dast_report.py

      - name: Normalize DAST rows
        if: always()
        run: |
          python3 .github/scripts/test_table.py dast \
            --results tests/dast.json --output test-rows-dast.json

      - name: Upload DAST rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-rows-dast
          path: test-rows-dast.json
          if-no-files-found: warn

      - name: Remove CEmu Rom
        if: always()
        run: shred -u "$AUTOTESTER_ROM" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-live
          path: |
            tests/dast.json
            tests/profiling/lwip_dast/autotester.log
          if-no-files-found: ignore

  bench:
    name: Algorithm benchmark
    needs: prepare_rom
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Load pinned CI dependency versions
        id: ci_versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make tar wget

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/CEdev
          key: ${{ runner.os }}-cedev-${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "github.com/CE-Programming/toolchain/releases/download/${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}/CEdev-Linux.tar.gz" | tar xz

      - name: Add CEdev to PATH
        run: echo "${{ github.workspace }}/CEdev/bin" >> $GITHUB_PATH

      - name: Download this run's lwip-latest artifact
        uses: actions/download-artifact@v4
        with:
          name: lwip-latest
          path: ${{ github.workspace }}/release

      - name: Install lwip.lib + headers into CEdev
        run: |
          mkdir -p "${{ env.CEDEV }}/lib/libload" "${{ env.CEDEV }}/include"
          cp "${{ github.workspace }}/release/lwip.lib" "${{ env.CEDEV }}/lib/libload/lwip.lib"
          cp "${{ github.workspace }}/release/lwip.h" "${{ env.CEDEV }}/include/lwip.h"
          cp -r "${{ github.workspace }}/release/lwip" "${{ env.CEDEV }}/include/lwip"

      - name: Download encrypted CEmu ROM artifact
        uses: actions/download-artifact@v4
        with:
          name: cemu-rom-encrypted
          path: ${{ github.workspace }}

      - name: Decrypt CEmu ROM
        run: |
          gpg --batch --yes \
            --passphrase "${{ secrets.AES_ENCRYPT_KEY }}" \
            --output "${{ env.AUTOTESTER_ROM }}" \
            --decrypt "${{ github.workspace }}/CE.rom.enc"
          shred -u "${{ github.workspace }}/CE.rom.enc"

      - name: Set up CEmu with emulated networking
        id: cemu
        uses: alessiodam/cemu-net-action@v1
        with:
          cemu-ref: ${{ steps.ci_versions.outputs.CEMU_REF }}

      - name: Install Autotester CLI
        run: cmake -E copy "${{ steps.cemu.outputs.autotester }}" "${{ env.CEDEV_BIN }}/cemu-autotester"

      - name: Prepare shared dyload files
        run: |
          mkdir -p ${{ env.LWIP_TESTS_COMMON }}
          cp "${{ github.workspace }}/release/appinst/lwIPINST.8xp" ${{ env.LWIP_TESTS_COMMON }}/
          cp "${{ github.workspace }}/release/lwip.8xv" ${{ env.LWIP_TESTS_COMMON }}/
          for appvar in "${{ github.workspace }}"/release/appinst/LWIP.*.8xv; do
            cp "$appvar" "${{ env.LWIP_TESTS_COMMON }}/"
          done
          curl -fL \
            -o ${{ env.LWIP_TESTS_COMMON }}/clibs.8xg \
            https://github.com/CE-Programming/libraries/releases/latest/download/clibs.8xg
          python3 tests/common/scripts/sync_appvars.py

      - name: Build primitives benchmark
        run: make -C tests/profiling/primitives_bench

      - name: Run primitives benchmark
        working-directory: tests/profiling/primitives_bench
        run: |
          timeout 900s cemu-autotester \
            "${{ github.workspace }}/tests/profiling/primitives_bench/autotest.json" \
            2>&1 | tee autotest.log || true

      - name: Extract and print benchmark results
        working-directory: tests/profiling/primitives_bench
        run: |
          bench_var=TLSBENCH.8xv
          if [ ! -f "$bench_var" ]; then
            echo "::error::TLSBENCH appvar not found; benchmark did not complete"
            exit 1
          fi
          convbin -i "$bench_var" -o TLSBENCH.bin -j 8x -k bin
          python3 - <<'PY'
          import re, sys
          TICKS_PER_SEC = 32768.0
          raw = open('TLSBENCH.bin', 'rb').read().replace(b'\x00', b'').decode('utf-8', errors='replace')
          in_results = False
          rows = []
          for line in raw.splitlines():
              line = line.strip()
              if line == 'marker_start':
                  in_results = True
                  continue
              if line == 'marker_done':
                  break
              if not in_results or not line:
                  continue
              parts = line.split(',')
              if len(parts) != 3:
                  continue
              name, ticks_s, units_s = parts
              try:
                  ticks = int(ticks_s)
                  units = int(units_s)
              except ValueError:
                  continue
              if name.startswith(('probe_', 'sink')):
                  continue
              secs = ticks / TICKS_PER_SEC
              if units > 1:
                  per = secs / units * 1000
                  rows.append((name, f'{secs*1000:.1f} ms total, {per:.3f} ms/unit, {units} units'))
              else:
                  rows.append((name, f'{secs*1000:.1f} ms'))
          import os
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY', '')
          if not rows:
              print('No benchmark rows parsed.')
              if summary_path:
                  with open(summary_path, 'a') as f:
                      f.write('## Algorithm Benchmark\n\nNo results parsed.\n')
              sys.exit(0)
          col = max(len(r[0]) for r in rows)
          print(f"{'Algorithm':<{col}}  Elapsed")
          print('-' * (col + 30))
          for name, val in rows:
              print(f'{name:<{col}}  {val}')
          if summary_path:
              with open(summary_path, 'a') as f:
                  f.write('## Algorithm Benchmark\n\n')
                  f.write('| Algorithm | Elapsed |\n')
                  f.write('|-----------|----------|\n')
                  for name, val in rows:
                      f.write(f'| `{name}` | {val} |\n')
                  f.write('\n')
          PY

      - name: Remove CEmu Rom
        if: always()
        run: shred -u "$AUTOTESTER_ROM" 2>/dev/null || true

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-primitives
          path: |
            tests/profiling/primitives_bench/TLSBENCH.8xv
            tests/profiling/primitives_bench/autotest.log
            tests/profiling/primitives_bench/autotest.json
          if-no-files-found: ignore

  host_tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run host tests
        run: |
          overall=0
          rows='[]'
          for test in tests/host/*/run.py tests/host/*/test_*.py; do
            echo "::group::$test"
            test_status=0
            test_start=$(($(date +%s%N)/1000000))
            python3 "$test" || test_status=$?
            test_ms=$(($(($(date +%s%N)/1000000)) - test_start))
            if [ "$test_status" -eq 0 ]; then
              result=success
            else
              result=failure
              overall=1
              echo "::error file=$test::$test failed"
            fi
            module=$(basename "$(dirname "$test")" | tr '[:lower:]_' '[:upper:] ')
            name=$(basename "$test" .py | tr '_' ' ')
            rows=$(jq -c --arg module "$module" --arg test "$name" --arg grade "$result" \
              --arg stats "${test_ms} ms" \
              '. + [{group:"HOST",module:$module,test:$test,grade:$grade,stats:$stats}]' <<< "$rows")
            echo "::endgroup::"
          done
          echo "$rows" > test-rows-host.json
          exit "$overall"

      - name: Upload host-test rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-rows-host
          path: test-rows-host.json
          if-no-files-found: warn

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [json, xml, url, base64, asn1, pcap, x509, ws, tls]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Restore corpus
        uses: actions/cache@v5
        with:
          path: tests/fuzz/out/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        id: fuzz_target
        run: make -C tests/fuzz run-${{ matrix.target }} FUZZ_SECONDS=300

      - name: Normalize fuzz row
        if: always()
        run: |
          python3 .github/scripts/test_table.py row \
            --module FUZZ --test "${{ matrix.target }}" \
            --grade "${{ steps.fuzz_target.outcome }}" \
            --output test-rows-fuzz-${{ matrix.target }}.json

      - name: Upload fuzz row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-rows-fuzz-${{ matrix.target }}
          path: test-rows-fuzz-${{ matrix.target }}.json
          if-no-files-found: warn

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: tests/fuzz/out/artifacts/
          if-no-files-found: ignore

  cleanup_rom:
    name: Delete encrypted CEmu ROM artifact
    needs: [prepare_rom, dylib_unit_tests, acvp, nettest, dast, bench]
    if: always()
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary ROM artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "cemu-rom-encrypted") | .id' | head -1)
          if [ -z "$artifact_id" ]; then
            echo "No encrypted ROM artifact was created."
            exit 0
          fi
          gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
          echo "Deleted encrypted ROM artifact $artifact_id."

  gate_results:
    name: Collect test results
    needs: [prepare_rom, dylib_unit_tests, rfc_compliance, acvp, semgrep_scan, analyze, nettest, dast, bench, host_tests, fuzz, cleanup_rom]
    if: always()
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    outputs:
      results: ${{ steps.collect.outputs.results }}
    steps:
      - name: Check out summary renderer
        uses: actions/checkout@v4

      - name: Download normalized test rows
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: test-rows-*
          path: ${{ runner.temp }}/test-rows
          merge-multiple: true

      - name: Collect result states
        id: collect
        env:
          ROM_RESULT: ${{ needs.prepare_rom.result }}
          ROM_CLEANUP_RESULT: ${{ needs.cleanup_rom.result }}
          UNIT_RESULT: ${{ needs.dylib_unit_tests.result }}
          RFC_RESULT: ${{ needs.rfc_compliance.result }}
          ACVP_RESULT: ${{ needs.acvp.result }}
          SAST_RESULT: ${{ needs.semgrep_scan.result }}
          CODEQL_RESULT: ${{ needs.analyze.result }}
          NETWORK_RESULT: ${{ needs.nettest.result }}
          DAST_RESULT: ${{ needs.dast.result }}
          BENCH_RESULT: ${{ needs.bench.result }}
          HOST_RESULT: ${{ needs.host_tests.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          results=$(jq -nc \
            --arg rom_setup "$ROM_RESULT" \
            --arg rom_cleanup "$ROM_CLEANUP_RESULT" \
            --arg unit "$UNIT_RESULT" \
            --arg rfc "$RFC_RESULT" \
            --arg acvp "$ACVP_RESULT" \
            --arg sast "$SAST_RESULT" \
            --arg codeql "$CODEQL_RESULT" \
            --arg network "$NETWORK_RESULT" \
            --arg dast "$DAST_RESULT" \
            --arg bench "$BENCH_RESULT" \
            --arg host "$HOST_RESULT" \
            --arg fuzz "$FUZZ_RESULT" \
            '{rom_setup:$rom_setup, rom_cleanup:$rom_cleanup, unit:$unit,
              rfc:$rfc, acvp:$acvp, sast:$sast, codeql:$codeql,
              network:$network, dast:$dast, bench:$bench, host:$host, fuzz:$fuzz}')
          echo "results=$results" >> "$GITHUB_OUTPUT"

      - name: Render consolidated test table
        env:
          ROM_RESULT: ${{ needs.prepare_rom.result }}
          ROM_CLEANUP_RESULT: ${{ needs.cleanup_rom.result }}
          UNIT_RESULT: ${{ needs.dylib_unit_tests.result }}
          RFC_RESULT: ${{ needs.rfc_compliance.result }}
          ACVP_RESULT: ${{ needs.acvp.result }}
          SAST_RESULT: ${{ needs.semgrep_scan.result }}
          CODEQL_RESULT: ${{ needs.analyze.result }}
          NETWORK_RESULT: ${{ needs.nettest.result }}
          DAST_RESULT: ${{ needs.dast.result }}
          BENCH_RESULT: ${{ needs.bench.result }}
          HOST_RESULT: ${{ needs.host_tests.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          python3 .github/scripts/test_table.py render \
            --input "${{ runner.temp }}/test-rows" \
            --output "$RUNNER_TEMP/test-results.md" \
            --fallback "PREREQUISITE|ROM setup|$ROM_RESULT" \
            --fallback "PREREQUISITE|ROM cleanup|$ROM_CLEANUP_RESULT" \
            --fallback "UNIT|Suite execution|$UNIT_RESULT" \
            --fallback "RFC|Compliance review|$RFC_RESULT" \
            --fallback "ACVP|Suite execution|$ACVP_RESULT" \
            --fallback "SAST|Semgrep|$SAST_RESULT" \
            --fallback "SAST|CodeQL|$CODEQL_RESULT" \
            --fallback "NETTEST|All network suites|$NETWORK_RESULT" \
            --fallback "DAST|Suite execution|$DAST_RESULT" \
            --fallback "BENCH|Algorithm benchmark|$BENCH_RESULT" \
            --fallback "HOST|Suite execution|$HOST_RESULT" \
            --fallback "FUZZ|All targets|$FUZZ_RESULT"
          cat "$RUNNER_TEMP/test-results.md" >> "$GITHUB_STEP_SUMMARY"

