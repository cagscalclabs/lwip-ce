name: Unit Tests

# Dyload-based functional correctness for lwIP-CE unit modules under
# tests/unit/. These tests link against the curated, manifest-gated
# lwip.lib produced by build.yml -- the same artifact a real consumer app
# would dyload. This catches curation drops / ABI mismatches / missing
# manifest entries that a white-box build can't see. Dispatched explicitly
# by build.yml only when a new artifact was successfully uploaded.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  AUTOTESTER_ROM: ${{ github.workspace }}/${{ vars.AUTOTESTER_ROM }}
  LWIP_DYLIB_TESTS: ${{github.workspace}}/tests/unit
  LWIP_TESTS_COMMON: ${{github.workspace}}/tests/common
  CEDEV: ${{github.workspace}}/CEdev
  CEDEV_BIN: ${{github.workspace}}/CEdev/bin
  # Units whose first post-install hash may show 468FCC4B ("RNG setup timed
  # out") on CEmu because CEmu has no physical TRNG.  A failure on hash #1
  # with that exact CRC is downgraded to a skip+warning instead of a hard
  # failure so CI is not broken by an emulator quirk.
  # EMULATOR_QUIRK_UNITS:

jobs:
  dylib_unit_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Load pinned CI dependency versions
        id: ci_versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y make tar wget

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{github.workspace}}/CEdev
          key: ${{ runner.os }}-cedev-${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "github.com/CE-Programming/toolchain/releases/download/${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}/CEdev-Linux.tar.gz" | tar xz

      - name: Add CEdev to PATH
        run: |
          echo "${{github.workspace}}/CEdev/bin" >> $GITHUB_PATH
          echo $GITHUB_PATH

      - name: Download lwip-latest artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${{github.workspace}}/release"
          run_id=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name == "lwip-latest" and .expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No lwip-latest artifact found in this repo. Run build.yml first."
            exit 1
          fi
          echo "Downloading lwip-latest from run $run_id"
          gh run download "$run_id" --repo "${{ github.repository }}" --name lwip-latest --dir "${{github.workspace}}/release"

      - name: Verify build artifact contents
        run: |
          test -f "${{github.workspace}}/release/appinst/lwIPINST.8xp"
          test -n "$(find "${{github.workspace}}/release/appinst" -name 'LWIP.*.8xv' -print -quit)"
          ls -lh "${{github.workspace}}/release"

      - name: Install lwip.lib + headers into CEdev
        run: |
          mkdir -p "${{env.CEDEV}}/lib/libload" "${{env.CEDEV}}/include"
          cp "${{github.workspace}}/release/lwip.lib" "${{env.CEDEV}}/lib/libload/lwip.lib"
          cp "${{github.workspace}}/release/lwip.h" "${{env.CEDEV}}/include/lwip.h"
          cp -r "${{github.workspace}}/release/lwip" "${{env.CEDEV}}/include/lwip"
          test -f "${{env.CEDEV}}/lib/libload/lwip.lib"
          test -f "${{env.CEDEV}}/include/lwip.h"
          test -d "${{env.CEDEV}}/include/lwip"

      - name: Download CEmu Rom
        run: |
          curl -fSL \
            --retry 3 \
            --retry-delay 2 \
            -o "${{github.workspace}}/CE.rom.enc" \
            https://cagscalclabs.net/restricted/${{ vars.AUTOTESTER_ROM }}.enc

          gpg --batch --yes \
            --passphrase "${{ secrets.AES_ENCRYPT_KEY }}" \
            --output "${{ env.AUTOTESTER_ROM }}" \
            --decrypt "${{github.workspace}}/CE.rom.enc"

          shred -u "${{github.workspace}}/CE.rom.enc"

          if [ ! -f "${{ env.AUTOTESTER_ROM }}" ]; then
            echo "ERROR: ROM file not created"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "${{ env.AUTOTESTER_ROM }}" 2>/dev/null || stat -f%z "${{ env.AUTOTESTER_ROM }}")
          echo "Decrypted ROM size: ${FILE_SIZE} bytes"

      - name: Set up CEmu with emulated networking
        id: cemu
        uses: alessiodam/cemu-net-action@v1
        with:
          cemu-ref: ${{ steps.ci_versions.outputs.CEMU_REF }}

      - name: Install Autotester CLI
        run: |
          cmake -E copy "${{ steps.cemu.outputs.autotester }}" "${{env.CEDEV_BIN}}/cemu-autotester"
          strings "${{env.CEDEV_BIN}}/cemu-autotester" | grep -q "saveVar"

      - name: Prepare shared dyload test files
        run: |
          mkdir -p ${{env.LWIP_TESTS_COMMON}}
          cp "${{github.workspace}}/release/appinst/lwIPINST.8xp" ${{env.LWIP_TESTS_COMMON}}/
          cp "${{github.workspace}}/release/lwip.8xv" ${{env.LWIP_TESTS_COMMON}}/
          for appvar in "${{github.workspace}}"/release/appinst/LWIP.*.8xv; do
            cp "$appvar" "${{env.LWIP_TESTS_COMMON}}/"
          done
          curl -fL \
            -o ${{env.LWIP_TESTS_COMMON}}/lwIPCERT.8xv \
            https://github.com/${{ github.repository }}/releases/download/truststore-latest/lwIPCERT.8xv
          curl -fL \
            -o ${{env.LWIP_TESTS_COMMON}}/clibs.8xg \
            https://github.com/CE-Programming/libraries/releases/latest/download/clibs.8xg
          test -f ${{env.LWIP_TESTS_COMMON}}/clibs.8xg
          test -f ${{env.LWIP_TESTS_COMMON}}/lwIPCERT.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/lwIPINST.8xp
          test -f ${{env.LWIP_TESTS_COMMON}}/lwip.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.0.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.1.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.2.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.3.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.4.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.5.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.6.8xv
          ls -lh ${{env.LWIP_TESTS_COMMON}}

      - name: Run Dyload Unit Tests
        run: |
          total_tests=0
          total_passed=0
          total_failed=0
          total_timeout=0
          start_time=$(($(date +%s%N)/1000000))

          # A single hung cemu-autotester run has no other way to be noticed --
          # nothing elsewhere in this job times out, so a stall here would
          # otherwise block the whole job until GitHub's own ~6h ceiling.
          # TEST_TIMEOUT_SECONDS bounds one attempt; a hang is retried up to
          # TEST_MAX_ATTEMPTS times (CEmu/CI flakiness, not necessarily a real
          # bug -- see the Known CI flakiness note below) before giving up and
          # recording "timeout" rather than "failed", since a stall is not the
          # same signal as the autotester actually reporting a mismatch.
          TEST_TIMEOUT_SECONDS=120
          TEST_MAX_ATTEMPTS=3

          while IFS= read -r -d '' test; do
            status=0
            test_dir=$(dirname "$test")
            failed_hash_ids=""
            timed_out=0
            quirk_skipped=0
            test_start=$(($(date +%s%N)/1000000))
            make -C "$test_dir" clean
            make -C "$test_dir" || ((status=$?))
            if [ $status -eq 0 ]; then
              set +e
              for attempt in $(seq 1 "$TEST_MAX_ATTEMPTS"); do
                timeout "${TEST_TIMEOUT_SECONDS}s" \
                  make -C "$test_dir" test 2>&1 | tee "$test_dir/autotest.log"
                status=${PIPESTATUS[0]}
                if [ "$status" -eq 124 ]; then
                  echo "::warning::$(basename "$test_dir") timed out after ${TEST_TIMEOUT_SECONDS}s (attempt $attempt/$TEST_MAX_ATTEMPTS)"
                  timed_out=1
                  continue
                fi
                timed_out=0
                break
              done
              set -e
              if [ "$status" -ne 0 ] && [ "$timed_out" -eq 0 ]; then
                # Autotester reports each mismatched hash on its own line, e.g.:
                #   [Test failed!] Hash #1 ("...") did not match the expected CRC ...
                # Collect every failed hash id (a run can fail more than one).
                failed_hash_ids=$(grep -Eo 'Hash #[0-9]+' "$test_dir/autotest.log" | grep -Eo '[0-9]+' | sort -nu | paste -sd, - || true)

                # Emulator-quirk skip: some units require a physical TRNG that
                # CEmu does not have.  If this unit is in EMULATOR_QUIRK_UNITS,
                # only hash #1 failed, and its observed CRC is 468FCC4B (the
                # "RNG setup timed out" screen), downgrade to skipped+warning.
                unit_name=$(basename "$test_dir")
                if echo " $EMULATOR_QUIRK_UNITS " | grep -qw "$unit_name"; then
                  observed_crc=$(grep 'Hash #1 ' "$test_dir/autotest.log" | grep -Eo '\(got [0-9A-Fa-f]+\)' | grep -Eo '[0-9A-Fa-f]+' | head -1 || true)
                  if [ "$observed_crc" = "468FCC4B" ]; then
                    echo "::warning::$unit_name hash #1 observed CRC 468FCC4B (RNG setup timed out) — emulator has no physical TRNG; marking skipped"
                    status=0
                    quirk_skipped=1
                    failed_hash_ids=""
                  fi
                fi
              fi
            fi
            test_done=$(($(date +%s%N)/1000000))
            test_duration=$((test_done - test_start))
            (( total_tests += 1 ))
            if [ "$quirk_skipped" -eq 1 ]; then
              (( total_timeout += 1 ))
              test_status="skipped; emulator has no physical TRNG — test failed to run due to emulator non-randomness quirk"
            elif [ "$timed_out" -eq 1 ]; then
              (( total_timeout += 1 ))
              test_status="timeout; manual verification needed"
            elif [ $status -eq 0 ]; then
              (( total_passed += 1 ))
              test_status="passed"
            else
              (( total_failed += 1 ))
              test_status="failed"
            fi
            echo -e "{\"name\":\"$(basename "$test_dir")\",\"dir\":\"$test_dir\",\"status\":\"$test_status\",\"duration\":\"$test_duration\",\"failed_hash_ids\":\"$failed_hash_ids\"}" > "$test_dir/result.json"
          done < <(find ${{env.LWIP_DYLIB_TESTS}} -name autotest.json -print0)

          end_time=$(($(date +%s%N)/1000000))
          echo -e "\"summary\":{\"tests\":\"$total_tests\",\"passed\":\"$total_passed\",\"failed\":\"$total_failed\",\"pending\":\"0\",\"skipped\":\"$total_timeout\",\"other\":\"0\",\"start\":\"$start_time\",\"stop\":\"$end_time\"}" > ${{github.workspace}}/summary.json
          cmake -E echo "$total_tests dyload modules tested, $total_passed passed, $total_failed failed, $total_timeout timed out (skipped; manual verification needed)!"
          exit $total_failed

      - name: Generate Dyload JSON Results
        if: always()
        run: |
          echo -e "{\"results\":{" > ${{github.workspace}}/results-dylib.json
          cat ${{github.workspace}}/summary.json >> ${{github.workspace}}/results-dylib.json
          echo -e ",\"tests\":[" >> ${{github.workspace}}/results-dylib.json
          find ${{env.LWIP_DYLIB_TESTS}} -name result.json -print0 | {
            tmp_json=""
            while read -rd '' test; do
              test_dir=$(dirname "$test")
              tmp_json="$tmp_json,$(cat $test_dir/result.json)"
              rm $test_dir/result.json
            done
            tmp_json="${tmp_json:1}"
            echo $tmp_json >> ${{github.workspace}}/results-dylib.json
          }
          echo -e "]" >> ${{github.workspace}}/results-dylib.json
          echo -e "}}" >> ${{github.workspace}}/results-dylib.json
          rm ${{github.workspace}}/summary.json

      - name: Publish Dyload Test Summary
        if: always()
        run: |
          echo "## Dyload Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          total=$(jq -r '.results.summary.tests' ${{github.workspace}}/results-dylib.json)
          passed=$(jq -r '.results.summary.passed' ${{github.workspace}}/results-dylib.json)
          failed=$(jq -r '.results.summary.failed' ${{github.workspace}}/results-dylib.json)
          timed_out=$(jq -r '.results.summary.skipped' ${{github.workspace}}/results-dylib.json)

          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Tests | $total |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $passed |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $failed |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏱️ Timed out (manual verification needed) | $timed_out |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Individual Module Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          jq -c '.results.tests[]' ${{github.workspace}}/results-dylib.json | while read test_obj; do
            test_name=$(echo "$test_obj" | jq -r '.name')
            test_dir=$(echo "$test_obj" | jq -r '.dir')
            test_count=$(jq '[.sequence[] | select(startswith("hashWait"))] | length' "$test_dir/autotest.json" 2>/dev/null || echo "1")

            status=$(echo "$test_obj" | jq -r '.status')
            failed_hash_ids=$(echo "$test_obj" | jq -r '.failed_hash_ids // ""')
            module_desc=$(jq -r '.description // empty' "$test_dir/autotest.json" 2>/dev/null)
            module_desc=${module_desc:-"(no description)"}
            module_desc=${module_desc//$'\n'/ }
            module_desc=${module_desc//|/\\|}

            if [ "$status" = "passed" ]; then
              status_icon="✅ Passed"
            elif [ "$status" = "timeout; manual verification needed" ]; then
              status_icon="⏱️ Timed out (manual verification needed)"
            elif [[ "$status" == skipped* ]]; then
              status_icon="⚠️ Skipped (emulator non-randomness quirk)"
            else
              status_icon="❌ Failed"
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### $test_name" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Module | Tests | Status | Description |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|--------|-------------|" >> $GITHUB_STEP_SUMMARY
            echo "| $test_name |  | $status_icon | $module_desc |" >> $GITHUB_STEP_SUMMARY

            jq -r '.sequence // [] | map(select(startswith("hashWait")))[]' "$test_dir/autotest.json" 2>/dev/null | while read -r seq_entry; do
              hash_id="${seq_entry#hashWait|}"
              hash_desc=$(jq -r ".hashes[\"$hash_id\"].description // \"(no description)\"" "$test_dir/autotest.json" 2>/dev/null)
              hash_desc=${hash_desc//$'\n'/ }
              hash_desc=${hash_desc//|/\\|}
              if [ "$status" = "passed" ]; then
                hash_status="✅ Passed"
              elif [ "$status" = "timeout; manual verification needed" ]; then
                hash_status="⏱️ Unknown (run timed out)"
              elif [[ "$status" == skipped* ]]; then
                hash_status="⚠️ Skipped (emulator non-randomness quirk)"
              elif [[ ",$failed_hash_ids," == *",$hash_id,"* ]]; then
                hash_status="❌ Failed"
              else
                hash_status="✅ Passed"
              fi
              echo "|  | $hash_id | $hash_status | $hash_desc |" >> $GITHUB_STEP_SUMMARY
            done
            if [ "$test_count" -eq 0 ]; then
              echo "|  | (none) | $status_icon | (no hash tests) |" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Dyload Results Logfile
        uses: actions/upload-artifact@v4
        with:
          name: results-dylib.json
          path: ${{github.workspace}}/results-dylib.json

      - name: Remove CEmu Rom
        if: always()
        run: shred -u "${{env.AUTOTESTER_ROM}}" 2>/dev/null || true
