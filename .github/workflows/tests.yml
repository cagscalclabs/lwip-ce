name: Tests

# staging is the integration branch. Ordinary pushes only inspect commit
# subjects for an urgent prefix. A nightly scheduler dispatches this same
# workflow on staging when staging received an unpromoted commit in the last
# 24 hours. Successful full runs fast-forward master to the exact tested SHA.

on:
  schedule:
    # 03:00 UTC is 10/11 PM US Eastern, depending on daylight saving time.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run the full gate (select the staging branch when dispatching)
        required: false
        type: boolean
        default: true
      reason:
        description: Why the gate was requested
        required: false
        default: manual
  push:
    branches: [staging]

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: lwip-staging-gate
  cancel-in-progress: false

env:
  CEDEV: ${{ github.workspace }}/CEdev
  CEDEV_BIN: ${{ github.workspace }}/CEdev/bin
  AUTOTESTER_ROM: ${{ github.workspace }}/${{ vars.AUTOTESTER_ROM }}
  LWIP_DYLIB_TESTS: ${{ github.workspace }}/tests/unit
  LWIP_TESTS_COMMON: ${{ github.workspace }}/tests/common

jobs:
  decide:
    name: Decide whether to run the gate
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    outputs:
      run_gate: ${{ steps.decision.outputs.run_gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate trigger
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          FORCE_GATE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          echo "run_gate=false" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = schedule ]; then
            git fetch --no-tags origin master staging
            if [ -n "$(git rev-list --max-count=1 --since='24 hours ago' origin/master..origin/staging)" ]; then
              echo "staging changed in the last 24 hours; dispatching the gate on staging"
              gh workflow run tests.yml --repo "${{ github.repository }}" --ref staging \
                -f force=true -f reason=nightly
            else
              echo "No unpromoted staging commits from the last 24 hours."
            fi
            exit 0
          fi

          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            if [ "${{ github.ref_name }}" != staging ]; then
              echo "::error::Manual staging gates must be dispatched with the staging branch selected."
              exit 1
            fi
            if [ "$FORCE_GATE" = true ]; then
              echo "run_gate=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          range="${BEFORE_SHA}..${GITHUB_SHA}"
          if [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            range="$GITHUB_SHA"
          fi
          if git log --format=%s "$range" \
            | grep -Eiq '^#(hotfix|urgent|priority)([[:space:]:-]|$)'; then
            echo "Priority commit detected; running the full gate now."
            echo "run_gate=true" >> "$GITHUB_OUTPUT"
          else
            echo "No priority prefix; this push will be covered by the nightly gate."
          fi

  build:
    name: Build lwIP
    needs: decide
    if: needs.decide.outputs.run_gate == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lwIP-CE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Load pinned CI dependency versions
        id: ci_versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make tar curl unzip zip libxml2-utils unifdef python3 python3-clang libclang-dev

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/CEdev
          key: ${{ runner.os }}-cedev-${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "github.com/CE-Programming/toolchain/releases/download/${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}/CEdev-Linux.tar.gz" | tar xz

      - name: Add CEdev to PATH
        run: |
          echo "${{ github.workspace }}/CEdev/bin" >> "$GITHUB_PATH"

      - name: Checkout fixed convbin branch
        uses: actions/checkout@v4
        with:
          repository: mateoconlechuga/convbin
          ref: R_Z80_BYTE012
          path: ${{ github.workspace }}/convbin
          submodules: recursive
          persist-credentials: false

      - name: Build fixed convbin from source
        run: |
          make -C "${{ github.workspace }}/convbin" -j"$(nproc)"
          cmake -E copy "${{ github.workspace }}/convbin/bin/convbin" "${{ env.CEDEV_BIN }}/convbin"
          "${{ env.CEDEV_BIN }}/convbin" --version || true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install ce-libify
        run: |
          git clone --depth 1 --branch "${{ steps.ci_versions.outputs.CE_LIBIFY_REF }}" https://github.com/alessiodam/toolchain_libify.git "${{ runner.temp }}/ce-libify"
          GOCACHE="${{ runner.temp }}/go-cache" go test -C "${{ runner.temp }}/ce-libify" ./...
          make -C "${{ runner.temp }}/ce-libify" install CEDEV="${{ env.CEDEV }}" PYTHON=python3
          ce-libify --version

      - name: Audit fatal error logging
        run: python3 tests/host/error_logging/test_error_sites.py

      - name: make dylib-release
        id: make_dylib
        run: make dylib-release

      - name: verify libload lib
        id: make_libload
        run: |
          test -f "${{ github.workspace }}/build/lwip.8xv"
          test -f "${{ github.workspace }}/build/lwip.lib"
          test -f "${{ env.CEDEV }}/lib/libload/lwip.lib"
          test -d "${{ env.CEDEV }}/include/lwip"
          test -f "${{ github.workspace }}/lwip.zip"

      - name: build Wi-Fi examples
        id: make_wifi_examples
        run: |
          make -C examples/wifi_ping
          make -C examples/wifi_api
          mkdir -p wifi-examples
          cp examples/wifi_ping/bin/LWPING.8xp examples/wifi_api/bin/LWWIFI.8xp wifi-examples/

      - name: upload Wi-Fi examples artifact
        id: upload_wifi_examples
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-wifi-examples
          path: ${{ github.workspace }}/wifi-examples/
          if-no-files-found: error

      - name: upload build artifact
        id: upload_build_artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-latest
          path: ${{ github.workspace }}/build/
          if-no-files-found: error

      - name: upload release zip artifact
        id: upload_zip_artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lwip-release-zip
          path: ${{ github.workspace }}/lwip.zip
          if-no-files-found: error

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## lwIP Latest Dylib"
            echo
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| make dylib-release | ${{ steps.make_dylib.outcome }} |"
            echo "| make libload lib | ${{ steps.make_libload.outcome }} |"
            echo "| build Wi-Fi examples | ${{ steps.make_wifi_examples.outcome }} |"
            echo "| upload build artifact | ${{ steps.upload_build_artifact.outcome }} |"
            echo "| upload release zip artifact | ${{ steps.upload_zip_artifact.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

    outputs:
      build_success: ${{ steps.upload_build_artifact.outcome == 'success' && steps.upload_zip_artifact.outcome == 'success' }}

  dylib_unit_tests:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Load pinned CI dependency versions
        id: ci_versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y make tar wget

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{github.workspace}}/CEdev
          key: ${{ runner.os }}-cedev-${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "github.com/CE-Programming/toolchain/releases/download/${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}/CEdev-Linux.tar.gz" | tar xz

      - name: Add CEdev to PATH
        run: |
          echo "${{github.workspace}}/CEdev/bin" >> $GITHUB_PATH
          echo $GITHUB_PATH

      - name: Download this run's lwip-latest artifact
        uses: actions/download-artifact@v4
        with:
          name: lwip-latest
          path: ${{ github.workspace }}/release

      - name: Verify build artifact contents
        run: |
          test -f "${{github.workspace}}/release/appinst/lwIPINST.8xp"
          test -n "$(find "${{github.workspace}}/release/appinst" -name 'LWIP.*.8xv' -print -quit)"
          ls -lh "${{github.workspace}}/release"

      - name: Install lwip.lib + headers into CEdev
        run: |
          mkdir -p "${{env.CEDEV}}/lib/libload" "${{env.CEDEV}}/include"
          cp "${{github.workspace}}/release/lwip.lib" "${{env.CEDEV}}/lib/libload/lwip.lib"
          cp "${{github.workspace}}/release/lwip.h" "${{env.CEDEV}}/include/lwip.h"
          cp -r "${{github.workspace}}/release/lwip" "${{env.CEDEV}}/include/lwip"
          test -f "${{env.CEDEV}}/lib/libload/lwip.lib"
          test -f "${{env.CEDEV}}/include/lwip.h"
          test -d "${{env.CEDEV}}/include/lwip"

      - name: Download CEmu Rom
        run: |
          curl -fSL \
            --retry 3 \
            --retry-delay 2 \
            -o "${{github.workspace}}/CE.rom.enc" \
            https://cagscalclabs.net/restricted/${{ vars.AUTOTESTER_ROM }}.enc

          gpg --batch --yes \
            --passphrase "${{ secrets.AES_ENCRYPT_KEY }}" \
            --output "${{ env.AUTOTESTER_ROM }}" \
            --decrypt "${{github.workspace}}/CE.rom.enc"

          shred -u "${{github.workspace}}/CE.rom.enc"

          if [ ! -f "${{ env.AUTOTESTER_ROM }}" ]; then
            echo "ERROR: ROM file not created"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "${{ env.AUTOTESTER_ROM }}" 2>/dev/null || stat -f%z "${{ env.AUTOTESTER_ROM }}")
          echo "Decrypted ROM size: ${FILE_SIZE} bytes"

      - name: Set up CEmu with emulated networking
        id: cemu
        uses: alessiodam/cemu-net-action@v1
        with:
          cemu-ref: ${{ steps.ci_versions.outputs.CEMU_REF }}

      - name: Install Autotester CLI
        run: |
          cmake -E copy "${{ steps.cemu.outputs.autotester }}" "${{env.CEDEV_BIN}}/cemu-autotester"
          strings "${{env.CEDEV_BIN}}/cemu-autotester" | grep -q "saveVar"

      - name: Prepare shared dyload test files
        run: |
          mkdir -p ${{env.LWIP_TESTS_COMMON}}
          cp "${{github.workspace}}/release/appinst/lwIPINST.8xp" ${{env.LWIP_TESTS_COMMON}}/
          cp "${{github.workspace}}/release/lwip.8xv" ${{env.LWIP_TESTS_COMMON}}/
          for appvar in "${{github.workspace}}"/release/appinst/LWIP.*.8xv; do
            cp "$appvar" "${{env.LWIP_TESTS_COMMON}}/"
          done
          curl -fL \
            -o ${{env.LWIP_TESTS_COMMON}}/lwIPCERT.8xv \
            https://github.com/${{ github.repository }}/releases/download/truststore-latest/lwIPCERT.8xv
          curl -fL \
            -o ${{env.LWIP_TESTS_COMMON}}/clibs.8xg \
            https://github.com/CE-Programming/libraries/releases/latest/download/clibs.8xg
          test -f ${{env.LWIP_TESTS_COMMON}}/clibs.8xg
          test -f ${{env.LWIP_TESTS_COMMON}}/lwIPCERT.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/lwIPINST.8xp
          test -f ${{env.LWIP_TESTS_COMMON}}/lwip.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.0.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.1.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.2.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.3.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.4.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.5.8xv
          test -f ${{env.LWIP_TESTS_COMMON}}/LWIP.6.8xv
          ls -lh ${{env.LWIP_TESTS_COMMON}}
          # The dylib spans as many LWIP.<n>.8xv appvars as it needs; make every
          # autotest.json transfer exactly the ones this build produced.
          python3 tests/common/scripts/sync_appvars.py

      - name: Run Dyload Unit Tests
        run: |
          total_tests=0
          total_passed=0
          total_failed=0
          total_timeout=0
          start_time=$(($(date +%s%N)/1000000))

          # A single hung cemu-autotester run has no other way to be noticed --
          # nothing elsewhere in this job times out, so a stall here would
          # otherwise block the whole job until GitHub's own ~6h ceiling.
          # TEST_TIMEOUT_SECONDS bounds one attempt; a hang is retried up to
          # TEST_MAX_ATTEMPTS times (CEmu/CI flakiness, not necessarily a real
          # bug -- see the Known CI flakiness note below) before giving up and
          # recording "timeout" rather than "failed", since a stall is not the
          # same signal as the autotester actually reporting a mismatch.
          TEST_TIMEOUT_SECONDS=120
          TEST_MAX_ATTEMPTS=3

          while IFS= read -r -d '' test; do
            status=0
            test_dir=$(dirname "$test")
            failed_hash_ids=""
            timed_out=0
            quirk_skipped=0
            test_start=$(($(date +%s%N)/1000000))
            make -C "$test_dir" clean
            make -C "$test_dir" || ((status=$?))
            if [ $status -eq 0 ]; then
              set +e
              for attempt in $(seq 1 "$TEST_MAX_ATTEMPTS"); do
                timeout "${TEST_TIMEOUT_SECONDS}s" \
                  make -C "$test_dir" test 2>&1 | tee "$test_dir/autotest.log"
                status=${PIPESTATUS[0]}
                if [ "$status" -eq 124 ]; then
                  echo "::warning::$(basename "$test_dir") timed out after ${TEST_TIMEOUT_SECONDS}s (attempt $attempt/$TEST_MAX_ATTEMPTS)"
                  timed_out=1
                  continue
                fi
                timed_out=0
                break
              done
              set -e
              if [ "$status" -ne 0 ] && [ "$timed_out" -eq 0 ]; then
                # Autotester reports each mismatched hash on its own line, e.g.:
                #   [Test failed!] Hash #1 ("...") did not match the expected CRC ...
                # Collect every failed hash id (a run can fail more than one).
                failed_hash_ids=$(grep -Eo 'Hash #[0-9]+' "$test_dir/autotest.log" | grep -Eo '[0-9]+' | sort -nu | paste -sd, - || true)

                # Emulator-quirk skip: some units require a physical TRNG that
                # CEmu does not have.  If this unit is in EMULATOR_QUIRK_UNITS,
                # only hash #1 failed, and its observed CRC is 468FCC4B (the
                # "RNG setup timed out" screen), downgrade to skipped+warning.
                unit_name=$(basename "$test_dir")
                if echo " $EMULATOR_QUIRK_UNITS " | grep -qw "$unit_name"; then
                  observed_crc=$(grep 'Hash #1 ' "$test_dir/autotest.log" | grep -Eo '\(got [0-9A-Fa-f]+\)' | grep -Eo '[0-9A-Fa-f]+' | head -1 || true)
                  if [ "$observed_crc" = "468FCC4B" ]; then
                    echo "::warning::$unit_name hash #1 observed CRC 468FCC4B (RNG setup timed out) — emulator has no physical TRNG; marking skipped"
                    status=0
                    quirk_skipped=1
                    failed_hash_ids=""
                  fi
                fi
              fi
            fi
            test_done=$(($(date +%s%N)/1000000))
            test_duration=$((test_done - test_start))
            (( total_tests += 1 ))
            if [ "$quirk_skipped" -eq 1 ]; then
              (( total_timeout += 1 ))
              test_status="skipped; emulator has no physical TRNG — test failed to run due to emulator non-randomness quirk"
            elif [ "$timed_out" -eq 1 ]; then
              (( total_timeout += 1 ))
              test_status="timeout; manual verification needed"
            elif [ $status -eq 0 ]; then
              (( total_passed += 1 ))
              test_status="passed"
            else
              (( total_failed += 1 ))
              test_status="failed"
            fi
            echo -e "{\"name\":\"$(basename "$test_dir")\",\"dir\":\"$test_dir\",\"status\":\"$test_status\",\"duration\":\"$test_duration\",\"failed_hash_ids\":\"$failed_hash_ids\"}" > "$test_dir/result.json"
          done < <(find ${{env.LWIP_DYLIB_TESTS}} -name autotest.json -print0)

          end_time=$(($(date +%s%N)/1000000))
          echo -e "\"summary\":{\"tests\":\"$total_tests\",\"passed\":\"$total_passed\",\"failed\":\"$total_failed\",\"pending\":\"0\",\"skipped\":\"$total_timeout\",\"other\":\"0\",\"start\":\"$start_time\",\"stop\":\"$end_time\"}" > ${{github.workspace}}/summary.json
          cmake -E echo "$total_tests dyload modules tested, $total_passed passed, $total_failed failed, $total_timeout timed out (skipped; manual verification needed)!"
          exit $total_failed

      - name: Generate Dyload JSON Results
        if: always()
        run: |
          echo -e "{\"results\":{" > ${{github.workspace}}/results-dylib.json
          cat ${{github.workspace}}/summary.json >> ${{github.workspace}}/results-dylib.json
          echo -e ",\"tests\":[" >> ${{github.workspace}}/results-dylib.json
          find ${{env.LWIP_DYLIB_TESTS}} -name result.json -print0 | {
            tmp_json=""
            while read -rd '' test; do
              test_dir=$(dirname "$test")
              tmp_json="$tmp_json,$(cat $test_dir/result.json)"
              rm $test_dir/result.json
            done
            tmp_json="${tmp_json:1}"
            echo $tmp_json >> ${{github.workspace}}/results-dylib.json
          }
          echo -e "]" >> ${{github.workspace}}/results-dylib.json
          echo -e "}}" >> ${{github.workspace}}/results-dylib.json
          rm ${{github.workspace}}/summary.json

      - name: Publish Dyload Test Summary
        if: always()
        run: |
          echo "## Dyload Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          total=$(jq -r '.results.summary.tests' ${{github.workspace}}/results-dylib.json)
          passed=$(jq -r '.results.summary.passed' ${{github.workspace}}/results-dylib.json)
          failed=$(jq -r '.results.summary.failed' ${{github.workspace}}/results-dylib.json)
          timed_out=$(jq -r '.results.summary.skipped' ${{github.workspace}}/results-dylib.json)

          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Tests | $total |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $passed |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $failed |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏱️ Timed out (manual verification needed) | $timed_out |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Individual Module Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          jq -c '.results.tests[]' ${{github.workspace}}/results-dylib.json | while read test_obj; do
            test_name=$(echo "$test_obj" | jq -r '.name')
            test_dir=$(echo "$test_obj" | jq -r '.dir')
            test_count=$(jq '[.sequence[] | select(startswith("hashWait"))] | length' "$test_dir/autotest.json" 2>/dev/null || echo "1")

            status=$(echo "$test_obj" | jq -r '.status')
            failed_hash_ids=$(echo "$test_obj" | jq -r '.failed_hash_ids // ""')
            module_desc=$(jq -r '.description // empty' "$test_dir/autotest.json" 2>/dev/null)
            module_desc=${module_desc:-"(no description)"}
            module_desc=${module_desc//$'\n'/ }
            module_desc=${module_desc//|/\\|}

            if [ "$status" = "passed" ]; then
              status_icon="✅ Passed"
            elif [ "$status" = "timeout; manual verification needed" ]; then
              status_icon="⏱️ Timed out (manual verification needed)"
            elif [[ "$status" == skipped* ]]; then
              status_icon="⚠️ Skipped (emulator non-randomness quirk)"
            else
              status_icon="❌ Failed"
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### $test_name" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Module | Tests | Status | Description |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|--------|-------------|" >> $GITHUB_STEP_SUMMARY
            echo "| $test_name |  | $status_icon | $module_desc |" >> $GITHUB_STEP_SUMMARY

            jq -r '.sequence // [] | map(select(startswith("hashWait")))[]' "$test_dir/autotest.json" 2>/dev/null | while read -r seq_entry; do
              hash_id="${seq_entry#hashWait|}"
              hash_desc=$(jq -r ".hashes[\"$hash_id\"].description // \"(no description)\"" "$test_dir/autotest.json" 2>/dev/null)
              hash_desc=${hash_desc//$'\n'/ }
              hash_desc=${hash_desc//|/\\|}
              if [ "$status" = "passed" ]; then
                hash_status="✅ Passed"
              elif [ "$status" = "timeout; manual verification needed" ]; then
                hash_status="⏱️ Unknown (run timed out)"
              elif [[ "$status" == skipped* ]]; then
                hash_status="⚠️ Skipped (emulator non-randomness quirk)"
              elif [[ ",$failed_hash_ids," == *",$hash_id,"* ]]; then
                hash_status="❌ Failed"
              else
                hash_status="✅ Passed"
              fi
              echo "|  | $hash_id | $hash_status | $hash_desc |" >> $GITHUB_STEP_SUMMARY
            done
            if [ "$test_count" -eq 0 ]; then
              echo "|  | (none) | $status_icon | (no hash tests) |" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Dyload Results Logfile
        uses: actions/upload-artifact@v4
        with:
          name: results-dylib.json
          path: ${{github.workspace}}/results-dylib.json

      - name: Remove CEmu Rom
        if: always()
        run: shred -u "${{env.AUTOTESTER_ROM}}" 2>/dev/null || true

  rfc_compliance:
    name: RFC compliance
    needs: build
    if: github.ref == 'refs/heads/staging'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tested staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch current master baseline
        run: git fetch --no-tags origin master

      - name: Review unpromoted source changes for RFC regressions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RFC_BASE_SHA: origin/master
          RFC_HEAD_SHA: ${{ github.sha }}
          RFC_REVIEW_MODEL: ${{ vars.RFC_REVIEW_MODEL || 'gpt-6-sol' }}
          RFC_REVIEW_CYBER_PROGRAM: daybreak_blue
          RFC_VERIFY_MODEL: ${{ vars.RFC_VERIFY_MODEL || 'gpt-6-astra' }}
          RFC_VERIFY_CYBER_PROGRAM: standard
        run: python3 .github/scripts/rfc_review.py

  acvp:
    needs: build
    name: ACVP JSON over CEmu RPC
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install host reference dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-cryptography

      - name: Generate 416-vector differential corpus
        run: python3 tests/validation/acvp/generate_vectors.py

      - name: Check host ACVP parsing
        run: python3 tests/validation/acvp/selftest.py

      - id: env
        uses: ./.github/actions/emulator-env
        with:
          rom-name: ${{ vars.AUTOTESTER_ROM }}
          rom-key: ${{ secrets.AES_ENCRYPT_KEY }}

      - name: Build ACVP calculator service
        run: make -C tests/validation/acvp

      - name: Process ACVP fixture through CEmu
        id: run_acvp
        run: |
          sudo --preserve-env=AUTOTESTER_ROM python3 tests/validation/acvp/run.py \
            --autotester "${{ steps.env.outputs.autotester }}" \
            --usb "${{ steps.env.outputs.usb-step }}" \
            --timeout-ms 60000000

      - name: Publish ACVP results
        if: always()
        run: |
          python3 tests/validation/acvp/summary.py \
            --run-outcome "${{ steps.run_acvp.outcome }}" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Remove CEmu ROM
        if: always()
        run: shred -u "$AUTOTESTER_ROM" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acvp-validation
          path: |
            tests/validation/acvp/artifacts/acvp-validation.vectors
            tests/validation/acvp/summary.md
            tests/validation/acvp/NETLOG.8xv
            tests/validation/acvp/autotest.json
          if-no-files-found: ignore

  semgrep_scan:
    needs: build
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      # A Docker image with Semgrep installed. Do not change this.
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build SAST target list
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add source https://github.com/lwip-tcpip/lwip.git || true
          git fetch --no-tags source master

          BASE="$(git merge-base HEAD FETCH_HEAD || true)"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          git diff --numstat --diff-filter=ACMR "$BASE" HEAD -- src \
            | awk '($1 != "0" || $2 != "0") {print $3}' \
            | grep -E '\.(c|h)$' \
            | sort -u > semgrep-targets.txt || true

          echo "SAST baseline: $BASE"
          echo "SAST targets:"
          cat semgrep-targets.txt

      # Scan files that are new or changed relative to upstream lwIP.
      - run: |
          if [ -s semgrep-targets.txt ]; then
            set --
            while IFS= read -r target; do
              set -- "$@" --include "$target"
            done < semgrep-targets.txt
            semgrep ci --sarif "$@" > semgrep.sarif
          else
            printf '{"version":"2.1.0","runs":[]}\n' > semgrep.sarif
          fi
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        if: always()

  analyze:
    needs: build
    name: CodeQL Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout lwIP-CE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Load pinned CI dependency versions
        id: ci_versions
        run: grep -E '^[A-Z_]+=' .github/ci-versions.env >> "$GITHUB_OUTPUT"

      - name: Compute upstream-unchanged paths to ignore
        id: ignore
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote add upstream-lwip https://github.com/lwip-tcpip/lwip.git || true
          git fetch --no-tags upstream-lwip master

          BASE="$(git merge-base HEAD FETCH_HEAD || true)"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          echo "CodeQL exclusion baseline: $BASE"

          # Files genuinely touched since the upstream merge-base (content
          # changes only -- numstat's own 0/0 filter drops mode-only diffs
          # like an executable-bit flip with no byte change).
          git diff --numstat --diff-filter=ACMR "$BASE" HEAD -- src \
            | awk '($1 != "0" || $2 != "0") {print $3}' \
            | grep -E '\.(c|h)$' \
            | sort -u > /tmp/changed_files.txt || true

          find src -type f \( -iname '*.c' -o -iname '*.h' \) \
            | sed 's|^\./||' | sort -u > /tmp/all_src_files.txt

          comm -23 /tmp/all_src_files.txt /tmp/changed_files.txt > /tmp/unchanged_files.txt

          echo "Excluding $(wc -l < /tmp/unchanged_files.txt) byte-identical-to-upstream files from CodeQL."

          {
            echo "name: \"lwIP-CE CodeQL config (generated)\""
            echo "paths-ignore:"
            while IFS= read -r f; do
              [ -n "$f" ] && echo "  - \"$f\""
            done < /tmp/unchanged_files.txt
          } > "$GITHUB_WORKSPACE/codeql-config.generated.yml"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          config-file: ${{ github.workspace }}/codeql-config.generated.yml

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make tar curl unzip libxml2-utils unifdef python3 python3-clang libclang-dev

      - name: Cache CEdev Toolchain
        id: cedev-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/CEdev
          key: ${{ runner.os }}-cedev-${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}

      - name: Download and extract CEdev
        if: steps.cedev-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "github.com/CE-Programming/toolchain/releases/download/${{ steps.ci_versions.outputs.TOOLCHAIN_REF }}/CEdev-Linux.tar.gz" | tar xz

      - name: Add CEdev to PATH
        run: |
          echo "${{ github.workspace }}/CEdev/bin" >> "$GITHUB_PATH"

      - name: Checkout fixed convbin branch
        uses: actions/checkout@v4
        with:
          repository: mateoconlechuga/convbin
          ref: R_Z80_BYTE012
          path: ${{ github.workspace }}/convbin
          submodules: recursive
          persist-credentials: false

      - name: Build fixed convbin from source
        run: |
          make -C "${{ github.workspace }}/convbin" -j"$(nproc)"
          cmake -E copy "${{ github.workspace }}/convbin/bin/convbin" "${{ env.CEDEV_BIN }}/convbin"
          "${{ env.CEDEV_BIN }}/convbin" --version || true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install ce-libify
        run: |
          git clone --depth 1 --branch "${{ steps.ci_versions.outputs.CE_LIBIFY_REF }}" https://github.com/alessiodam/toolchain_libify.git "${{ runner.temp }}/ce-libify"
          GOCACHE="${{ runner.temp }}/go-cache" go test -C "${{ runner.temp }}/ce-libify" ./...
          make -C "${{ runner.temp }}/ce-libify" install CEDEV="${{ env.CEDEV }}" PYTHON=python3
          ce-libify --version

      - name: make dylib (traced by CodeQL)
        run: make dylib

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"

  dast_report:
    needs: build
    name: DAST report + gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep full history so the report's src_commit remains useful
          # provenance even though freshness is decided by src_hash.
          fetch-depth: 0
          # src/ includes the X25519 gitlink, and its working-tree contents are
          # part of the source fingerprint produced by the local DAST runner.
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check report covers current src/ contents
        run: |
          readarray -t report_source < <(python3 -c "
          import json
          with open('tests/dast.json') as f:
              d = json.load(f)
          print(d.get('src_commit', ''))
          print(d.get('src_hash', ''))
          ")
          report_commit=${report_source[0]}
          report_hash=${report_source[1]}
          current_hash=$(python3 build-tools/dast/lwip-dast.py --src-hash)
          if [ -z "$report_hash" ]; then
            echo "::error::dast.json has no src_hash — re-run the DAST harness once to record the exact tested source contents."
            exit 1
          fi
          echo "Report commit : $report_commit (provenance only)"
          echo "Report src hash: $report_hash"
          echo "Current src hash: $current_hash"
          if [ "$report_hash" != "$current_hash" ]; then
            echo "::error::dast.json covers different src/ contents — re-run the DAST harness and commit the refreshed report."
            exit 1
          fi
          echo "Report covers the current src/ contents."

      - name: Render report to job summary and gate on failures
        run: |
          python3 build-tools/dast/dast_report.py --summary "$GITHUB_STEP_SUMMARY"

  nettest:
    needs: build
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [sockets, raw, tls, records, server, perf]
    steps:
      - uses: actions/checkout@v4

      - id: env
        uses: ./.github/actions/emulator-env
        with:
          rom-name: ${{ vars.AUTOTESTER_ROM }}
          rom-key: ${{ secrets.AES_ENCRYPT_KEY }}

      - name: Install scapy
        run: sudo pip install --break-system-packages scapy

      - name: Test host endpoint corroboration
        if: matrix.suite == 'tls'
        run: python3 tests/net/test_host_corroboration.py

      - name: Build ${{ matrix.suite }}
        run: make -C tests/net ${{ matrix.suite }}

      - name: Run ${{ matrix.suite }}
        run: |
          sudo --preserve-env=AUTOTESTER_ROM,GITHUB_STEP_SUMMARY python3 tests/net/run.py \
            --suite ${{ matrix.suite }} --pcap tests/net/${{ matrix.suite }}.pcap \
            --autotester "${{ steps.env.outputs.autotester }}" --usb "${{ steps.env.outputs.usb-step }}"

      - name: Remove CEmu Rom
        if: always()
        run: shred -u "$AUTOTESTER_ROM" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: net-${{ matrix.suite }}
          path: |
            tests/net/NETLOG-*.8xv
            tests/net/metrics.json
            tests/net/endpoint-probes.json
            tests/net/*.pcap
            tests/net/autotest-*.json
          if-no-files-found: ignore

  dast:
    needs: build
    name: DAST (live, emulated)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check calc-side test list matches the manifest
        run: |
          python3 build-tools/dast/lwip-dast.py --gen-header
          git diff --exit-code tests/profiling/lwip_dast/src/dast_tests.h

      - id: env
        uses: ./.github/actions/emulator-env
        with:
          rom-name: ${{ vars.AUTOTESTER_ROM }}
          rom-key: ${{ secrets.AES_ENCRYPT_KEY }}

      - name: Install scapy
        run: sudo pip install --break-system-packages scapy

      - name: Build LWDAST
        run: make -C tests/profiling/lwip_dast RELEASE_ROOT="${{ github.workspace }}/release"

      - name: Run DAST probes
        run: |
          sudo --preserve-env=AUTOTESTER_ROM python3 tests/profiling/lwip_dast/ci.py \
            --autotester "${{ steps.env.outputs.autotester }}" --usb "${{ steps.env.outputs.usb-step }}"

      - name: Render report and gate on failures
        run: python3 build-tools/dast/dast_report.py --summary "$GITHUB_STEP_SUMMARY"

      - name: Remove CEmu Rom
        if: always()
        run: shred -u "$AUTOTESTER_ROM" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-live
          path: |
            tests/dast.json
            tests/profiling/lwip_dast/autotester.log
          if-no-files-found: ignore

  host_tests:
    needs: build
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Run host tests
        run: |
          status=0
          for test in tests/host/*/run.py tests/host/*/test_*.py; do
            echo "::group::$test"
            python3 "$test" || { status=1; echo "::error file=$test::$test failed"; }
            echo "::endgroup::"
          done
          exit $status

  fuzz:
    needs: build
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [json, xml, url, base64, asn1, pcap, x509, ws, tls]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Restore corpus
        uses: actions/cache@v5
        with:
          path: tests/fuzz/out/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        run: make -C tests/fuzz run-${{ matrix.target }} FUZZ_SECONDS=300

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: tests/fuzz/out/artifacts/
          if-no-files-found: ignore

  promote:
    name: Promote tested staging SHA to master
    permissions:
      contents: write
    needs: [decide, build, dylib_unit_tests, rfc_compliance, acvp, semgrep_scan, analyze, dast_report, nettest, dast, host_tests, fuzz]
    if: >-
      always() && needs.decide.outputs.run_gate == 'true' &&
      needs.build.result == 'success' && needs.dylib_unit_tests.result == 'success' &&
      needs.rfc_compliance.result == 'success' &&
      needs.acvp.result == 'success' && needs.semgrep_scan.result == 'success' &&
      needs.analyze.result == 'success' && needs.dast_report.result == 'success' &&
      needs.nettest.result == 'success' && needs.dast.result == 'success' &&
      needs.host_tests.result == 'success' && needs.fuzz.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward master to the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master staging
          if [ "$(git rev-parse origin/master)" = "$GATE_SHA" ]; then
            echo "master already points at the tested commit."
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/master "$GATE_SHA"; then
            echo "::error::master is not an ancestor of the tested staging commit; refusing a non-fast-forward promotion."
            exit 1
          fi
          gh api --method PATCH "repos/${{ github.repository }}/git/refs/heads/master" \
            -f sha="$GATE_SHA" -F force=false

  notify_failure:
    name: Notify commit author on failure
    permissions:
      contents: write
    needs: [decide, build, dylib_unit_tests, rfc_compliance, acvp, semgrep_scan, analyze, dast_report, nettest, dast, host_tests, fuzz]
    if: >-
      always() && needs.decide.outputs.run_gate == 'true' && (
      needs.build.result != 'success' || needs.dylib_unit_tests.result != 'success' ||
      needs.rfc_compliance.result != 'success' ||
      needs.acvp.result != 'success' || needs.semgrep_scan.result != 'success' ||
      needs.analyze.result != 'success' || needs.dast_report.result != 'success' ||
      needs.nettest.result != 'success' || needs.dast.result != 'success' ||
      needs.host_tests.result != 'success' || needs.fuzz.result != 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Add or update a commit comment
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          UNIT_RESULT: ${{ needs.dylib_unit_tests.result }}
          RFC_RESULT: ${{ needs.rfc_compliance.result }}
          ACVP_RESULT: ${{ needs.acvp.result }}
          SAST_RESULT: ${{ needs.semgrep_scan.result }}
          CODEQL_RESULT: ${{ needs.analyze.result }}
          DAST_REPORT_RESULT: ${{ needs.dast_report.result }}
          NETWORK_RESULT: ${{ needs.nettest.result }}
          LIVE_DAST_RESULT: ${{ needs.dast.result }}
          HOST_RESULT: ${{ needs.host_tests.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          set -euo pipefail
          commit_json=$(gh api "repos/${{ github.repository }}/commits/$GATE_SHA")
          author=$(jq -r '.author.login // .committer.login // empty' <<< "$commit_json")
          author_name=$(jq -r '.commit.author.name // "the commit author"' <<< "$commit_json")
          mention="**$author_name**"
          if [ -n "$author" ]; then mention="@$author"; fi

          body="$RUNNER_TEMP/staging-gate-failure.md"
          {
            echo '<!-- staging-gate-failure -->'
            echo "$mention, the staging gate failed for commit $GATE_SHA."
            echo
            echo '| Gate | Result |'
            echo '|---|---|'
            echo "| Build | $BUILD_RESULT |"
            echo "| Unit tests | $UNIT_RESULT |"
            echo "| RFC compliance | $RFC_RESULT |"
            echo "| ACVP | $ACVP_RESULT |"
            echo "| SAST | $SAST_RESULT |"
            echo "| CodeQL | $CODEQL_RESULT |"
            echo "| DAST report | $DAST_REPORT_RESULT |"
            echo "| Network tests | $NETWORK_RESULT |"
            echo "| Live DAST | $LIVE_DAST_RESULT |"
            echo "| Host tests | $HOST_RESULT |"
            echo "| Fuzzing | $FUZZ_RESULT |"
            echo
            echo "[View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > "$body"

          comment_id=$(gh api "repos/${{ github.repository }}/commits/$GATE_SHA/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- staging-gate-failure -->")) | .id' | head -1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/comments/$comment_id" \
              -f body="$(cat "$body")"
          else
            gh api --method POST "repos/${{ github.repository }}/commits/$GATE_SHA/comments" \
              -f body="$(cat "$body")"
          fi

