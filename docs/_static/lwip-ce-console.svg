      <circle cx="222" cy="285" r="6"/>
      <circle cx="249" cy="285" r="6"/>
      <circle cx="276" cy="285" r="6"/>
      <circle cx="303" cy="285" r="6"/>
      <circle cx="330" cy="285" r="6"/>
      <circle cx="357" cy="285" r="6"/>
