<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">lwIP-CE calculator network illustration</title>
  <desc id="desc">A stylized TI-84 Plus CE calculator connected to network nodes.</desc>
  <defs>
    <linearGradient id="body" x1="160" x2="470" y1="60" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#343942"/>
      <stop offset="1" stop-color="#14171d"/>
    </linearGradient>
    <linearGradient id="screen" x1="205" x2="430" y1="95" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d7ffd7"/>
      <stop offset="1" stop-color="#87c98d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="760" height="520" rx="38" fill="#f7f3e8"/>
  <path d="M536 95c56 11 102 48 122 99 24 62 4 142-45 185-53 47-138 54-202 18-63-35-100-110-84-179 18-77 100-139 209-123z" fill="#ffd35f" opacity=".35"/>
  <path d="M96 420c62-8 88-50 127-78 54-38 122-30 183 5 53 31 93 74 163 62 43-7 72-34 98-63" fill="none" stroke="#df5b4f" stroke-width="10" stroke-linecap="round" opacity=".25"/>

  <g stroke="#2e6f83" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M455 260h70"/>
    <path d="M525 260v-92h72"/>
    <path d="M525 260v94h72"/>
    <path d="M525 260h105"/>
  </g>

  <g fill="#2e6f83">
    <circle cx="610" cy="168" r="28"/>
    <circle cx="642" cy="260" r="32"/>
    <circle cx="610" cy="354" r="28"/>
  </g>
  <g fill="#fff7df" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">
    <text x="610" y="175">TLS</text>
    <text x="642" y="267">IP</text>
    <text x="610" y="361">USB</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="118" y="40" width="338" height="448" rx="34" fill="url(#body)"/>
    <rect x="153" y="77" width="268" height="168" rx="18" fill="#0e1815"/>
    <rect x="171" y="96" width="232" height="130" rx="9" fill="url(#screen)"/>
    <g font-family="Menlo, Consolas, monospace" fill="#12351f">
      <text x="191" y="130" font-size="19" font-weight="700">lwIP-CE</text>
      <text x="191" y="160" font-size="15">usb0: link up</text>
      <text x="191" y="184" font-size="15">dhcp: address ok</text>
      <text x="191" y="208" font-size="15">tls: entropy yes</text>
    </g>
    <rect x="170" y="266" width="234" height="38" rx="12" fill="#ecf0f5"/>
    <g fill="#ecf0f5">
      <rect x="170" y="326" width="50" height="34" rx="9"/>
      <rect x="232" y="326" width="50" height="34" rx="9"/>
      <rect x="294" y="326" width="50" height="34" rx="9"/>
      <rect x="356" y="326" width="50" height="34" rx="9"/>
      <rect x="170" y="375" width="50" height="34" rx="9"/>
      <rect x="232" y="375" width="50" height="34" rx="9"/>
      <rect x="294" y="375" width="50" height="34" rx="9"/>
      <rect x="356" y="375" width="50" height="34" rx="9"/>
      <rect x="170" y="424" width="50" height="34" rx="9"/>
      <rect x="232" y="424" width="50" height="34" rx="9"/>
      <rect x="294" y="424" width="50" height="34" rx="9"/>
      <rect x="356" y="424" width="50" height="34" rx="9"/>
